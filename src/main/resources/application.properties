spring.application.name=slm

spring.datasource.url=jdbc:postgresql://localhost:5432/slm
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SLM_USER:simon}
spring.datasource.password=N0m1596.

# HTTP Session Lifespan (Supports uninterrupted 100+ minute lecture note editing)
server.servlet.session.timeout=300m

# HikariCP Connection Pool (Proactively maintains healthy connections across long idle periods)
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=150000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15

spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB

hibernate.type.preferred_duration_jdbc_type=INTERVAL_SECOND
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Berlin

spring.thymeleaf.cache=false
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

logging.file.name=slm.log

# Spring AI MCP Server Configuration
spring.ai.mcp.server.name=slm-mcp-server
spring.ai.mcp.server.version=0.0.3-rc16
spring.ai.mcp.server.type=sync
slm.mcp.api-key=${SLM_MCP_API_KEY:slm-mcp-secret-key-2026}


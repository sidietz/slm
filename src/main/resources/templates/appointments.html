<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Appointments')}">
    <title>Appointments</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Medical Appointments', 'Track doctor consultations, appointments, and travel time', 'bi bi-hospital', 'theme-medical', '/misc-management', 'Misc Dashboard')}"></header>

    <main class="container my-5">
        <!-- Quick Nav -->
        <div class="d-flex gap-2 mb-4">
            <a href="/appointments" class="btn btn-outline-primary btn-sm active"><i class="bi bi-calendar2-check me-1"></i> Appointments</a>
            <a href="/appointment" class="btn btn-outline-secondary btn-sm"><i class="bi bi-sliders me-1"></i> Date Filter</a>
            <a href="/doctors" class="btn btn-outline-secondary btn-sm"><i class="bi bi-person-badge me-1"></i> Doctors</a>
            <a href="/specialities" class="btn btn-outline-secondary btn-sm"><i class="bi bi-mortarboard me-1"></i> Specialities</a>
        </div>

        <div class="row g-4 mb-5">
            <!-- Full-Width Appointment Table Card -->
            <div class="col-12">
                <div class="card slm-table-card shadow-sm">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div class="d-flex align-items-center gap-2">
                            <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-clipboard2-pulse me-2 text-primary"></i>Appointment Log</h5>
                            <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(appointments)} + ' appointments'">0 appointments</span>
                        </div>
                        <button type="button" class="btn btn-primary fw-semibold" onclick="openCreateAppointmentModal()">
                            <i class="bi bi-plus-circle me-1"></i> Add Appointment
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0 text-nowrap">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 60px;">ID</th>
                                    <th>Doctor</th>
                                    <th>Speciality</th>
                                    <th>Comment</th>
                                    <th>Departure</th>
                                    <th>Arrival</th>
                                    <th>Start</th>
                                    <th>End</th>
                                    <th>Home</th>
                                    <th>Consult Duration</th>
                                    <th>Total Duration</th>
                                    <th class="text-end pe-3" style="width: 100px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${appointments}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td class="fw-semibold text-dark" th:text="${e.doctor != null ? e.doctor.lastname : '—'}"></td>
                                    <td>
                                        <span class="badge bg-light text-dark border px-2 py-1" th:text="${e.doctor != null and e.doctor.speciality != null ? e.doctor.speciality.title : '—'}"></span>
                                    </td>
                                    <td class="text-muted small" th:text="${e.comment}"></td>
                                    <td class="text-muted small" th:text="${#temporals.format(e.departure, 'dd.MM.yyyy HH:mm')}"></td>
                                    <td class="text-muted small" th:text="${#temporals.format(e.arrival, 'dd.MM.yyyy HH:mm')}"></td>
                                    <td class="text-muted small" th:text="${#temporals.format(e.start, 'dd.MM.yyyy HH:mm')}"></td>
                                    <td class="text-muted small" th:text="${#temporals.format(e.end, 'dd.MM.yyyy HH:mm')}"></td>
                                    <td class="text-muted small" th:text="${#temporals.format(e.arrivalHome, 'dd.MM.yyyy HH:mm')}"></td>
                                    <td><span class="code-pill" th:text="${{e.duration}}"></span></td>
                                    <td><span class="code-pill" th:text="${{e.completeDuration}}"></span></td>
                                    <td class="text-end pe-3">
                                        <button type="button" 
                                                class="btn btn-sm btn-outline-primary" 
                                                title="Edit Appointment"
                                                th:data-id="${e.id}"
                                                th:data-doctor-id="${e.doctor != null ? e.doctor.id : ''}"
                                                th:data-comment="${e.comment}"
                                                th:data-departure="${e.departure}"
                                                th:data-arrival="${e.arrival}"
                                                th:data-start="${e.start}"
                                                th:data-end="${e.end}"
                                                th:data-arrival-home="${e.arrivalHome}"
                                                onclick="populateEditAppointmentModal(this)">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(appointments)}">
                                    <td colspan="12" class="text-center py-4 text-muted">No appointments recorded yet. Click "Add Appointment" above to log your first consultation.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Dual-Purpose Modal for Adding and Editing Appointments -->
    <div class="modal fade" id="appointmentModal" tabindex="-1" aria-labelledby="appointmentModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-white py-3 border-bottom">
                    <h5 class="modal-title fw-bold text-dark" id="appointmentModalLabel">
                        <i class="bi bi-calendar-plus me-2 text-primary"></i>Schedule / Log Appointment
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="appointmentForm" th:action="@{/appointments}" method="post">
                    <input type="hidden" id="modalAppointmentId" name="id" value="">
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="modalDoctorId" class="form-label fw-semibold">Doctor <span class="text-danger">*</span></label>
                                <select id="modalDoctorId" name="doctor" class="form-select" required>
                                    <option value="">— Select Doctor —</option>
                                    <option th:each="p : ${doctors}" th:value="${p.id}"
                                            th:text="${p.lastname + (p.speciality != null ? ' (' + p.speciality.title + ')' : '') + (p.airDistance != null ? ' [' + p.airDistance + ' km]' : '')}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="modalComment" class="form-label fw-semibold">Comment / Purpose <span class="text-danger">*</span></label>
                                <input type="text" id="modalComment" name="comment" class="form-control" placeholder="e.g. Annual Checkup, Dental Cleaning" required>
                            </div>

                            <div class="col-md-4">
                                <label for="modalDeparture" class="form-label fw-semibold">Departure from Home <span class="text-danger">*</span></label>
                                <input type="datetime-local" id="modalDeparture" name="departure" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label for="modalArrival" class="form-label fw-semibold">Arrival at Practice <span class="text-danger">*</span></label>
                                <input type="datetime-local" id="modalArrival" name="arrival" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label for="modalArrivalHome" class="form-label fw-semibold">Arrival Back Home <span class="text-danger">*</span></label>
                                <input type="datetime-local" id="modalArrivalHome" name="arrivalHome" class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label for="modalStart" class="form-label fw-semibold">Consultation Start <span class="text-danger">*</span></label>
                                <input type="datetime-local" id="modalStart" name="start" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label for="modalEnd" class="form-label fw-semibold">Consultation End <span class="text-danger">*</span></label>
                                <input type="datetime-local" id="modalEnd" name="end" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-top py-3">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="modalAppointmentSubmitBtn" class="btn btn-primary fw-semibold px-4">
                            <i class="bi bi-plus-circle me-1"></i> Save Appointment
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
        function openCreateAppointmentModal() {
            document.getElementById('appointmentForm').reset();
            document.getElementById('modalAppointmentId').value = '';
            document.getElementById('appointmentModalLabel').innerHTML = '<i class="bi bi-calendar-plus me-2 text-primary"></i>Schedule / Log Appointment';
            document.getElementById('modalAppointmentSubmitBtn').innerHTML = '<i class="bi bi-plus-circle me-1"></i> Save Appointment';
            document.getElementById('modalAppointmentSubmitBtn').className = 'btn btn-primary fw-semibold px-4';

            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const formatDT = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
            
            const nowStr = formatDT(now);
            document.getElementById('modalDeparture').value = nowStr;
            document.getElementById('modalArrival').value = nowStr;
            document.getElementById('modalStart').value = nowStr;
            document.getElementById('modalEnd').value = nowStr;
            document.getElementById('modalArrivalHome').value = nowStr;

            const modal = new bootstrap.Modal(document.getElementById('appointmentModal'));
            modal.show();
        }

        function populateEditAppointmentModal(btn) {
            const ds = btn.dataset;
            document.getElementById('modalAppointmentId').value = ds.id || '';
            document.getElementById('modalDoctorId').value = ds.doctorId || '';
            document.getElementById('modalComment').value = ds.comment || '';
            document.getElementById('modalDeparture').value = ds.departure || '';
            document.getElementById('modalArrival').value = ds.arrival || '';
            document.getElementById('modalStart').value = ds.start || '';
            document.getElementById('modalEnd').value = ds.end || '';
            document.getElementById('modalArrivalHome').value = ds.arrivalHome || '';

            document.getElementById('appointmentModalLabel').innerHTML = `<i class="bi bi-pencil-square me-2 text-warning"></i>Edit Appointment #${ds.id}`;
            document.getElementById('modalAppointmentSubmitBtn').innerHTML = '<i class="bi bi-check2-circle me-1"></i> Update Appointment';
            document.getElementById('modalAppointmentSubmitBtn').className = 'btn btn-warning fw-semibold px-4';

            const modal = new bootstrap.Modal(document.getElementById('appointmentModal'));
            modal.show();
        }
    </script>
</body>
</html>

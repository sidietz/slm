<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Contractors')}">
    <title>Contractors</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Contractors', 'Manage recurring service providers, utilities, and insurers', 'bi bi-person-workspace', 'theme-finance', '/spend-management', 'Spend Dashboard')}"></header>

    <main class="container my-5">
        <div class="row g-4 mb-5">
            <div class="col-lg-7">
                <div class="card slm-table-card shadow-sm h-100">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-building me-2 text-primary"></i>Contractor Directory</h5>
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(contractors)} + ' contractors'">0 contractors</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 80px;">ID</th>
                                    <th class="pe-3">Name</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${contractors}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td class="pe-3 fw-semibold text-dark" th:text="${e.name}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(contractors)}">
                                    <td colspan="2" class="text-center py-4 text-muted">No contractors configured yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card slm-form-card shadow-sm">
                    <div class="card-header py-3 border-0">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-plus-circle me-2 text-primary"></i>Add Contractor</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/contractors}" th:object="${contractor}" method="post">
                            <div class="mb-4">
                                <label for="contractorName" class="form-label">Contractor Name <span class="text-danger">*</span></label>
                                <input type="text" id="contractorName" th:field="*{name}" class="form-control" placeholder="e.g. Deutsche Telekom, Stadtwerke" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-plus-circle me-1"></i> Add Contractor
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

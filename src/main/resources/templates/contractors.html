<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Contractors')}">
    <title>Contractors</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Contractors', 'Manage recurring service providers, utilities, and insurers', 'bi bi-person-workspace', 'theme-finance', '/spend-management', 'Spend Dashboard')}"></header>

    <main class="container my-5">
        <div class="row g-4 mb-5">
            <!-- Full-Width Contractors Table Card -->
            <div class="col-12">
                <div class="card slm-table-card shadow-sm">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div class="d-flex align-items-center gap-2">
                            <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-building me-2 text-primary"></i>Contractor Directory</h5>
                            <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(contractors)} + ' contractors'">0 contractors</span>
                        </div>
                        <button type="button" class="btn btn-primary fw-semibold" onclick="openCreateContractorModal()">
                            <i class="bi bi-plus-circle me-1"></i> Add Contractor
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 80px;">ID</th>
                                    <th>Contractor Name</th>
                                    <th class="text-end pe-3" style="width: 100px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${contractors}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td class="fw-semibold text-dark">
                                        <i class="bi bi-building me-2 text-muted"></i>
                                        <span th:text="${e.name}"></span>
                                    </td>
                                    <td class="text-end pe-3">
                                        <button type="button" 
                                                class="btn btn-sm btn-outline-primary" 
                                                title="Edit Contractor"
                                                th:data-id="${e.id}"
                                                th:data-name="${e.name}"
                                                onclick="populateEditContractorModal(this)">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(contractors)}">
                                    <td colspan="3" class="text-center py-4 text-muted">No contractors configured yet. Click "Add Contractor" above to add your first contractor.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Dual-Purpose Modal for Adding and Editing Contractors -->
    <div class="modal fade" id="contractorModal" tabindex="-1" aria-labelledby="contractorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-white py-3 border-bottom">
                    <h5 class="modal-title fw-bold text-dark" id="contractorModalLabel">
                        <i class="bi bi-building-add me-2 text-primary"></i>Add Contractor
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="contractorForm" th:action="@{/contractors}" method="post">
                    <input type="hidden" id="modalContractorId" name="id" value="">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label for="modalContractorName" class="form-label fw-semibold">Contractor Name <span class="text-danger">*</span></label>
                            <input type="text" id="modalContractorName" name="name" class="form-control" placeholder="e.g. Deutsche Telekom, Stadtwerke, Allianz" required>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-top py-3">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="modalContractorSubmitBtn" class="btn btn-primary fw-semibold px-4">
                            <i class="bi bi-plus-circle me-1"></i> Save Contractor
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
        function openCreateContractorModal() {
            document.getElementById('contractorForm').reset();
            document.getElementById('modalContractorId').value = '';
            document.getElementById('contractorModalLabel').innerHTML = '<i class="bi bi-building-add me-2 text-primary"></i>Add Contractor';
            document.getElementById('modalContractorSubmitBtn').innerHTML = '<i class="bi bi-plus-circle me-1"></i> Save Contractor';
            document.getElementById('modalContractorSubmitBtn').className = 'btn btn-primary fw-semibold px-4';

            const modal = new bootstrap.Modal(document.getElementById('contractorModal'));
            modal.show();
        }

        function populateEditContractorModal(btn) {
            const ds = btn.dataset;
            document.getElementById('modalContractorId').value = ds.id || '';
            document.getElementById('modalContractorName').value = ds.name || '';

            document.getElementById('contractorModalLabel').innerHTML = `<i class="bi bi-pencil-square me-2 text-warning"></i>Edit Contractor #${ds.id}`;
            document.getElementById('modalContractorSubmitBtn').innerHTML = '<i class="bi bi-check2-circle me-1"></i> Update Contractor';
            document.getElementById('modalContractorSubmitBtn').className = 'btn btn-warning fw-semibold px-4';

            const modal = new bootstrap.Modal(document.getElementById('contractorModal'));
            modal.show();
        }
    </script>
</body>
</html>

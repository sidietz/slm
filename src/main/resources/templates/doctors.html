<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Doctors')}">
    <title>Doctors</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Doctors', 'Physician and specialist directory with clinic locations', 'bi bi-person-badge', 'theme-medical', '/misc-management', 'Misc Dashboard')}"></header>

    <main class="container my-5">
        <!-- Quick Nav -->
        <div class="d-flex gap-2 mb-4">
            <a href="/appointments" class="btn btn-outline-secondary btn-sm"><i class="bi bi-calendar2-check me-1"></i> Appointments</a>
            <a href="/doctors" class="btn btn-outline-primary btn-sm active"><i class="bi bi-person-badge me-1"></i> Doctors</a>
            <a href="/specialities" class="btn btn-outline-secondary btn-sm"><i class="bi bi-mortarboard me-1"></i> Specialities</a>
        </div>

        <div class="row g-4 mb-5">
            <!-- Full-Width Doctors Table Card -->
            <div class="col-12">
                <div class="card slm-table-card shadow-sm">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div class="d-flex align-items-center gap-2">
                            <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-hospital me-2 text-primary"></i>Doctor Directory</h5>
                            <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(doctors)} + ' doctors'">0 doctors</span>
                        </div>
                        <button type="button" class="btn btn-primary fw-semibold" onclick="openCreateDoctorModal()">
                            <i class="bi bi-plus-circle me-1"></i> Add Doctor
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 60px;">ID</th>
                                    <th>Name</th>
                                    <th>Speciality</th>
                                    <th>Practice Location</th>
                                    <th>Address / Place</th>
                                    <th>City</th>
                                    <th>PLZ</th>
                                    <th>Air Dist</th>
                                    <th class="text-end pe-3" style="width: 100px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${doctors}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td class="fw-semibold text-dark" th:text="${(e.firstname != null ? e.firstname + ' ' : '') + e.lastname}"></td>
                                    <td>
                                        <span class="badge bg-light text-dark border px-2 py-1" th:text="${e.speciality != null ? e.speciality.title : '—'}"></span>
                                    </td>
                                    <td>
                                        <a th:if="${e.point != null}" th:href="@{/points}" class="badge bg-light text-primary border text-decoration-none px-2 py-1">
                                            <i class="bi bi-geo-alt me-1"></i><span th:text="${e.point.name}"></span>
                                        </a>
                                        <span th:unless="${e.point != null}" class="text-muted">—</span>
                                    </td>
                                    <td class="text-muted small" th:text="${e.place}"></td>
                                    <td th:text="${e.city}"></td>
                                    <td class="font-monospace small" th:text="${e.plz}"></td>
                                    <td class="fw-semibold text-primary" th:text="${e.airDistance != null ? e.airDistance + ' km' : '—'}"></td>
                                    <td class="text-end pe-3">
                                        <button type="button" 
                                                class="btn btn-sm btn-outline-primary" 
                                                title="Edit Doctor"
                                                th:data-id="${e.id}"
                                                th:data-firstname="${e.firstname}"
                                                th:data-lastname="${e.lastname}"
                                                th:data-speciality-id="${e.speciality != null ? e.speciality.id : ''}"
                                                th:data-point-id="${e.point != null ? e.point.id : ''}"
                                                th:data-base-point-id="${e.basePoint != null ? e.basePoint.id : ''}"
                                                th:data-place="${e.place}"
                                                th:data-city="${e.city}"
                                                th:data-plz="${e.plz}"
                                                onclick="populateEditDoctorModal(this)">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(doctors)}">
                                    <td colspan="9" class="text-center py-4 text-muted">No doctors registered yet. Click "Add Doctor" above to register your first doctor.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Dual-Purpose Modal for Adding and Editing Doctors -->
    <div class="modal fade" id="doctorModal" tabindex="-1" aria-labelledby="doctorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-white py-3 border-bottom">
                    <h5 class="modal-title fw-bold text-dark" id="doctorModalLabel">
                        <i class="bi bi-hospital me-2 text-primary"></i>Add Doctor
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="doctorForm" th:action="@{/doctors}" method="post">
                    <input type="hidden" id="modalDoctorId" name="id" value="">
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="modalFirstname" class="form-label fw-semibold">First Name <span class="text-danger">*</span></label>
                                <input type="text" id="modalFirstname" name="firstname" class="form-control" placeholder="e.g. Maria" required>
                            </div>
                            <div class="col-md-6">
                                <label for="modalLastname" class="form-label fw-semibold">Last Name <span class="text-danger">*</span></label>
                                <input type="text" id="modalLastname" name="lastname" class="form-control" placeholder="e.g. Weber" required>
                            </div>
                            <div class="col-md-6">
                                <label for="modalSpeciality" class="form-label fw-semibold">Medical Speciality</label>
                                <select id="modalSpeciality" name="speciality" class="form-select">
                                    <option value="">— Select Speciality —</option>
                                    <option th:each="p : ${specialities}" th:value="${p.id}" th:text="${p.title}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="modalPoint" class="form-label fw-semibold">Practice Location Point</label>
                                <select id="modalPoint" name="point" class="form-select">
                                    <option value="">— Select clinic location point —</option>
                                    <option th:each="pt : ${points}" th:value="${pt.id}" th:text="${pt.name}"></option>
                                </select>
                            </div>
                            <div class="col-md-12">
                                <label for="modalBasePoint" class="form-label fw-semibold">Distance Origin (Home / Base)</label>
                                <select id="modalBasePoint" name="basePoint" class="form-select">
                                    <option th:each="pt : ${points}" th:value="${pt.id}" th:text="${pt.name + (pt.isHome ? ' [Home Base]' : '')}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="modalPlace" class="form-label fw-semibold">Street / Place <span class="text-danger">*</span></label>
                                <input type="text" id="modalPlace" name="place" class="form-control" placeholder="e.g. Hauptstraße 12" required>
                            </div>
                            <div class="col-md-4">
                                <label for="modalCity" class="form-label fw-semibold">City <span class="text-danger">*</span></label>
                                <input type="text" id="modalCity" name="city" class="form-control" placeholder="e.g. München" required>
                            </div>
                            <div class="col-md-2">
                                <label for="modalPlz" class="form-label fw-semibold">PLZ <span class="text-danger">*</span></label>
                                <input type="text" id="modalPlz" name="plz" class="form-control" placeholder="80331" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-top py-3">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="modalDoctorSubmitBtn" class="btn btn-primary fw-semibold px-4">
                            <i class="bi bi-plus-circle me-1"></i> Save Doctor
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
        function openCreateDoctorModal() {
            document.getElementById('doctorForm').reset();
            document.getElementById('modalDoctorId').value = '';
            document.getElementById('doctorModalLabel').innerHTML = '<i class="bi bi-hospital me-2 text-primary"></i>Add Doctor';
            document.getElementById('modalDoctorSubmitBtn').innerHTML = '<i class="bi bi-plus-circle me-1"></i> Save Doctor';
            document.getElementById('modalDoctorSubmitBtn').className = 'btn btn-primary fw-semibold px-4';

            const modal = new bootstrap.Modal(document.getElementById('doctorModal'));
            modal.show();
        }

        function populateEditDoctorModal(btn) {
            const ds = btn.dataset;
            document.getElementById('modalDoctorId').value = ds.id || '';
            document.getElementById('modalFirstname').value = ds.firstname || '';
            document.getElementById('modalLastname').value = ds.lastname || '';
            document.getElementById('modalSpeciality').value = ds.specialityId || '';
            document.getElementById('modalPoint').value = ds.pointId || '';
            document.getElementById('modalBasePoint').value = ds.basePointId || '';
            document.getElementById('modalPlace').value = ds.place || '';
            document.getElementById('modalCity').value = ds.city || '';
            document.getElementById('modalPlz').value = ds.plz || '';

            document.getElementById('doctorModalLabel').innerHTML = `<i class="bi bi-pencil-square me-2 text-warning"></i>Edit Doctor #${ds.id}`;
            document.getElementById('modalDoctorSubmitBtn').innerHTML = '<i class="bi bi-check2-circle me-1"></i> Update Doctor';
            document.getElementById('modalDoctorSubmitBtn').className = 'btn btn-warning fw-semibold px-4';

            const modal = new bootstrap.Modal(document.getElementById('doctorModal'));
            modal.show();
        }
    </script>
</body>
</html>

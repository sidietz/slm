<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Doctors')}">
    <title>Doctors</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Doctors', 'Physician and specialist directory with clinic locations', 'bi bi-person-badge', 'theme-medical', '/misc-management', 'Misc Dashboard')}"></header>

    <main class="container my-5">
        <!-- Quick Nav -->
        <div class="d-flex gap-2 mb-4">
            <a href="/appointments" class="btn btn-outline-secondary btn-sm"><i class="bi bi-calendar2-check me-1"></i> Appointments</a>
            <a href="/doctors" class="btn btn-outline-primary btn-sm active"><i class="bi bi-person-badge me-1"></i> Doctors</a>
            <a href="/specialities" class="btn btn-outline-secondary btn-sm"><i class="bi bi-mortarboard me-1"></i> Specialities</a>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-lg-8">
                <div class="card slm-table-card shadow-sm h-100">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-hospital me-2 text-primary"></i>Doctor Directory</h5>
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(doctors)} + ' doctors'">0 doctors</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 60px;">ID</th>
                                    <th>Name</th>
                                    <th>Speciality</th>
                                    <th>Address / Place</th>
                                    <th>City</th>
                                    <th>PLZ</th>
                                    <th class="pe-3">Air Dist</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${doctors}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td class="fw-semibold text-dark" th:text="${(e.firstname != null ? e.firstname + ' ' : '') + e.lastname}"></td>
                                    <td>
                                        <span class="badge bg-light text-dark border px-2 py-1" th:text="${e.speciality != null ? e.speciality.title : '—'}"></span>
                                    </td>
                                    <td class="text-muted small" th:text="${e.place}"></td>
                                    <td th:text="${e.city}"></td>
                                    <td class="font-monospace small" th:text="${e.plz}"></td>
                                    <td class="pe-3 fw-semibold text-primary" th:text="${e.airDistance != null ? e.airDistance + ' km' : '—'}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(doctors)}">
                                    <td colspan="7" class="text-center py-4 text-muted">No doctors registered yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card slm-form-card shadow-sm">
                    <div class="card-header py-3 border-0">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-plus-circle me-2 text-primary"></i>Add Doctor</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/doctors}" th:object="${doctor}" method="post">
                            <div class="mb-3">
                                <label for="speciality" class="form-label">Medical Speciality</label>
                                <select id="speciality" class="form-select" th:field="*{speciality}">
                                    <option th:each="p : ${specialities}" th:value="${p.id}" th:text="${p.title}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="firstname" class="form-label">First Name <span class="text-danger">*</span></label>
                                <input type="text" id="firstname" th:field="*{firstname}" class="form-control" placeholder="e.g. Maria" required>
                            </div>
                            <div class="mb-3">
                                <label for="lastname" class="form-label">Last Name <span class="text-danger">*</span></label>
                                <input type="text" id="lastname" th:field="*{lastname}" class="form-control" placeholder="e.g. Weber" required>
                            </div>
                            <div class="mb-3">
                                <label for="place" class="form-label">Street / Place <span class="text-danger">*</span></label>
                                <input type="text" id="place" th:field="*{place}" class="form-control" placeholder="e.g. Hauptstraße 12" required>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-7">
                                    <label for="city" class="form-label">City <span class="text-danger">*</span></label>
                                    <input type="text" id="city" th:field="*{city}" class="form-control" placeholder="e.g. München" required>
                                </div>
                                <div class="col-5">
                                    <label for="plz" class="form-label">PLZ <span class="text-danger">*</span></label>
                                    <input type="text" id="plz" th:field="*{plz}" class="form-control" placeholder="80331" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="airDistance" class="form-label">Air Distance (km) <span class="text-danger">*</span></label>
                                <input type="number" step="0.001" id="airDistance" th:field="*{airDistance}" class="form-control" placeholder="0.000" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-plus-circle me-1"></i> Register Doctor
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

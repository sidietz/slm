<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Activities')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Activities', 'Track daily tasks, general activities, and personal time investments', 'bi bi-card-checklist', 'theme-activity', '/activity-management', 'Dashboard')}"></header>

    <main class="container mb-5">
        <!-- Add Activity Form Card -->
        <section class="card slm-form-card mb-4">
            <h2 class="text-danger"><i class="bi bi-plus-circle me-2"></i>Log New Activity</h2>
            <form th:action="@{/activities}" th:object="${activity}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Activity Title <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Clean garage, write documentation" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Category <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{type}" required>
                            <option value="">-- Select Category --</option>
                            <option th:each="category : ${activityTypes}" th:value="${category.id}" th:text="${category.name}"></option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Location / Place</label>
                        <input type="text" th:field="*{location}" class="form-control" placeholder="Home, Office, Garden..." />
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Start Time <span class="text-danger">*</span></label>
                        <input type="datetime-local" th:field="*{start}" class="form-control" required />
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">End Time <span class="text-danger">*</span></label>
                        <input type="datetime-local" th:field="*{end}" class="form-control" required />
                    </div>

                    <div class="col-12 text-end mt-3">
                        <button type="submit" class="btn btn-danger px-4 fw-semibold">
                            <i class="bi bi-save me-1"></i> Save Activity
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Activities Table Card -->
        <section class="card slm-table-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 fw-bold mb-0 text-dark">
                    <i class="bi bi-list-check me-2 text-danger"></i>Logged Activities
                    <span class="badge bg-danger-subtle text-danger ms-2 fs-6" th:text="${activities != null ? activities.size() : 0}">0</span>
                </h2>
                <a th:href="@{/activity-types}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-tags me-1"></i> Manage Categories
                </a>
            </div>

            <div class="table-responsive">
                <table class="table slm-table align-middle">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Location</th>
                            <th>Start</th>
                            <th>End</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${activities == null or activities.empty}">
                            <td colspan="5" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                No activities recorded yet. Log your first activity above!
                            </td>
                        </tr>
                        <tr th:each="activity : ${activities}">
                            <td>
                                <strong th:text="${activity.title}">Title</strong>
                            </td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${activity.type != null ? activity.type.name : 'General'}">Category</span>
                            </td>
                            <td class="text-muted" th:text="${activity.location != null and !activity.location.empty ? activity.location : '-'}">Place</td>
                            <td class="small" th:text="${#temporals.format(activity.start, 'dd.MM.yyyy HH:mm')}">01.01.2026 10:00</td>
                            <td class="small" th:text="${#temporals.format(activity.end, 'dd.MM.yyyy HH:mm')}">01.01.2026 11:30</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

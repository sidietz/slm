<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Specialities Overview')}">
    <title>Specialities Overview</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Specialities Overview', 'All registered fields of medical practice', 'bi bi-mortarboard', 'theme-medical', '/specialities', 'Manage Specialities')}"></header>

    <main class="container my-5">
        <div class="card slm-table-card shadow-sm">
            <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-tags me-2 text-primary"></i>Medical Specialities</h5>
                <a href="/specialities" class="btn btn-sm btn-primary"><i class="bi bi-plus-circle me-1"></i> Manage Specialities</a>
            </div>
            <div class="table-responsive">
                <table class="table slm-table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="ps-3" style="width: 80px;">ID</th>
                            <th class="pe-3">Title</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${specialities}">
                            <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                            <td class="pe-3 fw-semibold text-dark" th:text="${e.title}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(specialities)}">
                            <td colspan="2" class="text-center py-4 text-muted">No specialities found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Reading Sessions')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Reading Sessions', 'Track reading time, page counts, and speed (pages/hr)', 'bi bi-book-half', 'theme-books', '/sessions?type=READING', 'Sessions Hub')}"></header>

    <main class="container mb-5">
        <!-- Add Reading Session Form Card -->
        <section class="card card-custom p-4 mb-4">
            <h2 class="h4 fw-bold mb-3 text-info"><i class="bi bi-plus-circle me-2"></i>Log Reading Session</h2>
            <form th:action="@{/reading-sessions}" th:object="${readingsession}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Book <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{book}" required>
                            <option value="">-- Select Book --</option>
                            <option th:each="p : ${books}" th:value="${p.id}" th:text="${p.title}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Start Page <span class="text-danger">*</span></label>
                        <input type="number" th:field="*{startPageCount}" class="form-control" min="0" required />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">End Page <span class="text-danger">*</span></label>
                        <input type="number" th:field="*{endPageCount}" class="form-control" min="0" required />
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Start Time <span class="text-danger">*</span></label>
                        <input type="datetime-local" th:field="*{start}" class="form-control" required />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">End Time <span class="text-danger">*</span></label>
                        <input type="datetime-local" th:field="*{end}" class="form-control" required />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Break (minutes)</label>
                        <input type="number" name="breakMinutes" class="form-control" min="0" value="0" />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Rating (1-5)</label>
                        <select th:field="*{focusRating}" class="form-select">
                            <option value="">-- No rating --</option>
                            <option value="5">⭐⭐⭐⭐⭐ (5 - Captivating)</option>
                            <option value="4">⭐⭐⭐⭐ (4 - Engaging)</option>
                            <option value="3">⭐⭐⭐ (3 - Moderate)</option>
                            <option value="2">⭐⭐ (2 - Slow)</option>
                            <option value="1">⭐ (1 - Hard to read)</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Key Highlights / Summary</label>
                        <input type="text" th:field="*{outcomeSummary}" class="form-control" placeholder="Key takeaways from this chapter..." />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Notes / Comment</label>
                        <input type="text" th:field="*{comment}" class="form-control" placeholder="Quotes or reflection..." />
                    </div>

                    <div class="col-12 text-end mt-3">
                        <button type="submit" class="btn btn-info px-4 fw-semibold text-white">
                            <i class="bi bi-save me-1"></i> Save Reading Session
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Sessions Table Card -->
        <section class="card card-custom p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 fw-bold mb-0 text-dark">
                    <i class="bi bi-journal-text me-2 text-info"></i>Logged Reading Sessions
                    <span class="badge bg-info-subtle text-info ms-2 fs-6" th:text="${readingsessions != null ? readingsessions.size() : 0}">0</span>
                </h2>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Book Title</th>
                            <th>Pages</th>
                            <th>Speed</th>
                            <th>Start</th>
                            <th>End</th>
                            <th>Net Duration</th>
                            <th>Break</th>
                            <th>Rating</th>
                            <th>Summary &amp; Notes</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${readingsessions == null or readingsessions.empty}">
                            <td colspan="10" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                No reading sessions logged yet. Record your reading progress above!
                            </td>
                        </tr>
                        <tr th:each="e : ${readingsessions}">
                            <td>
                                <strong th:text="${e.book != null ? e.book.title : 'Book'}">Title</strong>
                            </td>
                            <td>
                                <span class="badge bg-light text-dark border">
                                    <span th:text="${e.startPageCount}">0</span> &rarr; <span th:text="${e.endPageCount}">0</span>
                                </span>
                                <small class="text-muted ms-1" th:if="${e.endPageCount != null and e.startPageCount != null}">
                                    (<span th:text="${e.endPageCount - e.startPageCount}">0</span> pp)
                                </small>
                            </td>
                            <td>
                                <span class="badge bg-info text-white" th:if="${e.readingSpeed != null}" th:text="${#numbers.formatDecimal(e.readingSpeed, 1, 1) + ' p/h'}">30 p/h</span>
                                <span class="text-muted small" th:if="${e.readingSpeed == null}">-</span>
                            </td>
                            <td class="small" th:text="${#temporals.format(e.start, 'dd.MM.yyyy HH:mm')}">01.01.2026 14:00</td>
                            <td class="small" th:text="${#temporals.format(e.end, 'dd.MM.yyyy HH:mm')}">01.01.2026 15:00</td>
                            <td>
                                <span class="badge bg-info-subtle text-info-emphasis" th:text="${{e.netDuration != null ? e.netDuration : e.duration}}">01:00</span>
                            </td>
                            <td class="small text-muted" th:text="${{e.breakDuration}}">00:00</td>
                            <td>
                                <span th:if="${e.focusRating != null and e.focusRating > 0}" class="star-rating">
                                    <span th:each="i : ${#numbers.sequence(1, e.focusRating)}">★</span>
                                </span>
                                <span th:if="${e.focusRating == null or e.focusRating == 0}" class="text-muted small">-</span>
                            </td>
                            <td class="small" style="max-width: 250px;">
                                <div th:if="${e.outcomeSummary != null and !e.outcomeSummary.empty}" class="fw-semibold text-truncate" th:text="${e.outcomeSummary}">Summary</div>
                                <div th:if="${e.comment != null and !e.comment.empty}" class="text-muted text-truncate" th:text="${e.comment}">Comment</div>
                            </td>
                            <td class="text-end">
                                <form th:action="@{'/sessions/delete/' + ${e.id} + '?returnType=READING'}" method="post" class="d-inline"
                                      onsubmit="return confirm('Delete this reading session?');">
                                    <button type="submit" class="btn btn-outline-danger btn-sm" title="Delete session">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

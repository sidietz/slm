<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Routes')}">
    <title>Routes</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Travel Routes', 'Waypoint-to-waypoint paths, air distances, and drive distances', 'bi bi-map', 'theme-cars', '/misc-management', 'Misc Dashboard')}"></header>

    <main class="container my-5">
        <!-- Quick Nav -->
        <div class="d-flex gap-2 mb-4">
            <a href="/cars" class="btn btn-outline-secondary btn-sm"><i class="bi bi-car-front me-1"></i> Vehicles</a>
            <a href="/car-trips" class="btn btn-outline-secondary btn-sm"><i class="bi bi-sign-turn-right me-1"></i> Trips</a>
            <a href="/routes" class="btn btn-outline-primary btn-sm active"><i class="bi bi-map me-1"></i> Routes</a>
            <a href="/points" class="btn btn-outline-secondary btn-sm"><i class="bi bi-geo-alt me-1"></i> Points</a>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-lg-8">
                <div class="card slm-table-card shadow-sm h-100">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-signpost me-2 text-primary"></i>Configured Routes</h5>
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(routes)} + ' routes'">0 routes</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 60px;">ID</th>
                                    <th>Name</th>
                                    <th>Description</th>
                                    <th>Start Point</th>
                                    <th>End Point</th>
                                    <th>Air Dist</th>
                                    <th class="pe-3">Drive Dist</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${routes}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td class="fw-semibold text-dark" th:text="${e.name}"></td>
                                    <td class="text-muted small" th:text="${e.description}"></td>
                                    <td>
                                        <span class="badge bg-light text-dark border px-2 py-1" th:text="${e.start != null ? e.start.name : '—'}"></span>
                                    </td>
                                    <td>
                                        <span class="badge bg-light text-dark border px-2 py-1" th:text="${e.end != null ? e.end.name : '—'}"></span>
                                    </td>
                                    <td class="text-muted" th:text="${e.airDistance != null ? e.airDistance + ' km' : '—'}"></td>
                                    <td class="pe-3 fw-semibold text-primary" th:text="${e.driveDistance != null ? e.driveDistance + ' km' : '—'}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(routes)}">
                                    <td colspan="7" class="text-center py-4 text-muted">No routes recorded yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card slm-form-card shadow-sm">
                    <div class="card-header py-3 border-0">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-plus-circle me-2 text-primary"></i>Add Route</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/routes}" th:object="${route}" method="post">
                            <div class="mb-3">
                                <label for="startPoint" class="form-label">Start Point</label>
                                <select id="startPoint" class="form-select" th:field="*{start}">
                                    <option th:each="a : ${points}" th:value="${a.id}" th:text="${a.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="endPoint" class="form-label">End Point</label>
                                <select id="endPoint" class="form-select" th:field="*{end}">
                                    <option th:each="a : ${points}" th:value="${a.id}" th:text="${a.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="name" class="form-label">Route Name <span class="text-danger">*</span></label>
                                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="e.g. Home to Office" required>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <input type="text" id="description" th:field="*{description}" class="form-control" placeholder="e.g. Via Highway A9">
                            </div>
                            <div class="mb-3">
                                <label for="airDistance" class="form-label">Air Distance (km) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" id="airDistance" th:field="*{airDistance}" class="form-control" placeholder="0.00" required>
                            </div>
                            <div class="mb-4">
                                <label for="driveDistance" class="form-label">Drive Distance (km) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" id="driveDistance" th:field="*{driveDistance}" class="form-control" placeholder="0.00" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-plus-circle me-1"></i> Add Route
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Routes</title>
<link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"
	rel="stylesheet" />
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"
	defer></script>
</head>

<body class="container mt-5">
	<h1 class="mb-4">Routes</h1>

	<table class="table table-striped table-hover">
		<thead class="table-dark">
			<tr>
				<td>ID</td>
				<td>name</td>
				<td>description</td>
				<td>start</td>
				<td>end</td>
				<td>air distance</td>
				<td>drive distance</td>
			</tr>
		</thead>
		<tbody>
			<tr th:each="e : ${routes}">
				<td th:text="${e.id}"></td>
				<td th:text="${e.name}"></td>
				<td th:text="${e.description}"></td>
				<td th:text="${e.start.name}"></td>
				<td th:text="${e.end.name}"></td>
				<td th:text="${e.airDistance}"></td>
				<td th:text="${e.driveDistance}"></td>
			</tr>
		</tbody>
	</table>

	<h2 class="mt-5">Add Route</h2>
	<form action="#" th:action="@{/routes}" th:object="${route}" method="post" class="mb-5">
		<div class="mb-3">
			<label for="startId" class="form-label">Start:</label>
			<select class="form-select" name="selectStart"
				onchange="updateAuthor(event)" th:field="*{start}">
				<option th:each="a : ${points}" th:value="${a.id}"
					th:text="${a.name}"></option>
			</select>
		</div>
		<div class="mb-3">
			<label for="startId" class="form-label">End:</label>
			<select class="form-select" name="selectEnd"
				onchange="updateAuthor2(event)" th:field="*{end}">
				<option th:each="a : ${points}" th:value="${a.id}"
					th:text="${a.name}"></option>
			</select>
		</div>
		<div class="mb-3">
			<label for="name" class="form-label">Name:</label> <input type="text"
				th:field="*{name}" class="form-control" required>
		</div>
		<div class="mb-3">
			<label for="description" class="form-label">Description:</label> <input
				type="text" th:field="*{description}" class="form-control">
		</div>
		<div class="mb-3">
			<label for="title" class="form-label">Air Distance:</label>
			<input type="number" step="0.01" th:field="*{airDistance}" class="form-control" required>
		</div>
		<div class="mb-3">
			<label for="title" class="form-label">Drive Distance:</label>
			<input type="number" step="0.01" th:field="*{driveDistance}" class="form-control" required>
		</div>	
		<button type="submit" class="btn btn-primary">Add route</button>
	</form>
	<a href="/cars" class="btn btn-secondary">View Cars</a>
    <a href="/points" class="btn btn-secondary">View Points</a>
    <a href="/routes" class="btn btn-secondary">View Routes</a>
    <a href="/misc-management" class="btn btn-secondary">Back to Dashboard</a>
</body>
</html>

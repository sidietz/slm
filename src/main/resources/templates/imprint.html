<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('About & Imprint')}">
    <title>About & Imprint</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('About & Legal Imprint', 'Application architecture, credits, and open-source licensing', 'bi bi-info-circle', 'theme-misc', '/', 'Home')}"></header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card slm-card border-0 shadow-sm p-4 bg-white mb-4">
                    <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                        <div class="p-3 rounded-circle bg-primary-subtle text-primary">
                            <i class="bi bi-cpu fs-3"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-1 text-dark">Self-Log Management (SLM)</h4>
                            <p class="text-muted mb-0 small">A unified personal intelligence system built with Spring Boot & Java 27</p>
                        </div>
                    </div>

                    <div class="mb-4" th:if="${msgs != null and !#lists.isEmpty(msgs)}">
                        <h6 class="fw-semibold text-dark mb-3"><i class="bi bi-megaphone me-2 text-primary"></i>System Notes</h6>
                        <div class="alert alert-light border p-3 mb-2" th:each="e : ${msgs}">
                            <p class="mb-0 text-dark" th:text="${e}"></p>
                        </div>
                    </div>

                    <div class="p-3 bg-light rounded-3 d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center gap-3">
                            <i class="bi bi-github fs-3 text-dark"></i>
                            <div>
                                <span class="fw-semibold text-dark d-block">Open Source Repository</span>
                                <span class="text-muted small">Contribute, audit, or inspect the source codebase</span>
                            </div>
                        </div>
                        <a href="https://github.com/sidietz/slm" target="_blank" rel="noopener noreferrer" class="btn btn-outline-dark btn-sm">
                            <i class="bi bi-box-arrow-up-right me-1"></i> github.com/sidietz/slm
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

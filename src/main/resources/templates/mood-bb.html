<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Analytics | SLM</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/slm.css}" rel="stylesheet" />
    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"
        integrity="sha512-vc58qvvBdrDR4etbxMdlTt4GBQk1qjvyORR2nrsPsFPyrs+/u5c3+1Ct6upOgdZoIl7eq6k3a1UPDSNAQi/32A=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/billboard.js/3.16.0/billboard.min.js"
        integrity="sha512-HPcVm27xXkAoXgeg7jiK4Y9kIbXbwk2GiOxAzQ+EwdA3TNYtFAK0tYHoFS7KAK9zNRf89Oa5Qtnkw5gDpDR7Ww=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/billboard.js/3.16.0/billboard.min.css"
        integrity="sha512-njOj5MWC/MCTRlxjIsftPrGL3nuexguTsEN1qE8eLU6LZW1ZyccshJ1a2QneVxsyeDjbEqXl9TJNfCFUj8pDDg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Mood Trends & Analytics', 'Longitudinal tracking of happiness, energy impetus, and stress', 'bi bi-graph-up', 'theme-habit', '/moods', 'Mood Tracker')}"></header>

    <main class="container mb-5">
        <!-- Chart Card -->
        <section class="card slm-card mb-4 p-4">
            <h2 class="h5 fw-bold text-dark mb-3"><i class="bi bi-graph-up me-2 text-primary"></i>Emotional Trajectory Over Time</h2>
            <div id="chart" style="min-height: 320px;"></div>
        </section>

        <!-- Moods Table Card -->
        <section class="card slm-table-card" th:unless="${#lists.isEmpty(moods)}">
            <h2 class="h5 fw-bold text-dark mb-3"><i class="bi bi-emoji-smile me-2 text-primary"></i>Recent Mood Records</h2>
            <div class="table-responsive">
                <table class="table slm-table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Date</th>
                            <th>Happiness</th>
                            <th>Impetus</th>
                            <th>Stress</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${moods}">
                            <td class="text-muted small" th:text="${e.id}">1</td>
                            <td class="small" th:text="${#temporals.format(e.date, 'dd.MM.yyyy')}">01.01.2026</td>
                            <td>
                                <span class="badge bg-success-subtle text-success" th:text="${e.happiness} + ' / 10'">8 / 10</span>
                            </td>
                            <td>
                                <span class="badge bg-primary-subtle text-primary" th:text="${e.impetus} + ' / 10'">7 / 10</span>
                            </td>
                            <td>
                                <span class="badge bg-danger-subtle text-danger" th:text="${e.stress} + ' / 10'">3 / 10</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
    function getData2() {
        let url = "/api/moods";
        fetch(url).then((response) => {
            return response.json();
        }).then((data) => {
            return convertToBb(data);
        }).catch((error) => console.error('Error fetching mood data:', error));
    }

    function convertToBb(rawData) {
        let x = ["x"];
        let d1 = ["Happiness"];
        let d2 = ["Impetus"];
        let d3 = ["Stress"];

        for (let e of rawData) {
            let ldt = e.date ? e.date.split("T")[0] : "";
            x.push(ldt);
            d1.push(e.happiness);
            d2.push(e.impetus);
            d3.push(e.stress);
        }

        chart.load({
            columns: [x, d1, d2, d3]
        });

        chart.axis.max(10);
        chart.axis.min(1);
    }

    var chart = bb.generate({
        bindto: "#chart",
        axis: {
            x: {
                type: "timeseries",
                tick: {
                    format: "%Y-%m-%d"
                }
            },
            y: {
                label: "Rating (1-10)"
            }
        },
        data: {
            x: "x",
            type: "spline",
            colors: {
                "Happiness": "#10b981",
                "Impetus": "#6366f1",
                "Stress": "#ef4444"
            },
            columns: [[]]
        }
    });

    getData2();
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Purchases')}">
    <title>Purchases</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Purchases', 'Track personal expenditures and vendor receipts', 'bi bi-bag-check', 'theme-finance', '/spend-management', 'Spend Dashboard')}"></header>

    <main class="container my-5">
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}">Validation error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-12" th:if="${totalPrice != null}">
                <div class="card slm-card border-0 shadow-sm p-3 bg-white d-flex flex-row justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-3">
                        <div class="p-3 rounded-circle bg-emerald-subtle text-emerald">
                            <i class="bi bi-wallet2 fs-3 text-success"></i>
                        </div>
                        <div>
                            <span class="text-secondary text-uppercase fw-semibold small">Total Expenditure</span>
                            <h3 class="mb-0 fw-bold text-dark" th:text="${#numbers.formatDecimal(totalPrice, 1, 2)} + ' €'">0.00 €</h3>
                        </div>
                    </div>
                    <span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill">
                        <i class="bi bi-graph-up me-1"></i> Recorded Expenses
                    </span>
                </div>
            </div>

            <!-- Full-Width Purchases Table Card -->
            <div class="col-12">
                <div class="card slm-table-card shadow-sm">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div class="d-flex align-items-center gap-2">
                            <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-receipt me-2 text-primary"></i>Purchase History</h5>
                            <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(purchases)} + ' records'">0 records</span>
                        </div>
                        <button type="button" class="btn btn-primary fw-semibold" onclick="openCreatePurchaseModal()">
                            <i class="bi bi-plus-circle me-1"></i> Add Purchase
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 70px;">ID</th>
                                    <th>Title</th>
                                    <th>Vendor</th>
                                    <th>Price</th>
                                    <th>Purchase Date</th>
                                    <th class="text-end pe-3" style="width: 100px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${purchases}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td class="fw-semibold text-dark" th:text="${e.title}"></td>
                                    <td>
                                        <span class="badge bg-light text-dark border px-2 py-1" th:text="${e.vendor != null ? e.vendor.name : '—'}"></span>
                                    </td>
                                    <td class="fw-semibold text-success" th:text="${#numbers.formatDecimal(e.price, 1, 2)} + ' €'"></td>
                                    <td class="text-muted" th:text="${#temporals.format(e.purchaseDate, 'dd.MM.yyyy')}"></td>
                                    <td class="text-end pe-3">
                                        <button type="button" 
                                                class="btn btn-sm btn-outline-primary" 
                                                title="Edit Purchase"
                                                th:data-id="${e.id}"
                                                th:data-title="${e.title}"
                                                th:data-vendor-id="${e.vendor != null ? e.vendor.id : ''}"
                                                th:data-price="${e.price}"
                                                th:data-purchase-date="${e.purchaseDate}"
                                                onclick="populateEditPurchaseModal(this)">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(purchases)}">
                                    <td colspan="6" class="text-center py-4 text-muted">No purchases logged yet. Click "Add Purchase" above to add your first expense.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Dual-Purpose Modal for Adding and Editing Purchases -->
    <div class="modal fade" id="purchaseModal" tabindex="-1" aria-labelledby="purchaseModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-white py-3 border-bottom">
                    <h5 class="modal-title fw-bold text-dark" id="purchaseModalLabel">
                        <i class="bi bi-cart-plus me-2 text-primary"></i>Add Purchase
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="purchaseForm" th:action="@{/purchases}" method="post">
                    <input type="hidden" id="modalPurchaseId" name="id" value="">
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="modalTitle" class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
                                <input type="text" id="modalTitle" name="title" class="form-control" placeholder="e.g. Mechanical Keyboard" required>
                            </div>
                            <div class="col-12">
                                <label for="modalVendor" class="form-label fw-semibold">Vendor <span class="text-danger">*</span></label>
                                <select id="modalVendor" name="vendor" class="form-select" required>
                                    <option th:each="s : ${vendors}" th:value="${s.id}" th:text="${s.name}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="modalPrice" class="form-label fw-semibold">Price (€) <span class="text-danger">*</span></label>
                                <input type="number" id="modalPrice" name="price" step="0.01" class="form-control" placeholder="0.00" required>
                            </div>
                            <div class="col-md-6">
                                <label for="modalPurchaseDate" class="form-label fw-semibold">Purchase Date <span class="text-danger">*</span></label>
                                <input type="date" id="modalPurchaseDate" name="purchaseDate" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-top py-3">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="modalPurchaseSubmitBtn" class="btn btn-primary fw-semibold px-4">
                            <i class="bi bi-plus-circle me-1"></i> Save Purchase
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
        function openCreatePurchaseModal() {
            document.getElementById('purchaseForm').reset();
            document.getElementById('modalPurchaseId').value = '';
            document.getElementById('purchaseModalLabel').innerHTML = '<i class="bi bi-cart-plus me-2 text-primary"></i>Add Purchase';
            document.getElementById('modalPurchaseSubmitBtn').innerHTML = '<i class="bi bi-plus-circle me-1"></i> Save Purchase';
            document.getElementById('modalPurchaseSubmitBtn').className = 'btn btn-primary fw-semibold px-4';

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('modalPurchaseDate').value = today;

            const modal = new bootstrap.Modal(document.getElementById('purchaseModal'));
            modal.show();
        }

        function populateEditPurchaseModal(btn) {
            const ds = btn.dataset;
            document.getElementById('modalPurchaseId').value = ds.id || '';
            document.getElementById('modalTitle').value = ds.title || '';
            document.getElementById('modalVendor').value = ds.vendorId || '';
            document.getElementById('modalPrice').value = ds.price || '';
            document.getElementById('modalPurchaseDate').value = ds.purchaseDate || '';

            document.getElementById('purchaseModalLabel').innerHTML = `<i class="bi bi-pencil-square me-2 text-warning"></i>Edit Purchase #${ds.id}`;
            document.getElementById('modalPurchaseSubmitBtn').innerHTML = '<i class="bi bi-check2-circle me-1"></i> Update Purchase';
            document.getElementById('modalPurchaseSubmitBtn').className = 'btn btn-warning fw-semibold px-4';

            const modal = new bootstrap.Modal(document.getElementById('purchaseModal'));
            modal.show();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Purchases')}">
    <title>Purchases</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Purchases', 'Track personal expenditures and vendor receipts', 'bi bi-bag-check', 'theme-finance', '/spend-management', 'Spend Dashboard')}"></header>

    <main class="container my-5">
        <div class="row g-4 mb-5">
            <div class="col-12" th:if="${totalPrice != null}">
                <div class="card slm-card border-0 shadow-sm p-3 bg-white d-flex flex-row justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-3">
                        <div class="p-3 rounded-circle bg-emerald-subtle text-emerald">
                            <i class="bi bi-wallet2 fs-3 text-success"></i>
                        </div>
                        <div>
                            <span class="text-secondary text-uppercase fw-semibold small">Total Expenditure</span>
                            <h3 class="mb-0 fw-bold text-dark" th:text="${totalPrice}">0.00</h3>
                        </div>
                    </div>
                    <span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill">
                        <i class="bi bi-graph-up me-1"></i> Recorded Expenses
                    </span>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card slm-table-card shadow-sm h-100">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-receipt me-2 text-primary"></i>Purchase History</h5>
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(purchases)} + ' records'">0 records</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 70px;">ID</th>
                                    <th>Title</th>
                                    <th>Vendor</th>
                                    <th>Price</th>
                                    <th class="pe-3">Purchase Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${purchases}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td class="fw-semibold text-dark" th:text="${e.title}"></td>
                                    <td>
                                        <span class="badge bg-light text-dark border px-2 py-1" th:text="${e.vendor != null ? e.vendor.name : '—'}"></span>
                                    </td>
                                    <td class="fw-semibold text-success" th:text="${e.price}"></td>
                                    <td class="pe-3 text-muted" th:text="${#temporals.format(e.purchaseDate, 'dd.MM.yyyy')}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(purchases)}">
                                    <td colspan="5" class="text-center py-4 text-muted">No purchases logged yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card slm-form-card shadow-sm">
                    <div class="card-header py-3 border-0">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-cart-plus me-2 text-primary"></i>Add Purchase</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/purchases}" th:object="${purchase}" method="post">
                            <div class="mb-3">
                                <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                                <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="e.g. Mechanical Keyboard" required>
                            </div>
                            <div class="mb-3">
                                <label for="vendorSelect" class="form-label">Vendor</label>
                                <select id="vendorSelect" class="form-select" th:field="*{vendor}">
                                    <option th:each="s : ${vendors}" th:value="${s.id}" th:text="${s.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="price" class="form-label">Price (€)</label>
                                <input type="number" id="price" step="0.01" th:field="*{price}" class="form-control" placeholder="0.00">
                            </div>
                            <div class="mb-4">
                                <label for="purchaseDate" class="form-label">Purchase Date <span class="text-danger">*</span></label>
                                <input type="date" id="purchaseDate" th:field="*{purchaseDate}" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-plus-circle me-1"></i> Add Purchase
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

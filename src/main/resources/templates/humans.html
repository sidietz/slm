<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Humans')}">
    <title>Humans</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Contacts & Humans', 'Directory of colleagues, friends, and family connections', 'bi bi-people', 'theme-social', '/human-management', 'Social Dashboard')}"></header>

    <main class="container my-5">
        <div class="row g-4 mb-5">
            <div class="col-lg-8">
                <div class="card slm-table-card shadow-sm h-100">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-person-lines-fill me-2 text-primary"></i>Contact Directory</h5>
                        </div>
                        <div class="d-flex gap-2">
                            <a th:href="@{/human-events}" class="btn btn-sm btn-outline-primary rounded-pill">
                                <i class="bi bi-calendar2-heart me-1"></i> Life Events &amp; Anniversaries
                            </a>
                            <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-2" th:text="${#lists.size(humans)} + ' contacts'">0 contacts</span>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 60px;">ID</th>
                                    <th>Name</th>
                                    <th>Birthday</th>
                                    <th>Status / Death Date</th>
                                    <th>Category</th>
                                    <th class="pe-3 text-end">Events</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="human : ${humans}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${human.id}"></td>
                                    <td>
                                        <span class="fw-semibold text-dark" th:text="${human.fullName}">Full Name</span>
                                    </td>
                                    <td class="text-muted small">
                                        <span th:text="${human.birthday != null ? #dates.format(human.birthday, 'dd.MM.yyyy') : '—'}">01.01.1980</span>
                                        <span th:if="${human.birthday != null and !human.deceased}" class="text-secondary small d-block" th:text="'(' + ${human.age} + ' yrs)'"></span>
                                    </td>
                                    <td>
                                        <span th:if="${human.deceased}" class="badge bg-secondary-subtle text-secondary border border-secondary px-2 py-1">
                                            <i class="bi bi-candle me-1"></i>Deceased <span th:if="${human.deathDate != null}" th:text="'(' + #dates.format(human.deathDate, 'dd.MM.yyyy') + ')'"></span>
                                        </span>
                                        <span th:if="${!human.deceased}" class="badge bg-success-subtle text-success px-2 py-1">Living</span>
                                    </td>
                                    <td>
                                        <span class="badge bg-light text-dark border px-2 py-1" th:text="${human.category}"></span>
                                    </td>
                                    <td class="pe-3 text-end">
                                        <a th:href="@{/human-events(humanId=${human.id})}" class="btn btn-sm btn-outline-secondary rounded-pill" title="View Events">
                                            <i class="bi bi-calendar-event me-1"></i>Events
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(humans)}">
                                    <td colspan="6" class="text-center py-4 text-muted">No contacts registered yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card slm-form-card shadow-sm">
                    <div class="card-header py-3 border-0">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-person-plus me-2 text-primary"></i>Add Contact</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/humans}" th:object="${human}" method="post">
                            <div class="mb-3">
                                <label for="categorySelect" class="form-label">Category</label>
                                <select id="categorySelect" class="form-select" th:field="*{category}">
                                    <option th:each="p : ${categories}" th:value="${p}" th:text="${p}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
                                <input type="text" id="firstName" th:field="*{firstname}" class="form-control" placeholder="e.g. John" required>
                            </div>
                            <div class="mb-3">
                                <label for="lastName" class="form-label">Last Name <span class="text-danger">*</span></label>
                                <input type="text" id="lastName" th:field="*{lastname}" class="form-control" placeholder="e.g. Doe" required>
                            </div>
                            <div class="mb-3">
                                <label for="birthday" class="form-label">Birthday <span class="text-danger">*</span></label>
                                <input type="date" id="birthday" th:field="*{birthday}" class="form-control" required>
                            </div>
                            <div class="mb-4">
                                <label for="deathDate" class="form-label">Death Date <span class="text-muted small">(Optional, for memorials)</span></label>
                                <input type="date" id="deathDate" th:field="*{deathDate}" class="form-control">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-person-plus me-1"></i> Add Contact
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

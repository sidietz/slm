<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Games Library')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Games Library', 'Catalog video games, series, publishers, and release timelines', 'bi bi-dpad', 'theme-gaming', '/gaming-sessions', 'Gaming Sessions')}"></header>

    <main class="container mb-5">
        <!-- Games Table Card -->
        <section class="card slm-table-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 fw-bold mb-0 text-dark">
                    <i class="bi bi-controller me-2 text-warning"></i>Game Collection
                    <span class="badge bg-warning-subtle text-warning ms-2 fs-6" th:text="${games != null ? games.size() : 0}">0</span>
                </h2>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-warning text-white btn-sm fw-semibold" data-bs-toggle="modal" data-bs-target="#gameModal">
                        <i class="bi bi-plus-circle me-1"></i> Add Game
                    </button>
                    <a th:href="@{/gaming-sessions}" class="btn btn-outline-warning btn-sm">
                        <i class="bi bi-clock-history me-1"></i> Gaming Sessions
                    </a>
                    <a th:href="@{/studios}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-joystick me-1"></i> Studios
                    </a>
                    <a th:href="@{/publishers}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-buildings me-1"></i> Publishers
                    </a>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table slm-table align-middle">
                    <thead>
                        <tr>
                            <th>Title &amp; Series</th>
                            <th>Publisher</th>
                            <th>Studio</th>
                            <th>Price</th>
                            <th>Dates (Release / Last Played)</th>
                            <th class="text-end" style="width: 100px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${games == null or games.empty}">
                            <td colspan="6" class="text-center py-4 text-muted">
                                No games registered yet. Add your first video game above!
                            </td>
                        </tr>
                        <tr th:each="game : ${games}">
                            <td>
                                <strong th:text="${game.title}">Title</strong>
                                <div class="text-muted small" th:if="${game.series != null and !game.series.empty}" th:text="${game.series}">Series</div>
                            </td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${game.publisher != null ? game.publisher.name : '-'}">Publisher</span>
                            </td>
                            <td>
                                <span class="badge bg-secondary-subtle text-secondary" th:text="${game.studio != null ? game.studio.name : '-'}">Studio</span>
                            </td>
                            <td class="fw-semibold" th:text="${game.price != null ? ('&euro;' + #numbers.formatDecimal(game.price, 1, 2)) : '-'}">&euro;59.99</td>
                            <td class="small text-muted">
                                <div>Released: <span th:text="${game.releaseDate}">2026-01-01</span></div>
                                <div>Played: <span th:text="${game.lastPlayed}">2026-02-01</span></div>
                            </td>
                            <td class="text-end">
                                <button type="button" class="btn btn-sm btn-outline-warning"
                                        data-bs-toggle="modal"
                                        data-bs-target="#gameModal"
                                        th:data-id="${game.id}"
                                        th:data-title="${game.title}"
                                        th:data-series="${game.series}"
                                        th:data-publisher="${game.publisher != null ? game.publisher.id : ''}"
                                        th:data-studio="${game.studio != null ? game.studio.id : ''}"
                                        th:data-price="${game.price}"
                                        th:data-release-date="${game.releaseDate}"
                                        th:data-last-played="${game.lastPlayed}">
                                    <i class="bi bi-pencil me-1"></i>Edit
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Game Modal (Add / Edit) -->
        <div class="modal fade" id="gameModal" tabindex="-1" aria-labelledby="gameModalTitle" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">
                    <form th:action="@{/games}" th:object="${game}" method="post" id="gameForm">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold" id="gameModalTitle">
                                <i class="bi bi-plus-circle me-2 text-warning"></i>Add New Game
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" th:field="*{id}" id="gameId" />
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Title <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{title}" id="gameTitle" class="form-control" placeholder="Game title" required />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Series</label>
                                    <input type="text" th:field="*{series}" id="gameSeries" class="form-control" placeholder="Franchise or series..." />
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Publisher</label>
                                    <select class="form-select" th:field="*{publisher}" id="gamePublisher">
                                        <option value="">-- Select Publisher --</option>
                                        <option th:each="e : ${publishers}" th:value="${e.id}" th:text="${e.name}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Development Studio</label>
                                    <select class="form-select" th:field="*{studio}" id="gameStudio">
                                        <option value="">-- Select Studio --</option>
                                        <option th:each="e : ${studios}" th:value="${e.id}" th:text="${e.name}"></option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label">Price (&euro;)</label>
                                    <input type="number" step="0.01" min="0" th:field="*{price}" id="gamePrice" class="form-control" placeholder="0.00" />
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Release Date</label>
                                    <input type="date" th:field="*{releaseDate}" id="gameReleaseDate" class="form-control" />
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Last Played</label>
                                    <input type="date" th:field="*{lastPlayed}" id="gameLastPlayed" class="form-control" />
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-warning text-white fw-semibold" id="gameSubmitBtn">
                                <i class="bi bi-save me-1"></i> Add Game
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const gameModal = document.getElementById('gameModal');
            if (gameModal) {
                gameModal.addEventListener('show.bs.modal', function (event) {
                    const button = event.relatedTarget;
                    const id = button ? button.getAttribute('data-id') : null;
                    const modalTitle = document.getElementById('gameModalTitle');
                    const submitBtn = document.getElementById('gameSubmitBtn');

                    if (id) {
                        modalTitle.innerHTML = '<i class="bi bi-pencil me-2 text-warning"></i>Edit Game';
                        submitBtn.innerHTML = '<i class="bi bi-save me-1"></i> Update Game';
                        document.getElementById('gameId').value = id;
                        document.getElementById('gameTitle').value = button.getAttribute('data-title') || '';
                        document.getElementById('gameSeries').value = button.getAttribute('data-series') || '';
                        document.getElementById('gamePublisher').value = button.getAttribute('data-publisher') || '';
                        document.getElementById('gameStudio').value = button.getAttribute('data-studio') || '';
                        document.getElementById('gamePrice').value = button.getAttribute('data-price') || '';
                        document.getElementById('gameReleaseDate').value = button.getAttribute('data-release-date') || '';
                        document.getElementById('gameLastPlayed').value = button.getAttribute('data-last-played') || '';
                    } else {
                        modalTitle.innerHTML = '<i class="bi bi-plus-circle me-2 text-warning"></i>Add New Game';
                        submitBtn.innerHTML = '<i class="bi bi-save me-1"></i> Add Game';
                        document.getElementById('gameForm').reset();
                        document.getElementById('gameId').value = '';
                    }
                });

                gameModal.addEventListener('hidden.bs.modal', function () {
                    document.getElementById('gameForm').reset();
                    document.getElementById('gameId').value = '';
                });
            }
        });
    </script>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

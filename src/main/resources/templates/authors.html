<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Authors Directory')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Authors Directory', 'Maintain book authors, biographical details, and ages', 'bi bi-person-lines-fill', 'theme-books', '/books', 'Books Library')}"></header>

    <main class="container mb-5">
        <!-- Authors Table Card -->
        <section class="card slm-table-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 fw-bold mb-0 text-dark">
                    <i class="bi bi-person-lines-fill me-2 text-info"></i>Authors
                    <span class="badge bg-info-subtle text-info ms-2 fs-6" th:text="${authors != null ? authors.size() : 0}">0</span>
                </h2>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-info text-white btn-sm fw-semibold" data-bs-toggle="modal" data-bs-target="#authorModal">
                        <i class="bi bi-person-plus me-1"></i> Add Author
                    </button>
                    <a th:href="@{/books}" class="btn btn-outline-info btn-sm">
                        <i class="bi bi-book me-1"></i> Books Library
                    </a>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table slm-table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Name</th>
                            <th>Birthday</th>
                            <th>Age</th>
                            <th class="text-end" style="width: 100px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${authors == null or authors.empty}">
                            <td colspan="5" class="text-center py-4 text-muted">
                                No authors defined yet.
                            </td>
                        </tr>
                        <tr th:each="e : ${authors}">
                            <td class="text-muted small" th:text="${e.id}">1</td>
                            <td>
                                <strong th:text="${e.firstname + ' ' + e.lastname}">Author Name</strong>
                            </td>
                            <td class="small" th:text="${#temporals.format(e.birthday, 'dd.MM.yyyy')}">01.01.1980</td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${{e.age}} + ' yrs'">45 yrs</span>
                            </td>
                            <td class="text-end">
                                <button type="button" class="btn btn-sm btn-outline-info"
                                        data-bs-toggle="modal"
                                        data-bs-target="#authorModal"
                                        th:data-id="${e.id}"
                                        th:data-firstname="${e.firstname}"
                                        th:data-lastname="${e.lastname}"
                                        th:data-birthday="${e.birthday}">
                                    <i class="bi bi-pencil me-1"></i>Edit
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Author Modal (Add / Edit) -->
        <div class="modal fade" id="authorModal" tabindex="-1" aria-labelledby="authorModalTitle" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form th:action="@{/authors}" th:object="${author}" method="post" id="authorForm">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold" id="authorModalTitle">
                                <i class="bi bi-person-plus me-2 text-info"></i>Add Author
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" th:field="*{id}" id="authorId" />
                            <div class="mb-3">
                                <label class="form-label">First Name <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{firstname}" id="authorFirstname" class="form-control" placeholder="First name" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Last Name <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{lastname}" id="authorLastname" class="form-control" placeholder="Last name" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Birthday <span class="text-danger">*</span></label>
                                <input type="date" th:field="*{birthday}" id="authorBirthday" class="form-control" required />
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-info text-white fw-semibold" id="authorSubmitBtn">
                                <i class="bi bi-save me-1"></i> Add Author
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const authorModal = document.getElementById('authorModal');
            if (authorModal) {
                authorModal.addEventListener('show.bs.modal', function (event) {
                    const button = event.relatedTarget;
                    const id = button ? button.getAttribute('data-id') : null;
                    const modalTitle = document.getElementById('authorModalTitle');
                    const submitBtn = document.getElementById('authorSubmitBtn');

                    if (id) {
                        modalTitle.innerHTML = '<i class="bi bi-pencil me-2 text-info"></i>Edit Author';
                        submitBtn.innerHTML = '<i class="bi bi-save me-1"></i> Update Author';
                        document.getElementById('authorId').value = id;
                        document.getElementById('authorFirstname').value = button.getAttribute('data-firstname') || '';
                        document.getElementById('authorLastname').value = button.getAttribute('data-lastname') || '';
                        document.getElementById('authorBirthday').value = button.getAttribute('data-birthday') || '';
                    } else {
                        modalTitle.innerHTML = '<i class="bi bi-person-plus me-2 text-info"></i>Add Author';
                        submitBtn.innerHTML = '<i class="bi bi-save me-1"></i> Add Author';
                        document.getElementById('authorForm').reset();
                        document.getElementById('authorId').value = '';
                    }
                });

                authorModal.addEventListener('hidden.bs.modal', function () {
                    document.getElementById('authorForm').reset();
                    document.getElementById('authorId').value = '';
                });
            }
        });
    </script>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Train Trips')}">
    <title>Train Trips</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Train Trips', 'Rail journeys, transit lines, and travel durations', 'bi bi-train-front', 'theme-transit', '/misc-management', 'Misc Dashboard')}"></header>

    <main class="container my-5">
        <!-- Quick Nav -->
        <div class="d-flex gap-2 mb-4">
            <a href="/train-trips" class="btn btn-outline-primary btn-sm active"><i class="bi bi-train-front me-1"></i> Trips</a>
            <a href="/train-stations" class="btn btn-outline-secondary btn-sm"><i class="bi bi-pin-map me-1"></i> Stations</a>
            <a href="/train-lines" class="btn btn-outline-secondary btn-sm"><i class="bi bi-signpost-split me-1"></i> Lines</a>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-lg-8">
                <div class="card slm-table-card shadow-sm h-100">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-clock-history me-2 text-primary"></i>Logged Train Journeys</h5>
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(traintrips2)} + ' trips'">0 trips</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 60px;">ID</th>
                                    <th>Line</th>
                                    <th>Origin</th>
                                    <th>Destination</th>
                                    <th>Departure</th>
                                    <th>Arrival</th>
                                    <th class="pe-3">Duration</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${traintrips2}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td>
                                        <span class="badge bg-primary-subtle text-primary fw-medium" th:text="${e.line != null ? e.line.name : '—'}"></span>
                                    </td>
                                    <td class="fw-semibold text-dark" th:text="${e.origin != null ? e.origin.name : '—'}"></td>
                                    <td class="fw-semibold text-dark" th:text="${e.destination != null ? e.destination.name : '—'}"></td>
                                    <td class="text-muted small" th:text="${#temporals.format(e.start, 'dd.MM.yyyy HH:mm')}"></td>
                                    <td class="text-muted small" th:text="${#temporals.format(e.end, 'dd.MM.yyyy HH:mm')}"></td>
                                    <td class="pe-3">
                                        <span class="code-pill" th:text="${{e.duration}}"></span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(traintrips2)}">
                                    <td colspan="7" class="text-center py-4 text-muted">No train trips recorded yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card slm-form-card shadow-sm">
                    <div class="card-header py-3 border-0">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-plus-circle me-2 text-primary"></i>Add Train Trip</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/train-trips}" th:object="${traintrip}" method="post">
                            <div class="mb-3">
                                <label for="selectLine" class="form-label">Train Line</label>
                                <select id="selectLine" class="form-select" name="selectLine" onchange="updateLine(event)">
                                    <option th:each="l : ${lines}" th:value="${l.id}"
                                            th:text="${l.name + ' - ' + l.description}" 
                                            th:selected="(${lineId} == ${l.id})"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="selectOrigin" class="form-label">Origin Station</label>
                                <select id="selectOrigin" class="form-select" th:field="*{origin}">
                                    <option th:each="s : ${traintrips}" th:value="${s.id}"
                                            th:text="${s.ds100 + ' - ' + s.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="selectDestination" class="form-label">Destination Station</label>
                                <select id="selectDestination" class="form-select" th:field="*{destination}">
                                    <option th:each="s : ${traintrips}" th:value="${s.id}"
                                            th:text="${s.ds100 + ' - ' + s.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="start" class="form-label">Departure <span class="text-danger">*</span></label>
                                <input type="datetime-local" id="start" th:field="*{start}" class="form-control" required>
                            </div>
                            <div class="mb-4">
                                <label for="end" class="form-label">Arrival <span class="text-danger">*</span></label>
                                <input type="datetime-local" id="end" th:field="*{end}" class="form-control" required>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary flex-grow-1 py-2">
                                    <i class="bi bi-plus-circle me-1"></i> Log Trip
                                </button>
                                <button type="reset" class="btn btn-outline-secondary py-2">Reset</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
    function updateLine(event) {
        var searchParams = new URLSearchParams(window.location.search);
        searchParams.set("id", event.target.value);
        window.location.search = searchParams.toString();
    }
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Meditations')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Meditations', 'Practice mindfulness, breathing exercises, and meditation time', 'bi bi-flower1', 'theme-wellness', '/habit-management', 'Habit Dashboard')}"></header>

    <main class="container mb-5">
        <!-- Add Meditation Card -->
        <section class="card slm-form-card mb-4">
            <h2 class="text-success"><i class="bi bi-plus-circle me-2"></i>Log Meditation Session</h2>
            <form th:action="@{/meditations}" th:object="${meditation}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Start Time <span class="text-danger">*</span></label>
                        <input type="datetime-local" th:field="*{start}" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">End Time <span class="text-danger">*</span></label>
                        <input type="datetime-local" th:field="*{end}" class="form-control" required />
                    </div>
                    <div class="col-12 text-end mt-3">
                        <button type="submit" class="btn btn-success px-4 fw-semibold">
                            <i class="bi bi-save me-1"></i> Save Meditation
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Meditations Table Card -->
        <section class="card slm-table-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 fw-bold mb-0 text-dark">
                    <i class="bi bi-flower1 me-2 text-success"></i>Meditation History
                    <span class="badge bg-success-subtle text-success ms-2 fs-6" th:text="${meditations != null ? meditations.size() : 0}">0</span>
                </h2>
                <a th:href="@{/sessions?type=MEDITATION}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-layers me-1"></i> View in Sessions Hub
                </a>
            </div>

            <div class="table-responsive">
                <table class="table slm-table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Start</th>
                            <th>End</th>
                            <th>Duration</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${meditations == null or meditations.empty}">
                            <td colspan="4" class="text-center py-4 text-muted">
                                No meditation sessions logged yet. Record your first mindfulness session above!
                            </td>
                        </tr>
                        <tr th:each="e : ${meditations}">
                            <td class="text-muted small" th:text="${e.id}">1</td>
                            <td class="small" th:text="${#temporals.format(e.start, 'dd.MM.yyyy HH:mm')}">01.01.2026 07:00</td>
                            <td class="small" th:text="${#temporals.format(e.end, 'dd.MM.yyyy HH:mm')}">01.01.2026 07:20</td>
                            <td>
                                <span class="badge bg-success text-white" th:text="${{e.duration}}">20 min</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Learning Sessions')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Learning Sessions', 'Track studies, knowledge acquisition, and skill mastery', 'bi bi-mortarboard-fill', 'theme-habit', '/sessions?type=LEARNING', 'Sessions Hub')}"></header>

    <main class="container mb-5">
        <!-- Add Learning Session Form Card -->
        <section class="card card-custom p-4 mb-4">
            <h2 class="h4 fw-bold mb-3" style="color: #6d28d9;"><i class="bi bi-plus-circle me-2"></i>Log Learning Session</h2>
            <form th:action="@{/learning-sessions}" th:object="${learningsession}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Learning Item <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{learningItem}" required>
                            <option value="">-- Select Item --</option>
                            <option th:each="p : ${items}" th:value="${p.id}" th:text="${p.title}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Start Time <span class="text-danger">*</span></label>
                        <input type="datetime-local" th:field="*{start}" class="form-control" required />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">End Time <span class="text-danger">*</span></label>
                        <input type="datetime-local" th:field="*{end}" class="form-control" required />
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Break (minutes)</label>
                        <input type="number" name="breakMinutes" class="form-control" min="0" value="0" />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Focus Rating (1-5)</label>
                        <select th:field="*{focusRating}" class="form-select">
                            <option value="">-- No rating --</option>
                            <option value="5">⭐⭐⭐⭐⭐ (5 - Deep Focus)</option>
                            <option value="4">⭐⭐⭐⭐ (4 - Focused)</option>
                            <option value="3">⭐⭐⭐ (3 - Moderate)</option>
                            <option value="2">⭐⭐ (2 - Distracted)</option>
                            <option value="1">⭐ (1 - Low Retention)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Outcome / Key Takeaways</label>
                        <input type="text" th:field="*{outcomeSummary}" class="form-control" placeholder="Understood reactive patterns and finished chapter 4" />
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Notes / Comment</label>
                        <input type="text" th:field="*{comment}" class="form-control" placeholder="Observations, next topics..." />
                    </div>

                    <div class="col-12 text-end mt-3">
                        <button type="submit" class="btn btn-primary px-4 fw-semibold" style="background: #6d28d9; border-color: #6d28d9;">
                            <i class="bi bi-save me-1"></i> Save Learning Session
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Sessions Table Card -->
        <section class="card card-custom p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 fw-bold mb-0 text-dark">
                    <i class="bi bi-mortarboard me-2" style="color: #6d28d9;"></i>Logged Learning Sessions
                    <span class="badge ms-2 fs-6" style="background-color: #ede9fe; color: #5b21b6;" th:text="${learningsessions != null ? learningsessions.size() : 0}">0</span>
                </h2>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Learning Item</th>
                            <th>Start</th>
                            <th>End</th>
                            <th>Net Duration</th>
                            <th>Break</th>
                            <th>Focus</th>
                            <th>Outcome &amp; Notes</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${learningsessions == null or learningsessions.empty}">
                            <td colspan="8" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                No learning sessions logged yet. Record your first study session above!
                            </td>
                        </tr>
                        <tr th:each="e : ${learningsessions}">
                            <td>
                                <strong th:text="${e.learningItem != null ? e.learningItem.title : 'General'}">Item</strong>
                            </td>
                            <td class="small" th:text="${#temporals.format(e.start, 'dd.MM.yyyy HH:mm')}">01.01.2026 10:00</td>
                            <td class="small" th:text="${#temporals.format(e.end, 'dd.MM.yyyy HH:mm')}">01.01.2026 11:30</td>
                            <td>
                                <span class="badge text-white" style="background: #6d28d9;" th:text="${e.netDuration != null ? e.netDuration : (e.duration != null ? e.duration : '-')}">1h 30m</span>
                            </td>
                            <td class="small text-muted" th:text="${e.breakDuration != null ? e.breakDuration : '0m'}">0m</td>
                            <td>
                                <span th:if="${e.focusRating != null and e.focusRating > 0}" class="star-rating">
                                    <span th:each="i : ${#numbers.sequence(1, e.focusRating)}">★</span>
                                </span>
                                <span th:if="${e.focusRating == null or e.focusRating == 0}" class="text-muted small">-</span>
                            </td>
                            <td class="small" style="max-width: 250px;">
                                <div th:if="${e.outcomeSummary != null and !e.outcomeSummary.empty}" class="fw-semibold text-truncate" th:text="${e.outcomeSummary}">Outcome</div>
                                <div th:if="${e.comment != null and !e.comment.empty}" class="text-muted text-truncate" th:text="${e.comment}">Comment</div>
                            </td>
                            <td class="text-end">
                                <form th:action="@{'/sessions/delete/' + ${e.id} + '?returnType=LEARNING'}" method="post" class="d-inline"
                                      onsubmit="return confirm('Delete this learning session?');">
                                    <button type="submit" class="btn btn-outline-danger btn-sm" title="Delete session">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

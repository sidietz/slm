<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Manufacturers Directory')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Manufacturers Directory', 'Catalog hardware, vehicle, and device manufacturers', 'bi bi-cpu', 'theme-work', '/activity-management', 'Activity Dashboard')}"></header>

    <main class="container mb-5">
        <div class="row g-4">
            <!-- Add Manufacturer Card -->
            <div class="col-md-5">
                <section class="card slm-form-card">
                    <h2 class="text-danger"><i class="bi bi-plus-circle me-2"></i>Add Manufacturer</h2>
                    <form th:action="@{/manufacturers}" th:object="${manufacturer}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Manufacturer Name <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Apple, Sony, Dell, Lenovo, Nintendo" required />
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-danger px-4 fw-semibold">
                                <i class="bi bi-save me-1"></i> Add Manufacturer
                            </button>
                        </div>
                    </form>
                </section>
            </div>

            <!-- Existing Manufacturers Table Card -->
            <div class="col-md-7">
                <section class="card slm-table-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h4 fw-bold mb-0 text-dark">
                            <i class="bi bi-cpu me-2 text-danger"></i>Configured Manufacturers
                            <span class="badge bg-danger-subtle text-danger ms-2 fs-6" th:text="${manufacturers != null ? manufacturers.size() : 0}">0</span>
                        </h2>
                    </div>

                    <div class="table-responsive">
                        <table class="table slm-table align-middle">
                            <thead>
                                <tr>
                                    <th style="width: 80px;">ID</th>
                                    <th>Manufacturer Name</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${manufacturers == null or manufacturers.empty}">
                                    <td colspan="2" class="text-center py-4 text-muted">
                                        No manufacturers defined yet.
                                    </td>
                                </tr>
                                <tr th:each="e : ${manufacturers}">
                                    <td class="text-muted small" th:text="${e.id}">1</td>
                                    <td>
                                        <strong th:text="${e.name}">Manufacturer</strong>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Manufacturers Directory')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Manufacturers Directory', 'Catalog hardware, vehicle, and device manufacturers', 'bi bi-cpu', 'theme-work', '/activity-management', 'Activity Dashboard')}"></header>

    <main class="container mb-5">
        <!-- Existing Manufacturers Table Card -->
        <section class="card slm-table-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 fw-bold mb-0 text-dark">
                    <i class="bi bi-cpu me-2 text-danger"></i>Configured Manufacturers
                    <span class="badge bg-danger-subtle text-danger ms-2 fs-6" th:text="${manufacturers != null ? manufacturers.size() : 0}">0</span>
                </h2>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-danger btn-sm fw-semibold" data-bs-toggle="modal" data-bs-target="#manufacturerModal">
                        <i class="bi bi-plus-circle me-1"></i> Add Manufacturer
                    </button>
                    <a th:href="@{/devices}" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-laptop me-1"></i> Devices Inventory
                    </a>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table slm-table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Manufacturer Name</th>
                            <th>Headquarters</th>
                            <th>Founding Date</th>
                            <th class="text-end" style="width: 100px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${manufacturers == null or manufacturers.empty}">
                            <td colspan="5" class="text-center py-4 text-muted">
                                No manufacturers defined yet.
                            </td>
                        </tr>
                        <tr th:each="e : ${manufacturers}">
                            <td class="text-muted small" th:text="${e.id}">1</td>
                            <td>
                                <strong th:text="${e.name}">Manufacturer</strong>
                            </td>
                            <td th:text="${e.hq != null and !e.hq.empty ? e.hq : '-'}">Headquarters</td>
                            <td class="small text-muted" th:text="${e.foundingDate != null ? #temporals.format(e.foundingDate, 'dd.MM.yyyy') : '-'}">01.01.1980</td>
                            <td class="text-end">
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                        data-bs-toggle="modal"
                                        data-bs-target="#manufacturerModal"
                                        th:data-id="${e.id}"
                                        th:data-name="${e.name}"
                                        th:data-hq="${e.hq}"
                                        th:data-founding-date="${e.foundingDate}">
                                    <i class="bi bi-pencil me-1"></i>Edit
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Manufacturer Modal (Add / Edit) -->
        <div class="modal fade" id="manufacturerModal" tabindex="-1" aria-labelledby="manufacturerModalTitle" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form th:action="@{/manufacturers}" th:object="${manufacturer}" method="post" id="manufacturerForm">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold" id="manufacturerModalTitle">
                                <i class="bi bi-plus-circle me-2 text-danger"></i>Add Manufacturer
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" th:field="*{id}" id="manufacturerId" />
                            <div class="mb-3">
                                <label class="form-label">Manufacturer Name <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{name}" id="manufacturerName" class="form-control" placeholder="e.g. Apple, Sony, Dell, Lenovo, Nintendo" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Headquarters</label>
                                <input type="text" th:field="*{hq}" id="manufacturerHq" class="form-control" placeholder="e.g. Cupertino, CA, USA" />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Founding Date</label>
                                <input type="date" th:field="*{foundingDate}" id="manufacturerFoundingDate" class="form-control" />
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-danger px-4 fw-semibold" id="manufacturerSubmitBtn">
                                <i class="bi bi-save me-1"></i> Add Manufacturer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const manufacturerModal = document.getElementById('manufacturerModal');
            if (manufacturerModal) {
                manufacturerModal.addEventListener('show.bs.modal', function (event) {
                    const button = event.relatedTarget;
                    const id = button ? button.getAttribute('data-id') : null;
                    const modalTitle = document.getElementById('manufacturerModalTitle');
                    const submitBtn = document.getElementById('manufacturerSubmitBtn');

                    if (id) {
                        modalTitle.innerHTML = '<i class="bi bi-pencil me-2 text-danger"></i>Edit Manufacturer';
                        submitBtn.innerHTML = '<i class="bi bi-save me-1"></i> Update Manufacturer';
                        document.getElementById('manufacturerId').value = id;
                        document.getElementById('manufacturerName').value = button.getAttribute('data-name') || '';
                        document.getElementById('manufacturerHq').value = button.getAttribute('data-hq') || '';
                        document.getElementById('manufacturerFoundingDate').value = button.getAttribute('data-founding-date') || '';
                    } else {
                        modalTitle.innerHTML = '<i class="bi bi-plus-circle me-2 text-danger"></i>Add Manufacturer';
                        submitBtn.innerHTML = '<i class="bi bi-save me-1"></i> Add Manufacturer';
                        document.getElementById('manufacturerForm').reset();
                        document.getElementById('manufacturerId').value = '';
                    }
                });

                manufacturerModal.addEventListener('hidden.bs.modal', function () {
                    document.getElementById('manufacturerForm').reset();
                    document.getElementById('manufacturerId').value = '';
                });
            }
        });
    </script>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Car Trips</title>
<link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"
	rel="stylesheet" />
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"
	defer></script>
</head>

<body class="container mt-5">
    <h1 class="mb-4">Car Trips</h1>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Car</th>
                <th>Route</th>
                <th>is way back</th>
                <th>Start</th>
                <th>End</th>
                <th>Duration</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e : ${cartrips}">
				<td th:text="${e.id}"></td>
				<td th:text="${e.car.name}"></td>
				<td th:text="${e.route.name}"></td>
				<td th:text="${e.isWayBack}"></td>
				<td th:text="${#temporals.format(e.start, 'dd.MM.yyyy HH:mm:ss')}"></td>
				<td th:text="${#temporals.format(e.end, 'dd.MM.yyyy HH:mm:ss')}"></td>
				<td th:text="${{e.duration}}"></td>
			</tr>
        </tbody>
    </table>

    <h2 class="mt-5">Add Car Trip</h2>
    <form action="#" th:action="@{/car-trips}" th:object="${cartrip}" method="post" class="mb-5">
    	<div class="mb-3">
            <label for="routeId" class="form-label">Car:</label>
            <select class="form-select" name="selectCar"
				onchange="updatePress(event)" th:field="*{car}">
				<option th:each="p : ${cars}" th:value="${p.id}"
					th:text="${p.name}"></option>
			</select>
        </div>
        <div class="mb-3">
            <label for="routeId" class="form-label">Route:</label>
            <select class="form-select" name="selectRoute"
				onchange="updatePress2(event)" th:field="*{route}">
				<option th:each="p : ${routes}" th:value="${p.id}"
					th:text="${p.name}"></option>
			</select>
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">Is Way Back?</label>
            <input type="checkbox" th:field="*{isWayBack}">
        </div>
        <div class="mb-3">
            <label for="startTime" class="form-label">Start:</label>
            <input type="datetime-local" step="1" th:field="*{start}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="endTime" class="form-label">End:</label>
            <input type="datetime-local" step="1" th:field="*{end}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Car Trip</button>
    </form>
    <a href="/cars" class="btn btn-secondary">View Cars</a>
    <a href="/points" class="btn btn-secondary">View Points</a>
    <a href="/routes" class="btn btn-secondary">View Routes</a>
    <a href="/misc-management" class="btn btn-secondary">Back to Dashboard</a>
</body>

</html>

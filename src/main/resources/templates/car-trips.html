<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Car Trips')}">
    <title>Car Trips</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Car Trips', 'Vehicle journeys, routes taken, and duration tracking', 'bi bi-sign-turn-right', 'theme-cars', '/misc-management', 'Misc Dashboard')}"></header>

    <main class="container my-5">
        <!-- Quick Nav -->
        <div class="d-flex gap-2 mb-4 flex-wrap">
            <a href="/cars" class="btn btn-outline-secondary btn-sm"><i class="bi bi-car-front me-1"></i> Vehicles</a>
            <a href="/refuelings" class="btn btn-outline-secondary btn-sm"><i class="bi bi-fuel-pump me-1"></i> Refuelings</a>
            <a href="/stations" class="btn btn-outline-secondary btn-sm"><i class="bi bi-ev-station me-1"></i> Stations</a>
            <a href="/car-trips" class="btn btn-outline-primary btn-sm active"><i class="bi bi-sign-turn-right me-1"></i> Trips</a>
            <a href="/routes" class="btn btn-outline-secondary btn-sm"><i class="bi bi-map me-1"></i> Routes</a>
            <a href="/points" class="btn btn-outline-secondary btn-sm"><i class="bi bi-geo-alt me-1"></i> Points</a>
        </div>

        <div class="row g-4 mb-5">
            <!-- Full-Width Drive History Table Card -->
            <div class="col-12">
                <div class="card slm-table-card shadow-sm">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div class="d-flex align-items-center gap-2">
                            <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-compass me-2 text-primary"></i>Drive History</h5>
                            <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(cartrips)} + ' drives'">0 drives</span>
                        </div>
                        <button type="button" class="btn btn-primary fw-semibold" onclick="openCreateCarTripModal()">
                            <i class="bi bi-plus-circle me-1"></i> Add Car Trip
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 60px;">ID</th>
                                    <th>Car</th>
                                    <th>Route</th>
                                    <th>Direction</th>
                                    <th>Start</th>
                                    <th>End</th>
                                    <th>Duration</th>
                                    <th class="text-end pe-3" style="width: 100px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${cartrips}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td>
                                        <span class="badge bg-light text-dark border px-2 py-1" th:text="${e.car != null ? e.car.name : '—'}"></span>
                                    </td>
                                    <td class="fw-semibold text-dark" th:text="${e.route != null ? e.route.name : '—'}"></td>
                                    <td>
                                        <span th:if="${e.isWayBack}" class="badge bg-warning-subtle text-warning-emphasis rounded-pill px-2 py-1">
                                            <i class="bi bi-arrow-return-left me-1"></i> Return
                                        </span>
                                        <span th:unless="${e.isWayBack}" class="badge bg-light text-muted border rounded-pill px-2 py-1">
                                            Outbound
                                        </span>
                                    </td>
                                    <td class="text-muted small" th:text="${#temporals.format(e.start, 'dd.MM.yyyy HH:mm')}"></td>
                                    <td class="text-muted small" th:text="${#temporals.format(e.end, 'dd.MM.yyyy HH:mm')}"></td>
                                    <td>
                                        <span class="code-pill" th:text="${{e.duration}}"></span>
                                    </td>
                                    <td class="text-end pe-3">
                                        <button type="button" 
                                                class="btn btn-sm btn-outline-primary" 
                                                title="Edit Car Trip"
                                                th:data-id="${e.id}"
                                                th:data-car-id="${e.car != null ? e.car.id : ''}"
                                                th:data-route-id="${e.route != null ? e.route.id : ''}"
                                                th:data-is-way-back="${e.isWayBack}"
                                                th:data-start="${e.start}"
                                                th:data-end="${e.end}"
                                                onclick="populateEditCarTripModal(this)">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(cartrips)}">
                                    <td colspan="8" class="text-center py-4 text-muted">No car trips logged yet. Click "Add Car Trip" above to record a journey.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Dual-Purpose Modal for Adding and Editing Car Trips -->
    <div class="modal fade" id="carTripModal" tabindex="-1" aria-labelledby="carTripModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-white py-3 border-bottom">
                    <h5 class="modal-title fw-bold text-dark" id="carTripModalLabel">
                        <i class="bi bi-sign-turn-right me-2 text-primary"></i>Add Car Trip
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="carTripForm" th:action="@{/car-trips}" method="post">
                    <input type="hidden" id="modalCarTripId" name="id" value="">
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="modalCarTripCar" class="form-label fw-semibold">Car <span class="text-danger">*</span></label>
                                <select id="modalCarTripCar" name="car" class="form-select" required>
                                    <option th:each="p : ${cars}" th:value="${p.id}" th:text="${p.name}"></option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label for="modalCarTripRoute" class="form-label fw-semibold">Route <span class="text-danger">*</span></label>
                                <select id="modalCarTripRoute" name="route" class="form-select" required>
                                    <option th:each="p : ${routes}" th:value="${p.id}" th:text="${p.name}"></option>
                                </select>
                            </div>
                            <div class="col-12">
                                <div class="form-check form-switch mt-1">
                                    <input class="form-check-input" type="checkbox" id="modalCarTripIsWayBack" name="isWayBack">
                                    <label class="form-check-label fw-semibold" for="modalCarTripIsWayBack">Return Trip (Way Back)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="modalCarTripStart" class="form-label fw-semibold">Start Time <span class="text-danger">*</span></label>
                                <input type="datetime-local" id="modalCarTripStart" name="start" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label for="modalCarTripEnd" class="form-label fw-semibold">End Time <span class="text-danger">*</span></label>
                                <input type="datetime-local" id="modalCarTripEnd" name="end" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-top py-3">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="modalCarTripSubmitBtn" class="btn btn-primary fw-semibold px-4">
                            <i class="bi bi-plus-circle me-1"></i> Save Car Trip
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
        function openCreateCarTripModal() {
            document.getElementById('carTripForm').reset();
            document.getElementById('modalCarTripId').value = '';
            document.getElementById('carTripModalLabel').innerHTML = '<i class="bi bi-sign-turn-right me-2 text-primary"></i>Add Car Trip';
            document.getElementById('modalCarTripSubmitBtn').innerHTML = '<i class="bi bi-plus-circle me-1"></i> Save Car Trip';
            document.getElementById('modalCarTripSubmitBtn').className = 'btn btn-primary fw-semibold px-4';
            document.getElementById('modalCarTripIsWayBack').checked = false;

            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const nowStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
            document.getElementById('modalCarTripStart').value = nowStr;
            document.getElementById('modalCarTripEnd').value = nowStr;

            const modal = new bootstrap.Modal(document.getElementById('carTripModal'));
            modal.show();
        }

        function populateEditCarTripModal(btn) {
            const ds = btn.dataset;
            document.getElementById('modalCarTripId').value = ds.id || '';
            document.getElementById('modalCarTripCar').value = ds.carId || '';
            document.getElementById('modalCarTripRoute').value = ds.routeId || '';
            document.getElementById('modalCarTripIsWayBack').checked = ds.isWayBack === 'true';
            document.getElementById('modalCarTripStart').value = ds.start || '';
            document.getElementById('modalCarTripEnd').value = ds.end || '';

            document.getElementById('carTripModalLabel').innerHTML = `<i class="bi bi-pencil-square me-2 text-warning"></i>Edit Car Trip #${ds.id}`;
            document.getElementById('modalCarTripSubmitBtn').innerHTML = '<i class="bi bi-check2-circle me-1"></i> Update Car Trip';
            document.getElementById('modalCarTripSubmitBtn').className = 'btn btn-warning fw-semibold px-4';

            const modal = new bootstrap.Modal(document.getElementById('carTripModal'));
            modal.show();
        }
    </script>
</body>
</html>

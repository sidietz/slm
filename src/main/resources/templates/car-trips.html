<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Car Trips')}">
    <title>Car Trips</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Car Trips', 'Vehicle journeys, routes taken, and duration tracking', 'bi bi-sign-turn-right', 'theme-cars', '/misc-management', 'Misc Dashboard')}"></header>

    <main class="container my-5">
        <!-- Quick Nav -->
        <div class="d-flex gap-2 mb-4">
            <a href="/cars" class="btn btn-outline-secondary btn-sm"><i class="bi bi-car-front me-1"></i> Vehicles</a>
            <a href="/car-trips" class="btn btn-outline-primary btn-sm active"><i class="bi bi-sign-turn-right me-1"></i> Trips</a>
            <a href="/routes" class="btn btn-outline-secondary btn-sm"><i class="bi bi-map me-1"></i> Routes</a>
            <a href="/points" class="btn btn-outline-secondary btn-sm"><i class="bi bi-geo-alt me-1"></i> Points</a>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-lg-8">
                <div class="card slm-table-card shadow-sm h-100">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-compass me-2 text-primary"></i>Drive History</h5>
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(cartrips)} + ' drives'">0 drives</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 60px;">ID</th>
                                    <th>Car</th>
                                    <th>Route</th>
                                    <th>Return?</th>
                                    <th>Start</th>
                                    <th>End</th>
                                    <th class="pe-3">Duration</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${cartrips}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td>
                                        <span class="badge bg-light text-dark border px-2 py-1" th:text="${e.car != null ? e.car.name : '—'}"></span>
                                    </td>
                                    <td class="fw-semibold text-dark" th:text="${e.route != null ? e.route.name : '—'}"></td>
                                    <td>
                                        <span th:if="${e.isWayBack}" class="badge bg-warning-subtle text-warning-emphasis rounded-pill px-2 py-1">
                                            <i class="bi bi-arrow-return-left me-1"></i> Return
                                        </span>
                                        <span th:unless="${e.isWayBack}" class="badge bg-light text-muted border rounded-pill px-2 py-1">
                                            Outbound
                                        </span>
                                    </td>
                                    <td class="text-muted small" th:text="${#temporals.format(e.start, 'dd.MM.yyyy HH:mm:ss')}"></td>
                                    <td class="text-muted small" th:text="${#temporals.format(e.end, 'dd.MM.yyyy HH:mm:ss')}"></td>
                                    <td class="pe-3">
                                        <span class="code-pill" th:text="${{e.duration}}"></span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(cartrips)}">
                                    <td colspan="7" class="text-center py-4 text-muted">No car trips logged yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card slm-form-card shadow-sm">
                    <div class="card-header py-3 border-0">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-plus-circle me-2 text-primary"></i>Add Car Trip</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/car-trips}" th:object="${cartrip}" method="post">
                            <div class="mb-3">
                                <label for="car" class="form-label">Car</label>
                                <select id="car" class="form-select" th:field="*{car}">
                                    <option th:each="p : ${cars}" th:value="${p.id}" th:text="${p.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="route" class="form-label">Route</label>
                                <select id="route" class="form-select" th:field="*{route}">
                                    <option th:each="p : ${routes}" th:value="${p.id}" th:text="${p.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3 form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="isWayBack" th:field="*{isWayBack}">
                                <label class="form-check-label" for="isWayBack">Return Trip (Way Back)</label>
                            </div>
                            <div class="mb-3">
                                <label for="start" class="form-label">Start Time <span class="text-danger">*</span></label>
                                <input type="datetime-local" step="1" id="start" th:field="*{start}" class="form-control" required>
                            </div>
                            <div class="mb-4">
                                <label for="end" class="form-label">End Time <span class="text-danger">*</span></label>
                                <input type="datetime-local" step="1" id="end" th:field="*{end}" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-plus-circle me-1"></i> Log Car Trip
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

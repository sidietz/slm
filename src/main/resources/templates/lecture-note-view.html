<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${note.title} + ' | Lecture Note | SLM'">Lecture Note | SLM</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/slm.css}" rel="stylesheet" />
    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --slm-academic-gradient: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .header-view {
            background: var(--slm-academic-gradient);
            color: white;
            padding: 2.5rem 0;
            margin-bottom: 2rem;
            border-radius: 0 0 1.5rem 1.5rem;
        }
        .note-container {
            max-width: 900px;
        }
        .rendered-markdown {
            background: white;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            line-height: 1.8;
            font-size: 1.05rem;
        }
        .rendered-markdown h1, .rendered-markdown h2, .rendered-markdown h3 {
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.4rem;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        .rendered-markdown pre {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 1.25rem;
            border-radius: 0.75rem;
            overflow-x: auto;
        }
        .rendered-markdown code {
            background-color: #f1f5f9;
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            color: #0284c7;
        }
        .rendered-markdown blockquote {
            border-left: 4px solid #0284c7;
            padding-left: 1rem;
            color: #64748b;
            font-style: italic;
        }
        .rendered-markdown table {
            width: 100%;
            margin-bottom: 1.5rem;
            border-collapse: collapse;
        }
        .rendered-markdown table th, .rendered-markdown table td {
            border: 1px solid #cbd5e1;
            padding: 0.6rem;
        }
        .rendered-markdown table th {
            background-color: #f8fafc;
        }
        .star-rating { color: #f59e0b; }
        @media print {
            .header-view, .no-print { display: none !important; }
            .rendered-markdown { box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>
    <header class="header-view">
        <div class="container note-container">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span class="badge bg-white text-primary fw-bold" th:text="${note.course.code != null ? note.course.code : 'COURSE'}">CODE</span>
                        <span class="badge bg-light text-dark" th:text="'Lecture ' + ${note.lectureNumber}">Lecture 1</span>
                        <span class="badge bg-info-subtle text-white" th:if="${note.lectureDate != null}" th:text="${#temporals.format(note.lectureDate, 'dd.MM.yyyy')}">01.10.2026</span>
                    </div>
                    <h1 class="h2 fw-bold mb-1" th:text="${note.title}">Note Title</h1>
                    <div class="text-white-50" th:text="${note.course.title}">Course Name</div>
                </div>
                <div class="d-flex gap-2 no-print">
                    <a th:href="@{'/notes/' + ${note.id} + '/edit'}" class="btn btn-warning fw-semibold text-dark">
                        <i class="bi bi-pencil-square me-1"></i> Edit Note
                    </a>
                    <button class="btn btn-light" onclick="window.print()" title="Print / Export PDF">
                        <i class="bi bi-printer-fill me-1"></i> Print
                    </button>
                    <a th:href="@{'/courses/' + ${note.course.id}}" class="btn btn-outline-light">
                        <i class="bi bi-arrow-left me-1"></i> Course
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="container note-container mb-5">
        <!-- Summary & Tags Banner -->
        <div class="card border-0 shadow-sm p-4 bg-white mb-4" th:if="${(note.summary != null and !note.summary.empty) or (note.keyConcepts != null and !note.keyConcepts.empty) or note.hasHomework}">
            <div class="row g-3">
                <div class="col-md-8" th:if="${note.summary != null and !note.summary.empty}">
                    <span class="text-muted small fw-bold text-uppercase d-block mb-1">Executive Summary</span>
                    <p class="mb-0 fw-medium text-dark" th:text="${note.summary}">Summary takeaway</p>
                </div>
                <div class="col-md-4 text-md-end" th:if="${note.examRelevanceRating != null and note.examRelevanceRating > 0}">
                    <span class="text-muted small fw-bold text-uppercase d-block mb-1">Exam Relevance</span>
                    <span class="star-rating fs-5">
                        <span th:each="i : ${#numbers.sequence(1, note.examRelevanceRating)}">★</span>
                    </span>
                </div>
                <div class="col-12 border-top pt-2" th:if="${note.keyConcepts != null and !note.keyConcepts.empty}">
                    <span class="text-muted small me-2"><i class="bi bi-tags-fill me-1"></i> Key Concepts:</span>
                    <span class="badge bg-secondary-subtle text-secondary me-1" th:each="chip : ${#strings.arraySplit(note.keyConcepts, ',')}" th:text="${#strings.trim(chip)}">tag</span>
                </div>
                <div class="col-12 border-top pt-2" th:if="${note.hasHomework}">
                    <div class="alert alert-warning mb-0 d-flex align-items-center">
                        <i class="bi bi-exclamation-triangle-fill fs-4 me-3 text-warning"></i>
                        <div>
                            <strong>Homework / Action Items:</strong>
                            <div th:text="${note.homeworkTodo != null ? note.homeworkTodo : 'Homework assigned in this lecture.'}">Todo</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Rendered Markdown Content Container -->
        <article class="rendered-markdown" id="contentArticle">
            <!-- Hidden raw markdown source -->
            <div id="rawMarkdown" style="display: none;" th:text="${note.contentMarkdown}"></div>
        </article>

        <!-- Danger Zone: Delete Note -->
        <div class="d-flex justify-content-between align-items-center mt-4 no-print text-muted small">
            <span th:if="${note.lastUpdated != null}" th:text="'Last updated: ' + ${#temporals.format(note.lastUpdated, 'dd.MM.yyyy HH:mm')}">Date</span>
            <form th:action="@{'/notes/' + ${note.id} + '/delete'}" method="post" onsubmit="return confirm('Are you sure you want to delete this lecture note?');">
                <button type="submit" class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-trash-fill me-1"></i> Delete Note
                </button>
            </form>
        </div>
    </main>

    <script>
        const rawEl = document.getElementById('rawMarkdown');
        const articleEl = document.getElementById('contentArticle');
        if (rawEl && articleEl && typeof marked !== 'undefined') {
            articleEl.innerHTML = marked.parse(rawEl.innerText || '*No content.*');
        }
    </script>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Train Stations')}">
    <title>Train Stations</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Train Stations', 'Railway stations, DS100 identifiers, and line associations', 'bi bi-pin-map', 'theme-transit', '/misc-management', 'Misc Dashboard')}"></header>

    <main class="container my-5">
        <!-- Quick Nav -->
        <div class="d-flex gap-2 mb-4">
            <a href="/train-trips" class="btn btn-outline-secondary btn-sm"><i class="bi bi-train-front me-1"></i> Trips</a>
            <a href="/train-stations" class="btn btn-outline-primary btn-sm active"><i class="bi bi-pin-map me-1"></i> Stations</a>
            <a href="/train-lines" class="btn btn-outline-secondary btn-sm"><i class="bi bi-signpost-split me-1"></i> Lines</a>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-lg-7">
                <div class="card slm-table-card shadow-sm h-100">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-building me-2 text-primary"></i>Station Directory</h5>
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(stations)} + ' stations'">0 stations</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 70px;">ID</th>
                                    <th>DS100 Code</th>
                                    <th class="pe-3">Station Name</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${stations}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td>
                                        <span class="code-pill" th:text="${e.ds100}"></span>
                                    </td>
                                    <td class="pe-3 fw-semibold text-dark" th:text="${e.name}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(stations)}">
                                    <td colspan="3" class="text-center py-4 text-muted">No train stations registered yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card slm-form-card shadow-sm">
                    <div class="card-header py-3 border-0">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-plus-circle me-2 text-primary"></i>Add Station</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/train-stations}" th:object="${trainstation}" method="post">
                            <div class="mb-3">
                                <label for="selectLine" class="form-label">Train Line</label>
                                <select id="selectLine" class="form-select" name="selectLine">
                                    <option th:each="l : ${lines}" th:value="${l.id}" th:text="${l.name + ' - ' + l.description}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="ds100" class="form-label">DS100 Code</label>
                                <input type="text" id="ds100" th:field="*{ds100}" class="form-control" placeholder="e.g. MH, BLS, FF">
                            </div>
                            <div class="mb-4">
                                <label for="name" class="form-label">Station Name <span class="text-danger">*</span></label>
                                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="e.g. München Hbf" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-plus-circle me-1"></i> Add Train Station
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

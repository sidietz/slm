<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Train Stations')}">
    <title>Train Stations</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Train Stations', 'Railway stations, DS100 identifiers, and line associations', 'bi bi-pin-map', 'theme-transit', '/misc-management', 'Misc Dashboard')}"></header>

    <main class="container my-5">
        <!-- Quick Nav -->
        <div class="d-flex gap-2 mb-4">
            <a href="/train-trips" class="btn btn-outline-secondary btn-sm"><i class="bi bi-train-front me-1"></i> Trips</a>
            <a href="/train-stations" class="btn btn-outline-primary btn-sm active"><i class="bi bi-pin-map me-1"></i> Stations</a>
            <a href="/train-lines" class="btn btn-outline-secondary btn-sm"><i class="bi bi-signpost-split me-1"></i> Lines</a>
        </div>

        <div class="row g-4 mb-5">
            <!-- Full-Width Train Stations Table Card -->
            <div class="col-12">
                <div class="card slm-table-card shadow-sm">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div class="d-flex align-items-center gap-2">
                            <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-building me-2 text-primary"></i>Station Directory</h5>
                            <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(stations)} + ' stations'">0 stations</span>
                        </div>
                        <button type="button" class="btn btn-primary fw-semibold" onclick="openCreateTrainStationModal()">
                            <i class="bi bi-plus-circle me-1"></i> Add Station
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 70px;">ID</th>
                                    <th>DS100 Code</th>
                                    <th>Station Name</th>
                                    <th class="text-end pe-3" style="width: 100px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${stations}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td>
                                        <span class="code-pill" th:text="${e.ds100}"></span>
                                    </td>
                                    <td class="fw-semibold text-dark" th:text="${e.name}"></td>
                                    <td class="text-end pe-3">
                                        <button type="button" 
                                                class="btn btn-sm btn-outline-primary" 
                                                title="Edit Station"
                                                th:data-id="${e.id}"
                                                th:data-ds100="${e.ds100}"
                                                th:data-name="${e.name}"
                                                onclick="populateEditTrainStationModal(this)">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(stations)}">
                                    <td colspan="4" class="text-center py-4 text-muted">No train stations registered yet. Click "Add Station" above to register a station.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Dual-Purpose Modal for Adding and Editing Train Stations -->
    <div class="modal fade" id="trainStationModal" tabindex="-1" aria-labelledby="trainStationModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-white py-3 border-bottom">
                    <h5 class="modal-title fw-bold text-dark" id="trainStationModalLabel">
                        <i class="bi bi-pin-map me-2 text-primary"></i>Add Train Station
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="trainStationForm" th:action="@{/train-stations}" method="post">
                    <input type="hidden" id="modalTrainStationId" name="id" value="">
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="modalTrainStationLine" class="form-label fw-semibold">Train Line</label>
                                <select id="modalTrainStationLine" name="lineId" class="form-select">
                                    <option value="">— Select Rail Line —</option>
                                    <option th:each="l : ${lines}" th:value="${l.id}" th:text="${l.name + ' - ' + l.description}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="modalTrainStationDs100" class="form-label fw-semibold">DS100 Code</label>
                                <input type="text" id="modalTrainStationDs100" name="ds100" class="form-control" placeholder="e.g. MH, BLS, FF">
                            </div>
                            <div class="col-md-6">
                                <label for="modalTrainStationName" class="form-label fw-semibold">Station Name <span class="text-danger">*</span></label>
                                <input type="text" id="modalTrainStationName" name="name" class="form-control" placeholder="e.g. München Hbf" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-top py-3">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="modalTrainStationSubmitBtn" class="btn btn-primary fw-semibold px-4">
                            <i class="bi bi-plus-circle me-1"></i> Save Station
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
        function openCreateTrainStationModal() {
            document.getElementById('trainStationForm').reset();
            document.getElementById('modalTrainStationId').value = '';
            document.getElementById('trainStationModalLabel').innerHTML = '<i class="bi bi-pin-map me-2 text-primary"></i>Add Train Station';
            document.getElementById('modalTrainStationSubmitBtn').innerHTML = '<i class="bi bi-plus-circle me-1"></i> Save Station';
            document.getElementById('modalTrainStationSubmitBtn').className = 'btn btn-primary fw-semibold px-4';

            const modal = new bootstrap.Modal(document.getElementById('trainStationModal'));
            modal.show();
        }

        function populateEditTrainStationModal(btn) {
            const ds = btn.dataset;
            document.getElementById('modalTrainStationId').value = ds.id || '';
            document.getElementById('modalTrainStationDs100').value = ds.ds100 || '';
            document.getElementById('modalTrainStationName').value = ds.name || '';

            document.getElementById('trainStationModalLabel').innerHTML = `<i class="bi bi-pencil-square me-2 text-warning"></i>Edit Station #${ds.id}`;
            document.getElementById('modalTrainStationSubmitBtn').innerHTML = '<i class="bi bi-check2-circle me-1"></i> Update Station';
            document.getElementById('modalTrainStationSubmitBtn').className = 'btn btn-warning fw-semibold px-4';

            const modal = new bootstrap.Modal(document.getElementById('trainStationModal'));
            modal.show();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Habit Checklist')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Habit Checklist', 'Review last completed times, interval differences, and record completions', 'bi bi-calendar-check', 'theme-habit', '/habit-management', 'Habit Dashboard')}"></header>

    <main class="container mb-5">
        <!-- Habit Selection Card -->
        <section class="card slm-card mb-4">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <label class="form-label fw-bold mb-md-0"><i class="bi bi-funnel me-1"></i>Select Active Habit:</label>
                </div>
                <div class="col-md-8">
                    <form th:action="@{/last-done-habit-entries}" method="post">
                        <select class="form-select form-select-lg" name="selectLine" onchange="updateLastDone(event)">
                            <option th:each="l : ${habits}" th:value="${l.id}"
                                    th:text="${l.name}" th:selected="(${habitId} == ${l.id})"></option>
                        </select>
                    </form>
                </div>
            </div>
        </section>

        <!-- Log Completion Form Card -->
        <section class="card slm-form-card mb-4" th:if="${habitentry != null}">
            <h2 class="text-success"><i class="bi bi-check-circle me-2"></i>Log Habit Completion</h2>
            <form th:action="@{/last-done-habit-entries(id=${habit != null ? habit.id : habitId})}" th:object="${habitentry}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Habit Name</label>
                        <input type="text" th:value="${habitentry.habit != null ? habitentry.habit.name : (habit != null ? habit.name : '')}" class="form-control" disabled />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Completion Date &amp; Time <span class="text-danger">*</span></label>
                        <input type="datetime-local" th:field="*{lastDone}" class="form-control" required />
                    </div>
                    <div class="col-12 text-end mt-3">
                        <button type="submit" class="btn btn-success px-4 fw-semibold">
                            <i class="bi bi-check2-circle me-1"></i> Mark as Done
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Recent Completions History Table Card -->
        <section class="card slm-table-card" th:unless="${#lists.isEmpty(lastdonehabitentries)}">
            <h2 class="h4 fw-bold mb-3 text-dark">
                <i class="bi bi-clock-history me-2 text-primary"></i>Completion History
            </h2>
            <div class="table-responsive">
                <table class="table slm-table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Completion Date</th>
                            <th>Time Since Previous (Difference)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${lastdonehabitentries}">
                            <td class="text-muted small" th:text="${e.id}">1</td>
                            <td class="small" th:text="${#temporals.format(e.date, 'dd.MM.yyyy HH:mm')}">01.01.2026 12:00</td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${e.difference}">2 days</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
    function updateLastDone(event) {
        var searchParams = new URLSearchParams(window.location.search);
        searchParams.set("id", event.target.value);
        window.location.search = searchParams.toString();
    }
    </script>
</body>
</html>

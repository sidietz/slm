<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Employers &amp; Clients')}">
    <title>Employers &amp; Clients</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Employers &amp; Clients', 'Manage employers, contracting firms, and direct clients for professional working sessions', 'bi bi-briefcase', 'theme-work', '/spend-management', 'Spend Dashboard')}"></header>

    <main class="container my-5">
        <div class="row g-4 mb-5">
            <!-- Full-Width Employers Table Card -->
            <div class="col-12">
                <div class="card slm-table-card shadow-sm">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div class="d-flex align-items-center gap-2">
                            <h5 class="mb-0 fw-semibold text-dark">
                                <i class="bi bi-briefcase me-2 text-primary"></i>Employer Directory
                            </h5>
                            <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(employers)} + ' employers'">0 employers</span>
                        </div>
                        <button type="button" class="btn btn-primary fw-semibold" onclick="openCreateEmployerModal()">
                            <i class="bi bi-plus-circle me-1"></i> Add Employer
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 80px;">ID</th>
                                    <th>Employer / Client Name</th>
                                    <th class="text-end pe-3" style="width: 100px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${employers}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td class="fw-semibold text-dark">
                                        <i class="bi bi-building me-2 text-muted"></i>
                                        <span th:text="${e.name}"></span>
                                    </td>
                                    <td class="text-end pe-3">
                                        <button type="button" 
                                                class="btn btn-sm btn-outline-primary" 
                                                title="Edit Employer"
                                                th:data-id="${e.id}"
                                                th:data-name="${e.name}"
                                                onclick="populateEditEmployerModal(this)">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(employers)}">
                                    <td colspan="3" class="text-center py-4 text-muted">
                                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                        No employers or clients configured yet. Click "Add Employer" above to add your first employer.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Dual-Purpose Modal for Adding and Editing Employers -->
    <div class="modal fade" id="employerModal" tabindex="-1" aria-labelledby="employerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-white py-3 border-bottom">
                    <h5 class="modal-title fw-bold text-dark" id="employerModalLabel">
                        <i class="bi bi-building-add me-2 text-primary"></i>Add Employer
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="employerForm" th:action="@{/employers}" method="post">
                    <input type="hidden" id="modalEmployerId" name="id" value="">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label for="modalEmployerName" class="form-label fw-semibold">
                                Employer / Client Name <span class="text-danger">*</span>
                            </label>
                            <input type="text" id="modalEmployerName" name="name" class="form-control" placeholder="e.g. Acme Corp, Oberam Systems, TechCorp" required>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-top py-3">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="modalEmployerSubmitBtn" class="btn btn-primary fw-semibold px-4">
                            <i class="bi bi-plus-circle me-1"></i> Save Employer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
        function openCreateEmployerModal() {
            document.getElementById('employerForm').reset();
            document.getElementById('modalEmployerId').value = '';
            document.getElementById('employerModalLabel').innerHTML = '<i class="bi bi-building-add me-2 text-primary"></i>Add Employer';
            document.getElementById('modalEmployerSubmitBtn').innerHTML = '<i class="bi bi-plus-circle me-1"></i> Save Employer';
            document.getElementById('modalEmployerSubmitBtn').className = 'btn btn-primary fw-semibold px-4';

            const modal = new bootstrap.Modal(document.getElementById('employerModal'));
            modal.show();
        }

        function populateEditEmployerModal(btn) {
            const ds = btn.dataset;
            document.getElementById('modalEmployerId').value = ds.id || '';
            document.getElementById('modalEmployerName').value = ds.name || '';

            document.getElementById('employerModalLabel').innerHTML = `<i class="bi bi-pencil-square me-2 text-warning"></i>Edit Employer #${ds.id}`;
            document.getElementById('modalEmployerSubmitBtn').innerHTML = '<i class="bi bi-check2-circle me-1"></i> Update Employer';
            document.getElementById('modalEmployerSubmitBtn').className = 'btn btn-warning fw-semibold px-4';

            const modal = new bootstrap.Modal(document.getElementById('employerModal'));
            modal.show();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Analytics | SLM</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/slm.css}" rel="stylesheet" />
    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"
        integrity="sha512-vc58qvvBdrDR4etbxMdlTt4GBQk1qjvyORR2nrsPsFPyrs+/u5c3+1Ct6upOgdZoIl7eq6k3a1UPDSNAQi/32A=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/billboard.js/3.16.0/billboard.min.js"
        integrity="sha512-HPcVm27xXkAoXgeg7jiK4Y9kIbXbwk2GiOxAzQ+EwdA3TNYtFAK0tYHoFS7KAK9zNRf89Oa5Qtnkw5gDpDR7Ww=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/billboard.js/3.16.0/billboard.min.css"
        integrity="sha512-njOj5MWC/MCTRlxjIsftPrGL3nuexguTsEN1qE8eLU6LZW1ZyccshJ1a2QneVxsyeDjbEqXl9TJNfCFUj8pDDg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Sleep Analytics', 'Visual trend charts and historical sleep durations', 'bi bi-graph-up', 'theme-wellness', '/sleep-times', 'Sleep Times')}"></header>

    <main class="container mb-5">
        <!-- Chart Card -->
        <section class="card slm-card mb-4 p-4">
            <h2 class="h5 fw-bold text-dark mb-3"><i class="bi bi-bar-chart-line me-2 text-success"></i>Sleep Duration History (Hours)</h2>
            <div id="chart" style="min-height: 320px;"></div>
        </section>

        <!-- Sleep Times Table Card -->
        <section class="card slm-table-card" th:unless="${#lists.isEmpty(sleeptimes)}">
            <h2 class="h5 fw-bold text-dark mb-3"><i class="bi bi-moon-stars me-2 text-success"></i>Recent Sleep Logs</h2>
            <div class="table-responsive">
                <table class="table slm-table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Bedtime</th>
                            <th>Wake Up</th>
                            <th>Duration</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${sleeptimes}">
                            <td class="text-muted small" th:text="${e.id}">1</td>
                            <td class="small" th:text="${#temporals.format(e.gotobed, 'dd.MM.yyyy HH:mm')}">01.01.2026 23:00</td>
                            <td class="small" th:text="${#temporals.format(e.getup, 'dd.MM.yyyy HH:mm')}">02.01.2026 07:30</td>
                            <td>
                                <span class="badge bg-success text-white" th:text="${{e.sleeptime}}">510 min</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script th:inline="none">
    function getData2() {
        let url = "/api/sleeptimes";
        fetch(url).then((response) => {
            return response.json();
        }).then((data) => {
            return convertToBb(data);
        }).catch((error) => console.error('Error fetching sleep data:', error));
    }

    function parseDuration(rawDuration) {
        if (rawDuration === null || rawDuration === undefined || rawDuration === "") return 0;
        if (typeof rawDuration === 'number') {
            return +(rawDuration / 3600).toFixed(2);
        }
        let str = String(rawDuration).trim();
        if (!isNaN(str)) {
            return +(Number(str) / 3600).toFixed(2);
        }
        if (str.startsWith("PT")) {
            str = str.slice(2);
            if (str.endsWith("S")) str = str.slice(0, -1);
            let hours = 0;
            let minutes = 0;
            if (str.includes("H")) {
                let parts = str.split("H");
                hours = Number(parts[0]) || 0;
                str = parts[1] || "";
            }
            if (str.includes("M")) {
                minutes = Number(str.replace("M", "")) || 0;
            }
            return +(hours + (minutes / 60)).toFixed(2);
        }
        return Number(str) || 0;
    }

    function convertToBb(rawData) {
        if (!rawData || rawData.length === 0) {
            return;
        }

        let x = ["x"];
        let result = ["Sleep Duration (h)"];

        for (let e of rawData) {
            let ldt = e.gotobed ? e.gotobed.split("T")[0] : "";
            let st = parseDuration(e.sleeptime);
            x.push(ldt);
            result.push(st);
        }

        chart.load({
            columns: [x, result]
        });

        chart.axis.max(14);
        chart.axis.min(4);
        return result;
    }

    var chart = bb.generate({
        bindto: "#chart",
        axis: {
            x: {
                type: "timeseries",
                tick: {
                    format: "%Y-%m-%d"
                }
            },
            y: {
                label: "Hours of Sleep"
            }
        },
        data: {
            x: "x",
            type: "spline",
            colors: {
                "Sleep Duration (h)": "#10b981"
            },
            columns: []
        }
    });

    getData2();
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Habit Entries Archive')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Habit Entries Archive', 'Historical record of all logged habit completions across habits', 'bi bi-archive', 'theme-habit', '/habit-management', 'Habit Dashboard')}"></header>

    <main class="container mb-5">
        <!-- Habit Entries Table Card -->
        <section class="card slm-table-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 fw-bold mb-0 text-dark">
                    <i class="bi bi-list-check me-2 text-primary"></i>All Habit Entries
                    <span class="badge bg-primary-subtle text-primary ms-2 fs-6" th:text="${habitentries != null ? habitentries.size() : 0}">0</span>
                </h2>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-primary btn-sm fw-semibold" data-bs-toggle="modal" data-bs-target="#habitEntryModal">
                        <i class="bi bi-plus-circle me-1"></i> Log Habit Entry
                    </button>
                    <a th:href="@{/last-done-habit-entries}" class="btn btn-outline-success btn-sm">
                        <i class="bi bi-calendar-check me-1"></i> Interactive Checklist
                    </a>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table slm-table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Habit</th>
                            <th>Completion Date &amp; Time</th>
                            <th class="text-end" style="width: 100px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${habitentries == null or habitentries.empty}">
                            <td colspan="4" class="text-center py-4 text-muted">
                                No habit entries recorded yet.
                            </td>
                        </tr>
                        <tr th:each="e : ${habitentries}">
                            <td class="text-muted small" th:text="${e.id}">1</td>
                            <td>
                                <strong th:text="${e.habit != null ? e.habit.name : 'Habit'}">Habit</strong>
                            </td>
                            <td class="small" th:text="${#temporals.format(e.lastDone, 'dd.MM.yyyy HH:mm')}">01.01.2026 12:00</td>
                            <td class="text-end">
                                <button type="button" class="btn btn-sm btn-outline-primary"
                                        data-bs-toggle="modal"
                                        data-bs-target="#habitEntryModal"
                                        th:data-id="${e.id}"
                                        th:data-habit="${e.habit != null ? e.habit.id : ''}"
                                        th:data-last-done="${e.lastDone}">
                                    <i class="bi bi-pencil me-1"></i>Edit
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Habit Entry Modal (Add / Edit) -->
        <div class="modal fade" id="habitEntryModal" tabindex="-1" aria-labelledby="habitEntryModalTitle" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form th:action="@{/habit-entries}" th:object="${habitentry}" method="post" id="habitEntryForm">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold" id="habitEntryModalTitle">
                                <i class="bi bi-plus-circle me-2 text-primary"></i>Log Habit Entry
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" th:field="*{id}" id="habitEntryId" />
                            <div class="mb-3">
                                <label class="form-label">Habit <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{habit}" id="habitEntrySelect" required>
                                    <option value="">-- Select Habit --</option>
                                    <option th:each="s : ${habits}" th:value="${s.id}" th:text="${s.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Completion Date &amp; Time <span class="text-danger">*</span></label>
                                <input type="datetime-local" th:field="*{lastDone}" id="habitEntryLastDone" class="form-control" required />
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold" id="habitEntrySubmitBtn">
                                <i class="bi bi-save me-1"></i> Save Entry
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const habitEntryModal = document.getElementById('habitEntryModal');
            if (habitEntryModal) {
                habitEntryModal.addEventListener('show.bs.modal', function (event) {
                    const button = event.relatedTarget;
                    const id = button ? button.getAttribute('data-id') : null;
                    const modalTitle = document.getElementById('habitEntryModalTitle');
                    const submitBtn = document.getElementById('habitEntrySubmitBtn');

                    if (id) {
                        modalTitle.innerHTML = '<i class="bi bi-pencil me-2 text-primary"></i>Edit Habit Entry';
                        submitBtn.innerHTML = '<i class="bi bi-save me-1"></i> Update Entry';
                        document.getElementById('habitEntryId').value = id;
                        document.getElementById('habitEntrySelect').value = button.getAttribute('data-habit') || '';
                        document.getElementById('habitEntryLastDone').value = button.getAttribute('data-last-done') || '';
                    } else {
                        modalTitle.innerHTML = '<i class="bi bi-plus-circle me-2 text-primary"></i>Log Habit Entry';
                        submitBtn.innerHTML = '<i class="bi bi-save me-1"></i> Save Entry';
                        document.getElementById('habitEntryForm').reset();
                        document.getElementById('habitEntryId').value = '';
                    }
                });

                habitEntryModal.addEventListener('hidden.bs.modal', function () {
                    document.getElementById('habitEntryForm').reset();
                    document.getElementById('habitEntryId').value = '';
                });
            }
        });
    </script>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

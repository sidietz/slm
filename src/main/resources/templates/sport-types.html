<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Sport Types')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Sport Types', 'Configure categories and kinds of physical sport and workouts', 'bi bi-trophy', 'theme-activity', '/sports', 'Sports')}"></header>

    <main class="container mb-5">
        <div class="row g-4">
            <!-- Add Sport Type Card -->
            <div class="col-md-5">
                <section class="card slm-form-card">
                    <h2 class="text-danger"><i class="bi bi-plus-circle me-2"></i>Add Sport Type</h2>
                    <form th:action="@{/sport-types}" th:object="${sportType}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Sport Name <span class="text-danger">*</span></label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Swimming, Running, Cycling, HIIT" required />
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-danger px-4 fw-semibold">
                                <i class="bi bi-save me-1"></i> Add Sport Type
                            </button>
                        </div>
                    </form>
                </section>
            </div>

            <!-- Existing Sport Types Table Card -->
            <div class="col-md-7">
                <section class="card slm-table-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h4 fw-bold mb-0 text-dark">
                            <i class="bi bi-trophy me-2 text-danger"></i>Configured Sport Types
                            <span class="badge bg-danger-subtle text-danger ms-2 fs-6" th:text="${types != null ? types.size() : 0}">0</span>
                        </h2>
                    </div>

                    <div class="table-responsive">
                        <table class="table slm-table align-middle">
                            <thead>
                                <tr>
                                    <th style="width: 100px;">ID</th>
                                    <th>Sport Name</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${types == null or types.empty}">
                                    <td colspan="2" class="text-center py-4 text-muted">
                                        No sport types defined yet.
                                    </td>
                                </tr>
                                <tr th:each="t : ${types}">
                                    <td class="text-muted small" th:text="${t.id}">1</td>
                                    <td>
                                        <strong th:text="${t.name}">Sport</strong>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Selfies')}">
    <title>Selfies</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Photo Journal', 'Visual memory timeline, snapshots, and selfies', 'bi bi-camera', 'theme-social', '/human-management', 'Social Dashboard')}"></header>

    <main class="container my-5">
        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${param.error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${param.success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-lg-7">
                <div class="card slm-table-card shadow-sm h-100">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-images me-2 text-primary"></i>Photo Entries</h5>
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(selfies)} + ' photos'">0 photos</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 70px;">ID</th>
                                    <th>Date</th>
                                    <th class="pe-3">Location</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${selfies}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${s.id}"></td>
                                    <td class="fw-semibold text-dark" th:text="${#temporals.format(s.date, 'dd.MM.yyyy')}"></td>
                                    <td class="pe-3 text-muted" th:text="${s.location}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(selfies)}">
                                    <td colspan="3" class="text-center py-4 text-muted">No photos uploaded yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card slm-form-card shadow-sm">
                    <div class="card-header py-3 border-0">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-cloud-upload me-2 text-primary"></i>Upload Snapshot</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/selfies}" th:object="${selfie}" method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="photoDate" class="form-label">Date <span class="text-danger">*</span></label>
                                <input type="date" id="photoDate" th:field="*{date}" class="form-control" required>
                            </div>
                            <div class="mb-4">
                                <label for="file" class="form-label">Select Photo (.jpg or .heic) <span class="text-danger">*</span></label>
                                <input type="file" name="file" id="file" class="form-control" accept=".jpg,.jpeg,.heic,.JPG,.JPEG,.HEIC,image/jpeg,image/heic" required>
                                <div class="form-text text-muted small">Supported formats: JPEG (.jpg, .jpeg) and High Efficiency Image (.heic). Photos are stored as-is without conversion.</div>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary flex-grow-1 py-2">
                                    <i class="bi bi-upload me-1"></i> Upload
                                </button>
                                <button type="reset" class="btn btn-outline-secondary py-2">Reset</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Points')}">
    <title>Points</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('GPS Points', 'Waypoints, key locations, and geographic coordinates', 'bi bi-geo-alt', 'theme-cars', '/misc-management', 'Misc Dashboard')}"></header>

    <main class="container my-5">
        <!-- Quick Nav -->
        <div class="d-flex gap-2 mb-4">
            <a href="/cars" class="btn btn-outline-secondary btn-sm"><i class="bi bi-car-front me-1"></i> Vehicles</a>
            <a href="/car-trips" class="btn btn-outline-secondary btn-sm"><i class="bi bi-sign-turn-right me-1"></i> Trips</a>
            <a href="/routes" class="btn btn-outline-secondary btn-sm"><i class="bi bi-map me-1"></i> Routes</a>
            <a href="/points" class="btn btn-outline-primary btn-sm active"><i class="bi bi-geo-alt me-1"></i> Points</a>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-lg-7">
                <div class="card slm-table-card shadow-sm h-100">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-pin-map-fill me-2 text-primary"></i>Saved Locations</h5>
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(points)} + ' points'">0 points</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 60px;">ID</th>
                                    <th>Name</th>
                                    <th>Description</th>
                                    <th>Latitude</th>
                                    <th class="pe-3">Longitude</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${points}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td class="fw-semibold text-dark">
                                        <span th:text="${e.name}"></span>
                                        <span th:if="${e.isHome}" class="badge bg-success-subtle text-success border border-success-subtle rounded-pill ms-1 small"><i class="bi bi-house-door-fill me-1"></i>Home Base</span>
                                    </td>
                                    <td class="text-muted small" th:text="${e.description}"></td>
                                    <td><span class="code-pill" th:text="${e.latitude}"></span></td>
                                    <td class="pe-3"><span class="code-pill" th:text="${e.longitude}"></span></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(points)}">
                                    <td colspan="5" class="text-center py-4 text-muted">No GPS points recorded yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card slm-form-card shadow-sm">
                    <div class="card-header py-3 border-0">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-plus-circle me-2 text-primary"></i>Add Point</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/points}" th:object="${point}" method="post">
                            <div class="mb-3">
                                <label for="name" class="form-label">Location Name <span class="text-danger">*</span></label>
                                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="e.g. Home, HQ Munich" required>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                                <input type="text" id="description" th:field="*{description}" class="form-control" placeholder="e.g. Primary residence garage" required>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label for="lat" class="form-label">Latitude (°N/S) <span class="text-danger">*</span></label>
                                    <input type="number" step="any" id="lat" th:field="*{latitude}" class="form-control font-monospace" placeholder="e.g. 49.284581" required>
                                </div>
                                <div class="col-6">
                                    <label for="long" class="form-label">Longitude (°E/W) <span class="text-danger">*</span></label>
                                    <input type="number" step="any" id="long" th:field="*{longitude}" class="form-control font-monospace" placeholder="e.g. 10.681444" required>
                                </div>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="isHome" th:field="*{isHome}">
                                <label class="form-check-label small" for="isHome">
                                    Set as primary residence / Home base
                                </label>
                            </div>
                            <div class="form-text mb-4 text-muted small"><i class="bi bi-info-circle me-1"></i>Coordinates are stored as WGS 84 geography points for PostGIS spatial calculations.</div>
                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-plus-circle me-1"></i> Add Point
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Points</title>
<link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"
	rel="stylesheet" />
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"
	defer></script>
</head>

<body class="container mt-5">
    <h1 class="mb-4">Points</h1>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>name</th>
                <th>description</th>
                <th>latitude</th>
                <th>longitude</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e : ${points}">
                <td th:text="${e.id}"></td>
				<td th:text="${e.name}"></td>
				<td th:text="${e.description}"></td>
				<td th:text="${e.latitude}"></td>
				<td th:text="${e.longitude}"></td>
            </tr>
        </tbody>
    </table>

    <h2 class="mt-5">Add Point</h2>
    <form action="#" th:action="@{/points}" th:object="${point}" method="post" class="mb-5">
        <div class="mb-3">
            <label for="name" class="form-label">Name:</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">Description:</label>
            <input type="text" th:field="*{description}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">Lat:</label>
            <input type="text" th:field="*{latitude}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">Long:</label>
            <input type="text" th:field="*{longitude}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Point</button>
    </form>
	<a href="/cars" class="btn btn-secondary">View Cars</a>
    <a href="/points" class="btn btn-secondary">View Points</a>
    <a href="/routes" class="btn btn-secondary">View Routes</a>
    <a href="/misc-management" class="btn btn-secondary">Back to Dashboard</a>
</body>

</html>

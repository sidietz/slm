<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Points')}">
    <title>Points</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('GPS Points', 'Waypoints, key locations, and geographic coordinates', 'bi bi-geo-alt', 'theme-cars', '/misc-management', 'Misc Dashboard')}"></header>

    <main class="container my-5">
        <!-- Quick Nav -->
        <div class="d-flex gap-2 mb-4">
            <a href="/cars" class="btn btn-outline-secondary btn-sm"><i class="bi bi-car-front me-1"></i> Vehicles</a>
            <a href="/car-trips" class="btn btn-outline-secondary btn-sm"><i class="bi bi-sign-turn-right me-1"></i> Trips</a>
            <a href="/routes" class="btn btn-outline-secondary btn-sm"><i class="bi bi-map me-1"></i> Routes</a>
            <a href="/points" class="btn btn-outline-primary btn-sm active"><i class="bi bi-geo-alt me-1"></i> Points</a>
        </div>

        <div class="row g-4 mb-5">
            <!-- Full-Width Points Table Card -->
            <div class="col-12">
                <div class="card slm-table-card shadow-sm">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div class="d-flex align-items-center gap-2">
                            <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-pin-map-fill me-2 text-primary"></i>Saved Locations</h5>
                            <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(points)} + ' points'">0 points</span>
                        </div>
                        <button type="button" class="btn btn-primary fw-semibold" onclick="openCreatePointModal()">
                            <i class="bi bi-plus-circle me-1"></i> Add Point
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 60px;">ID</th>
                                    <th>Name</th>
                                    <th>Description</th>
                                    <th>Latitude</th>
                                    <th>Longitude</th>
                                    <th class="text-end pe-3" style="width: 100px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${points}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td class="fw-semibold text-dark">
                                        <span th:text="${e.name}"></span>
                                        <span th:if="${e.isHome}" class="badge bg-success-subtle text-success border border-success-subtle rounded-pill ms-1 small"><i class="bi bi-house-door-fill me-1"></i>Home Base</span>
                                    </td>
                                    <td class="text-muted small" th:text="${e.description}"></td>
                                    <td><span class="code-pill" th:text="${e.latitude}"></span></td>
                                    <td><span class="code-pill" th:text="${e.longitude}"></span></td>
                                    <td class="text-end pe-3">
                                        <button type="button" 
                                                class="btn btn-sm btn-outline-primary" 
                                                title="Edit Point"
                                                th:data-id="${e.id}"
                                                th:data-name="${e.name}"
                                                th:data-description="${e.description}"
                                                th:data-latitude="${e.latitude}"
                                                th:data-longitude="${e.longitude}"
                                                th:data-is-home="${e.isHome}"
                                                onclick="populateEditPointModal(this)">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(points)}">
                                    <td colspan="6" class="text-center py-4 text-muted">No GPS points recorded yet. Click "Add Point" above to save a geographic waypoint.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Dual-Purpose Modal for Adding and Editing Points -->
    <div class="modal fade" id="pointModal" tabindex="-1" aria-labelledby="pointModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-white py-3 border-bottom">
                    <h5 class="modal-title fw-bold text-dark" id="pointModalLabel">
                        <i class="bi bi-geo-alt me-2 text-primary"></i>Add Point
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="pointForm" th:action="@{/points}" method="post">
                    <input type="hidden" id="modalPointId" name="id" value="">
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="modalPointName" class="form-label fw-semibold">Location Name <span class="text-danger">*</span></label>
                                <input type="text" id="modalPointName" name="name" class="form-control" placeholder="e.g. Home, HQ Munich" required>
                            </div>
                            <div class="col-12">
                                <label for="modalPointDescription" class="form-label fw-semibold">Description <span class="text-danger">*</span></label>
                                <input type="text" id="modalPointDescription" name="description" class="form-control" placeholder="e.g. Primary residence garage" required>
                            </div>
                            <div class="col-md-6">
                                <label for="modalPointLat" class="form-label fw-semibold">Latitude (°N/S) <span class="text-danger">*</span></label>
                                <input type="number" step="any" id="modalPointLat" name="latitude" class="form-control font-monospace" placeholder="e.g. 49.284581" required>
                            </div>
                            <div class="col-md-6">
                                <label for="modalPointLong" class="form-label fw-semibold">Longitude (°E/W) <span class="text-danger">*</span></label>
                                <input type="number" step="any" id="modalPointLong" name="longitude" class="form-control font-monospace" placeholder="e.g. 10.681444" required>
                            </div>
                            <div class="col-12">
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" id="modalPointIsHome" name="isHome">
                                    <label class="form-check-label fw-semibold" for="modalPointIsHome">
                                        Set as primary residence / Home base
                                    </label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="p-3 bg-light rounded-3 border">
                                    <div class="text-muted small"><i class="bi bi-info-circle me-1 text-primary"></i>Coordinates are stored as WGS 84 geography points for PostGIS spatial calculations.</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-top py-3">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="modalPointSubmitBtn" class="btn btn-primary fw-semibold px-4">
                            <i class="bi bi-plus-circle me-1"></i> Save Point
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
        function openCreatePointModal() {
            document.getElementById('pointForm').reset();
            document.getElementById('modalPointId').value = '';
            document.getElementById('pointModalLabel').innerHTML = '<i class="bi bi-geo-alt me-2 text-primary"></i>Add Point';
            document.getElementById('modalPointSubmitBtn').innerHTML = '<i class="bi bi-plus-circle me-1"></i> Save Point';
            document.getElementById('modalPointSubmitBtn').className = 'btn btn-primary fw-semibold px-4';
            document.getElementById('modalPointIsHome').checked = false;

            const modal = new bootstrap.Modal(document.getElementById('pointModal'));
            modal.show();
        }

        function populateEditPointModal(btn) {
            const ds = btn.dataset;
            document.getElementById('modalPointId').value = ds.id || '';
            document.getElementById('modalPointName').value = ds.name || '';
            document.getElementById('modalPointDescription').value = ds.description || '';
            document.getElementById('modalPointLat').value = ds.latitude || '';
            document.getElementById('modalPointLong').value = ds.longitude || '';
            document.getElementById('modalPointIsHome').checked = ds.isHome === 'true';

            document.getElementById('pointModalLabel').innerHTML = `<i class="bi bi-pencil-square me-2 text-warning"></i>Edit Point #${ds.id}`;
            document.getElementById('modalPointSubmitBtn').innerHTML = '<i class="bi bi-check2-circle me-1"></i> Update Point';
            document.getElementById('modalPointSubmitBtn').className = 'btn btn-warning fw-semibold px-4';

            const modal = new bootstrap.Modal(document.getElementById('pointModal'));
            modal.show();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Habit Definitions')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Habit Definitions', 'Configure recurring habits, goals, and daily targets', 'bi bi-list-check', 'theme-habit', '/habit-management', 'Habit Dashboard')}"></header>

    <main class="container mb-5">
        <!-- Existing Habits Table Card -->
        <section class="card slm-table-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 fw-bold mb-0 text-dark">
                    <i class="bi bi-check2-square me-2 text-primary"></i>Configured Habits
                    <span class="badge bg-primary-subtle text-primary ms-2 fs-6" th:text="${habits != null ? habits.size() : 0}">0</span>
                </h2>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-primary btn-sm fw-semibold" data-bs-toggle="modal" data-bs-target="#habitModal">
                        <i class="bi bi-plus-circle me-1"></i> Add Habit
                    </button>
                    <a th:href="@{/last-done-habit-entries}" class="btn btn-outline-success btn-sm">
                        <i class="bi bi-calendar-check me-1"></i> Check Habits
                    </a>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table slm-table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th class="text-end" style="width: 100px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${habits == null or habits.empty}">
                            <td colspan="4" class="text-center py-4 text-muted">
                                No habits configured yet. Create your first habit!
                            </td>
                        </tr>
                        <tr th:each="e : ${habits}">
                            <td class="text-muted small" th:text="${e.id}">1</td>
                            <td>
                                <strong th:text="${e.name}">Habit Name</strong>
                            </td>
                            <td class="text-muted" th:text="${e.description != null and !e.description.empty ? e.description : '-'}">Description</td>
                            <td class="text-end">
                                <button type="button" class="btn btn-sm btn-outline-primary"
                                        data-bs-toggle="modal"
                                        data-bs-target="#habitModal"
                                        th:data-id="${e.id}"
                                        th:data-name="${e.name}"
                                        th:data-description="${e.description}">
                                    <i class="bi bi-pencil me-1"></i>Edit
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Habit Modal (Add / Edit) -->
        <div class="modal fade" id="habitModal" tabindex="-1" aria-labelledby="habitModalTitle" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form th:action="@{/habits}" th:object="${habit}" method="post" id="habitForm">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold" id="habitModalTitle">
                                <i class="bi bi-plus-circle me-2 text-primary"></i>Add Habit
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" th:field="*{id}" id="habitId" />
                            <div class="mb-3">
                                <label class="form-label">Habit Name <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{name}" id="habitName" class="form-control" placeholder="e.g. Morning Stretch, Read 20 pages" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <input type="text" th:field="*{description}" id="habitDescription" class="form-control" placeholder="Context or routine notes..." />
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold" id="habitSubmitBtn">
                                <i class="bi bi-save me-1"></i> Add Habit
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const habitModal = document.getElementById('habitModal');
            if (habitModal) {
                habitModal.addEventListener('show.bs.modal', function (event) {
                    const button = event.relatedTarget;
                    const id = button ? button.getAttribute('data-id') : null;
                    const modalTitle = document.getElementById('habitModalTitle');
                    const submitBtn = document.getElementById('habitSubmitBtn');

                    if (id) {
                        modalTitle.innerHTML = '<i class="bi bi-pencil me-2 text-primary"></i>Edit Habit';
                        submitBtn.innerHTML = '<i class="bi bi-save me-1"></i> Update Habit';
                        document.getElementById('habitId').value = id;
                        document.getElementById('habitName').value = button.getAttribute('data-name') || '';
                        document.getElementById('habitDescription').value = button.getAttribute('data-description') || '';
                    } else {
                        modalTitle.innerHTML = '<i class="bi bi-plus-circle me-2 text-primary"></i>Add Habit';
                        submitBtn.innerHTML = '<i class="bi bi-save me-1"></i> Add Habit';
                        document.getElementById('habitForm').reset();
                        document.getElementById('habitId').value = '';
                    }
                });

                habitModal.addEventListener('hidden.bs.modal', function () {
                    document.getElementById('habitForm').reset();
                    document.getElementById('habitId').value = '';
                });
            }
        });
    </script>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

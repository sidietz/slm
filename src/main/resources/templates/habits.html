<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Habit Definitions')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Habit Definitions', 'Configure recurring habits, goals, and daily targets', 'bi bi-list-check', 'theme-habit', '/habit-management', 'Habit Dashboard')}"></header>

    <main class="container mb-5">
        <div class="row g-4">
            <!-- Add Habit Form Card -->
            <div class="col-md-5">
                <section class="card slm-form-card">
                    <h2 class="text-primary"><i class="bi bi-plus-circle me-2"></i>Add Habit</h2>
                    <form th:action="@{/habits}" th:object="${habit}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Habit Name <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Morning Stretch, Read 20 pages" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <input type="text" th:field="*{description}" class="form-control" placeholder="Context or routine notes..." />
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="bi bi-save me-1"></i> Add Habit
                            </button>
                        </div>
                    </form>
                </section>
            </div>

            <!-- Existing Habits Table Card -->
            <div class="col-md-7">
                <section class="card slm-table-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h4 fw-bold mb-0 text-dark">
                            <i class="bi bi-check2-square me-2 text-primary"></i>Configured Habits
                            <span class="badge bg-primary-subtle text-primary ms-2 fs-6" th:text="${habits != null ? habits.size() : 0}">0</span>
                        </h2>
                        <a th:href="@{/last-done-habit-entries}" class="btn btn-outline-success btn-sm">
                            <i class="bi bi-calendar-check me-1"></i> Check Habits
                        </a>
                    </div>

                    <div class="table-responsive">
                        <table class="table slm-table align-middle">
                            <thead>
                                <tr>
                                    <th style="width: 80px;">ID</th>
                                    <th>Name</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${habits == null or habits.empty}">
                                    <td colspan="3" class="text-center py-4 text-muted">
                                        No habits configured yet. Create your first habit!
                                    </td>
                                </tr>
                                <tr th:each="e : ${habits}">
                                    <td class="text-muted small" th:text="${e.id}">1</td>
                                    <td>
                                        <strong th:text="${e.name}">Habit Name</strong>
                                    </td>
                                    <td class="text-muted" th:text="${e.description != null and !e.description.empty ? e.description : '-'}">Description</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

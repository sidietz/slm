<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Train Lines')}">
    <title>Train Lines</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Train Lines', 'Railway transit lines and network routes', 'bi bi-signpost-split', 'theme-transit', '/misc-management', 'Misc Dashboard')}"></header>

    <main class="container my-5">
        <!-- Quick Nav -->
        <div class="d-flex gap-2 mb-4">
            <a href="/train-trips" class="btn btn-outline-secondary btn-sm"><i class="bi bi-train-front me-1"></i> Trips</a>
            <a href="/train-stations" class="btn btn-outline-secondary btn-sm"><i class="bi bi-pin-map me-1"></i> Stations</a>
            <a href="/train-lines" class="btn btn-outline-primary btn-sm active"><i class="bi bi-signpost-split me-1"></i> Lines</a>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-lg-7">
                <div class="card slm-table-card shadow-sm h-100">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-signpost-2 me-2 text-primary"></i>Configured Rail Lines</h5>
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(lines)} + ' lines'">0 lines</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 140px;">Line Identifier</th>
                                    <th class="pe-3">Description / Route</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${lines}">
                                    <td class="ps-3">
                                        <span class="badge bg-primary-subtle text-primary fw-medium px-2 py-1" th:text="${e.name}"></span>
                                    </td>
                                    <td class="pe-3 text-dark" th:text="${e.description}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(lines)}">
                                    <td colspan="2" class="text-center py-4 text-muted">No train lines configured yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card slm-form-card shadow-sm">
                    <div class="card-header py-3 border-0">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-plus-circle me-2 text-primary"></i>Add Train Line</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/train-lines}" th:object="${trainline}" method="post">
                            <div class="mb-3">
                                <label for="name" class="form-label">Line Name / Code <span class="text-danger">*</span></label>
                                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="e.g. ICE 28, S-Bahn S1" required>
                            </div>
                            <div class="mb-4">
                                <label for="description" class="form-label">Description / Corridor</label>
                                <input type="text" id="description" th:field="*{description}" class="form-control" placeholder="e.g. Berlin - Leipzig - München">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-plus-circle me-1"></i> Add Train Line
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

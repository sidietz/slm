<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Gaming Sessions')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Gaming Sessions', 'Log and analyze video game playtime, platforms, and progression', 'bi bi-controller', 'theme-gaming', '/sessions?type=GAMING', 'Sessions Hub')}"></header>

    <main class="container mb-5">
        <!-- Add Gaming Session Form Card -->
        <section class="card card-custom p-4 mb-4">
            <h2 class="h4 fw-bold mb-3 text-warning"><i class="bi bi-plus-circle me-2"></i>Log Gaming Session</h2>
            <form th:action="@{/gaming-sessions}" th:object="${gamingsession}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Game <span class="text-danger">*</span></label>
                        <select th:field="*{game}" class="form-select" required>
                            <option value="">-- Select Game --</option>
                            <option th:each="game : ${games}" th:value="${game.id}" th:text="${game.title}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Device <span class="text-danger">*</span></label>
                        <select th:field="*{device}" class="form-select" required>
                            <option value="">-- Select Device --</option>
                            <option th:each="device : ${devices}" th:value="${device.id}" th:text="${device.name}"></option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Start Time <span class="text-danger">*</span></label>
                        <input type="datetime-local" th:field="*{start}" class="form-control" required />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">End Time <span class="text-danger">*</span></label>
                        <input type="datetime-local" th:field="*{end}" class="form-control" required />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Break (minutes)</label>
                        <input type="number" name="breakMinutes" class="form-control" min="0" value="0" />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Rating (1-5)</label>
                        <select th:field="*{focusRating}" class="form-select">
                            <option value="">-- No rating --</option>
                            <option value="5">⭐⭐⭐⭐⭐ (5 - Incredible)</option>
                            <option value="4">⭐⭐⭐⭐ (4 - Fun / Good)</option>
                            <option value="3">⭐⭐⭐ (3 - Average)</option>
                            <option value="2">⭐⭐ (2 - Frustrating)</option>
                            <option value="1">⭐ (1 - Regret / Bored)</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Outcome / Progression</label>
                        <input type="text" th:field="*{outcomeSummary}" class="form-control" placeholder="Defeated Chapter 3 boss, reached level 45" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Notes / Comment</label>
                        <input type="text" th:field="*{comment}" class="form-control" placeholder="Co-op with friends, patch notes notes..." />
                    </div>

                    <div class="col-12 text-end mt-3">
                        <button type="submit" class="btn btn-warning px-4 fw-semibold text-white">
                            <i class="bi bi-save me-1"></i> Save Gaming Session
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Sessions Table Card -->
        <section class="card card-custom p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 fw-bold mb-0 text-dark">
                    <i class="bi bi-controller me-2 text-warning"></i>Logged Gaming Sessions
                    <span class="badge bg-warning-subtle text-warning ms-2 fs-6" th:text="${gamingsessions != null ? gamingsessions.size() : 0}">0</span>
                </h2>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Game</th>
                            <th>Device</th>
                            <th>Start</th>
                            <th>End</th>
                            <th>Net Duration</th>
                            <th>Break</th>
                            <th>Rating</th>
                            <th>Outcome &amp; Notes</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${gamingsessions == null or gamingsessions.empty}">
                            <td colspan="9" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                No gaming sessions logged yet. Record your playthrough above!
                            </td>
                        </tr>
                        <tr th:each="s : ${gamingsessions}">
                            <td>
                                <strong th:text="${s.game != null ? s.game.title : 'Game'}">Game</strong>
                            </td>
                            <td>
                                <span class="badge bg-secondary-subtle text-secondary" th:text="${s.device != null ? s.device.name : 'Unknown'}">PC</span>
                            </td>
                            <td class="small" th:text="${#temporals.format(s.start, 'dd.MM.yyyy HH:mm')}">01.01.2026 20:00</td>
                            <td class="small" th:text="${#temporals.format(s.end, 'dd.MM.yyyy HH:mm')}">01.01.2026 22:00</td>
                            <td>
                                <span class="badge bg-warning text-dark" th:text="${s.netDuration != null ? s.netDuration : (s.duration != null ? s.duration : '-')}">2h 00m</span>
                            </td>
                            <td class="small text-muted" th:text="${s.breakDuration != null ? s.breakDuration : '0m'}">0m</td>
                            <td>
                                <span th:if="${s.focusRating != null and s.focusRating > 0}" class="star-rating">
                                    <span th:each="i : ${#numbers.sequence(1, s.focusRating)}">★</span>
                                </span>
                                <span th:if="${s.focusRating == null or s.focusRating == 0}" class="text-muted small">-</span>
                            </td>
                            <td class="small" style="max-width: 250px;">
                                <div th:if="${s.outcomeSummary != null and !s.outcomeSummary.empty}" class="fw-semibold text-truncate" th:text="${s.outcomeSummary}">Outcome</div>
                                <div th:if="${s.comment != null and !s.comment.empty}" class="text-muted text-truncate" th:text="${s.comment}">Comment</div>
                            </td>
                            <td class="text-end">
                                <form th:action="@{'/sessions/delete/' + ${s.id} + '?returnType=GAMING'}" method="post" class="d-inline"
                                      onsubmit="return confirm('Delete this gaming session?');">
                                    <button type="submit" class="btn btn-outline-danger btn-sm" title="Delete session">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

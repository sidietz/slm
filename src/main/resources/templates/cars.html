<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Cars</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"
	rel="stylesheet" />
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"
	defer></script>
</head>

<body class="container mt-5">
    <h1 class="mb-4">Cars</h1>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>VIN</th>
                    <th>Name</th>
                    <th>Model Name</th>
                    <th>Key Number</th>
                    <th>Manu-facturer</th>
                    <th>Vendor</th>
                    <th>Purchase Date</th>
                    <th>Approval Date</th>
                    <th>Manu-facturing Date</th>
                    <th>Buy Price</th>
                    <th>Sell Price</th>
                    <th>Buy Kilometers</th>
                    <th>Sell Kilometers</th>
                    <th>Price per 100km</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="e : ${cars}">
					<td th:text="${e.id}"></td>
					<td th:text="${e.vin}"></td>
					<td th:text="${e.name}"></td>
					<td th:text="${e.modelName}"></td>
					<td th:text="${e.keyNumber}"></td>
					<td th:text="${e.manufacturer.name}"></td>
					<td th:text="${e.vendor.name}"></td>
					<td th:text="${#temporals.format(e.purchaseDate, 'dd.MM.yyyy')}"></td>
					<td th:text="${#temporals.format(e.approvalDate, 'dd.MM.yyyy')}"></td>
					<td th:text="${#temporals.format(e.manufacturingDate, 'dd.MM.yyyy')}"></td>
					<td th:text="${e.purchasePrice}"></td>
					<td th:text="${e.sellPrice}"></td>
					<td th:text="${e.purchaseKilometers}"></td>
					<td th:text="${e.sellKilometers}"></td>
					<td th:text="${e.pricePer100km}"></td>
				</tr>
            </tbody>
        </table>
        <p th:text="${totalPrice}"></p>
    </div>

    <h2 class="mt-5">Add Car</h2>
    <form action="#" th:action="@{/cars}" th:object="${car}" class="mb-5" method="post">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="title" class="form-label">VIN:</label>
                <input type="text" th:field="*{vin}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="title" class="form-label">Name:</label>
                <input type="text" th:field="*{name}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="title" class="form-label">Model Name:</label>
                <input type="text" th:field="*{modelName}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="title" class="form-label">Key Number:</label>
                <input type="text" th:field="*{keyNumber}" class="form-control" required>
            </div>
            
            <div class="col-md-6 mb-3">
                <label for="activityType" class="form-label">Manufacturer:</label>
                <select class="form-select" name="selectOrigin"
				onchange="updateId(event)" th:field="*{manufacturer}">
					<option th:each="s : ${manufacturers}" th:value="${s.id}"
					th:text="${s.name}"></option>
				</select>
            </div>
            <div class="col-md-6 mb-3">
                <label for="activityType" class="form-label">Vendor:</label>
                <select class="form-select" name="selectOrigin"
				onchange="updateId(event)" th:field="*{vendor}">
					<option th:each="s : ${vendors}" th:value="${s.id}"
					th:text="${s.name}"></option>
				</select>
            </div>
            <div class="col-md-6 mb-3">
                <label for="date" class="form-label">Purchase Date:</label>
                <input type="date" th:field="*{purchaseDate}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="date" class="form-label">Approval Date:</label>
                <input type="date" th:field="*{approvalDate}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="date" class="form-label">Manufacturing Date:</label>
                <input type="date" th:field="*{manufacturingDate}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="price" class="form-label">Purchase Price:</label>
                <input type="number" step="0.01" th:field="*{purchasePrice}" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label for="price" class="form-label">Sell Price:</label>
                <input type="number" step="0.01" th:field="*{sellPrice}" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label for="price" class="form-label">Purchase Kilometers:</label>
                <input type="number" step="1" th:field="*{purchaseKilometers}" class="form-control">
            </div>
                <div class="col-md-6 mb-3">
                <label for="price" class="form-label">Sell Price:</label>
                <input type="number" step="1" th:field="*{sellKilometers}" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label for="price" class="form-label">Price per 100km:</label>
                <input type="number" step="0.01" th:field="*{pricePer100km}" class="form-control">
            </div>
            
        <button type="submit" class="btn btn-primary">Add Car</button>
    </form>
    <a href="/cars" class="btn btn-secondary">View Cars</a>
    <a href="/points" class="btn btn-secondary">View Points</a>
    <a href="/routes" class="btn btn-secondary">View Routes</a>
    <a href="/misc-management" class="btn btn-secondary">Back to Dashboard</a>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Cars')}">
    <title>Cars</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Vehicles', 'Fleet inventory, specifications, and lifecycle investment', 'bi bi-car-front', 'theme-cars', '/misc-management', 'Misc Dashboard')}"></header>

    <main class="container my-5">
        <!-- Quick Nav -->
        <div class="d-flex gap-2 mb-4 flex-wrap">
            <a href="/cars" class="btn btn-outline-primary btn-sm active"><i class="bi bi-car-front me-1"></i> Vehicles</a>
            <a href="/refuelings" class="btn btn-outline-secondary btn-sm"><i class="bi bi-fuel-pump me-1"></i> Refuelings</a>
            <a href="/stations" class="btn btn-outline-secondary btn-sm"><i class="bi bi-ev-station me-1"></i> Stations</a>
            <a href="/car-trips" class="btn btn-outline-secondary btn-sm"><i class="bi bi-sign-turn-right me-1"></i> Trips</a>
            <a href="/routes" class="btn btn-outline-secondary btn-sm"><i class="bi bi-map me-1"></i> Routes</a>
            <a href="/points" class="btn btn-outline-secondary btn-sm"><i class="bi bi-geo-alt me-1"></i> Points</a>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-12" th:if="${totalPrice != null}">
                <div class="card slm-card border-0 shadow-sm p-3 bg-white d-flex flex-row justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-3">
                        <div class="p-3 rounded-circle bg-primary-subtle text-primary">
                            <i class="bi bi-currency-euro fs-3"></i>
                        </div>
                        <div>
                            <span class="text-secondary text-uppercase fw-semibold small">Total Vehicle Value</span>
                            <h3 class="mb-0 fw-bold text-dark" th:text="${totalPrice}">0.00</h3>
                        </div>
                    </div>
                    <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill">
                        <i class="bi bi-speedometer2 me-1"></i> Fleet Valuation
                    </span>
                </div>
            </div>

            <div class="col-12">
                <div class="card slm-table-card shadow-sm">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-list-check me-2 text-primary"></i>Vehicle Fleet</h5>
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(cars)} + ' vehicles'">0 vehicles</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0 text-nowrap">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 60px;">ID</th>
                                    <th>VIN</th>
                                    <th>Name</th>
                                    <th>Model</th>
                                    <th>Key Number</th>
                                    <th>Manufacturer</th>
                                    <th>Vendor</th>
                                    <th>Purchase Date</th>
                                    <th>Approval Date</th>
                                    <th>Mfg Date</th>
                                    <th>Buy Price</th>
                                    <th>Sell Price</th>
                                    <th>Buy Km</th>
                                    <th>Sell Km</th>
                                    <th class="pe-3">€ / 100km</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${cars}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td><span class="code-pill" th:text="${e.vin}"></span></td>
                                    <td>
                                        <span class="fw-semibold text-dark" th:text="${e.name}"></span>
                                        <a th:href="@{/refuelings(carId=${e.id})}" class="btn btn-outline-primary btn-sm py-0 px-2 ms-1" title="View Refuelings">
                                            <i class="bi bi-fuel-pump"></i>
                                        </a>
                                    </td>
                                    <td th:text="${e.modelName}"></td>
                                    <td class="text-muted font-monospace small" th:text="${e.keyNumber}"></td>
                                    <td>
                                        <span class="badge bg-light text-dark border px-2 py-1" th:text="${e.manufacturer != null ? e.manufacturer.name : '—'}"></span>
                                    </td>
                                    <td>
                                        <span class="badge bg-light text-dark border px-2 py-1" th:text="${e.vendor != null ? e.vendor.name : '—'}"></span>
                                    </td>
                                    <td class="text-muted small" th:text="${#temporals.format(e.purchaseDate, 'dd.MM.yyyy')}"></td>
                                    <td class="text-muted small" th:text="${#temporals.format(e.approvalDate, 'dd.MM.yyyy')}"></td>
                                    <td class="text-muted small" th:text="${#temporals.format(e.manufacturingDate, 'dd.MM.yyyy')}"></td>
                                    <td class="fw-semibold text-dark" th:text="${e.purchasePrice}"></td>
                                    <td class="text-muted" th:text="${e.sellPrice}"></td>
                                    <td th:text="${e.purchaseKilometers}"></td>
                                    <td th:text="${e.sellKilometers}"></td>
                                    <td class="pe-3 fw-semibold text-primary" th:text="${e.pricePer100km}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(cars)}">
                                    <td colspan="15" class="text-center py-4 text-muted">No vehicles registered yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="card slm-form-card shadow-sm">
                    <div class="card-header py-3 border-0">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-plus-circle me-2 text-primary"></i>Add New Vehicle</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/cars}" th:object="${car}" method="post">
                            <div class="row g-3 mb-3">
                                <div class="col-md-3">
                                    <label for="vin" class="form-label">VIN <span class="text-danger">*</span></label>
                                    <input type="text" id="vin" th:field="*{vin}" class="form-control" placeholder="17-character VIN" required>
                                </div>
                                <div class="col-md-3">
                                    <label for="name" class="form-label">Vehicle Name <span class="text-danger">*</span></label>
                                    <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="e.g. Daily Commuter" required>
                                </div>
                                <div class="col-md-3">
                                    <label for="modelName" class="form-label">Model Name <span class="text-danger">*</span></label>
                                    <input type="text" id="modelName" th:field="*{modelName}" class="form-control" placeholder="e.g. Golf VIII, Model 3" required>
                                </div>
                                <div class="col-md-3">
                                    <label for="keyNumber" class="form-label">Key Number (HSN/TSN) <span class="text-danger">*</span></label>
                                    <input type="text" id="keyNumber" th:field="*{keyNumber}" class="form-control" placeholder="e.g. 0603/BVP" required>
                                </div>

                                <div class="col-md-3">
                                    <label for="manufacturer" class="form-label">Manufacturer</label>
                                    <select id="manufacturer" class="form-select" th:field="*{manufacturer}">
                                        <option th:each="s : ${manufacturers}" th:value="${s.id}" th:text="${s.name}"></option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label for="vendor" class="form-label">Vendor</label>
                                    <select id="vendor" class="form-select" th:field="*{vendor}">
                                        <option th:each="s : ${vendors}" th:value="${s.id}" th:text="${s.name}"></option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <label for="purchaseDate" class="form-label">Purchase Date <span class="text-danger">*</span></label>
                                    <input type="date" id="purchaseDate" th:field="*{purchaseDate}" class="form-control" required>
                                </div>
                                <div class="col-md-2">
                                    <label for="approvalDate" class="form-label">Approval Date <span class="text-danger">*</span></label>
                                    <input type="date" id="approvalDate" th:field="*{approvalDate}" class="form-control" required>
                                </div>
                                <div class="col-md-2">
                                    <label for="manufacturingDate" class="form-label">Mfg Date <span class="text-danger">*</span></label>
                                    <input type="date" id="manufacturingDate" th:field="*{manufacturingDate}" class="form-control" required>
                                </div>

                                <div class="col-md-2">
                                    <label for="purchasePrice" class="form-label">Purchase Price (€)</label>
                                    <input type="number" id="purchasePrice" step="0.01" th:field="*{purchasePrice}" class="form-control" placeholder="0.00">
                                </div>
                                <div class="col-md-2">
                                    <label for="sellPrice" class="form-label">Sell Price (€)</label>
                                    <input type="number" id="sellPrice" step="0.01" th:field="*{sellPrice}" class="form-control" placeholder="0.00">
                                </div>
                                <div class="col-md-2">
                                    <label for="purchaseKilometers" class="form-label">Purchase Km</label>
                                    <input type="number" id="purchaseKilometers" step="1" th:field="*{purchaseKilometers}" class="form-control" placeholder="0">
                                </div>
                                <div class="col-md-2">
                                    <label for="sellKilometers" class="form-label">Sell Km</label>
                                    <input type="number" id="sellKilometers" step="1" th:field="*{sellKilometers}" class="form-control" placeholder="0">
                                </div>
                                <div class="col-md-4">
                                    <label for="pricePer100km" class="form-label">Price per 100km (€)</label>
                                    <input type="number" id="pricePer100km" step="0.01" th:field="*{pricePer100km}" class="form-control" placeholder="0.00">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary px-4 py-2">
                                <i class="bi bi-plus-circle me-1"></i> Register Vehicle
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

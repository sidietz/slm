<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Vendors Directory')}"></head>

<body class="bg-light">
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Vendors Directory', 'Manage shops, suppliers, online retailers, and service providers', 'bi bi-shop', 'theme-work', '/spend-management', 'Spend Dashboard')}"></header>

    <main class="container mb-5">
        <div class="row g-4">
            <!-- Full-Width Vendors Table Card -->
            <div class="col-12">
                <section class="card slm-table-card shadow-sm">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div class="d-flex align-items-center gap-2">
                            <h2 class="h5 fw-semibold mb-0 text-dark">
                                <i class="bi bi-shop me-2 text-warning"></i>Configured Vendors
                            </h2>
                            <span class="badge bg-warning-subtle text-warning rounded-pill px-3 py-1" th:text="${vendors != null ? vendors.size() : 0} + ' vendors'">0 vendors</span>
                        </div>
                        <button type="button" class="btn btn-warning text-white fw-semibold" onclick="openCreateVendorModal()">
                            <i class="bi bi-plus-circle me-1"></i> Add Vendor
                        </button>
                    </div>

                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 80px;">ID</th>
                                    <th>Vendor Name</th>
                                    <th class="text-end pe-3" style="width: 100px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${vendors == null or vendors.empty}">
                                    <td colspan="3" class="text-center py-4 text-muted">
                                        No vendors defined yet. Click "Add Vendor" above to add your first vendor.
                                    </td>
                                </tr>
                                <tr th:each="e : ${vendors}">
                                    <td class="ps-3 text-muted small" th:text="${e.id}">1</td>
                                    <td>
                                        <i class="bi bi-shop me-2 text-muted"></i>
                                        <strong th:text="${e.name}">Vendor</strong>
                                    </td>
                                    <td class="text-end pe-3">
                                        <button type="button" 
                                                class="btn btn-sm btn-outline-warning" 
                                                title="Edit Vendor"
                                                th:data-id="${e.id}"
                                                th:data-name="${e.name}"
                                                onclick="populateEditVendorModal(this)">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Dual-Purpose Modal for Adding and Editing Vendors -->
    <div class="modal fade" id="vendorModal" tabindex="-1" aria-labelledby="vendorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-white py-3 border-bottom">
                    <h5 class="modal-title fw-bold text-dark" id="vendorModalLabel">
                        <i class="bi bi-plus-circle me-2 text-warning"></i>Add Vendor
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="vendorForm" th:action="@{/vendors}" method="post">
                    <input type="hidden" id="modalVendorId" name="id" value="">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label for="modalVendorName" class="form-label fw-semibold">Vendor Name <span class="text-danger">*</span></label>
                            <input type="text" id="modalVendorName" name="name" class="form-control" placeholder="e.g. Amazon, Apple Store, Digitec" required />
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-top py-3">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="modalVendorSubmitBtn" class="btn btn-warning text-white fw-semibold px-4">
                            <i class="bi bi-plus-circle me-1"></i> Save Vendor
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
        function openCreateVendorModal() {
            document.getElementById('vendorForm').reset();
            document.getElementById('modalVendorId').value = '';
            document.getElementById('vendorModalLabel').innerHTML = '<i class="bi bi-plus-circle me-2 text-warning"></i>Add Vendor';
            document.getElementById('modalVendorSubmitBtn').innerHTML = '<i class="bi bi-plus-circle me-1"></i> Save Vendor';
            document.getElementById('modalVendorSubmitBtn').className = 'btn btn-warning text-white fw-semibold px-4';

            const modal = new bootstrap.Modal(document.getElementById('vendorModal'));
            modal.show();
        }

        function populateEditVendorModal(btn) {
            const ds = btn.dataset;
            document.getElementById('modalVendorId').value = ds.id || '';
            document.getElementById('modalVendorName').value = ds.name || '';

            document.getElementById('vendorModalLabel').innerHTML = `<i class="bi bi-pencil-square me-2 text-warning"></i>Edit Vendor #${ds.id}`;
            document.getElementById('modalVendorSubmitBtn').innerHTML = '<i class="bi bi-check2-circle me-1"></i> Update Vendor';
            document.getElementById('modalVendorSubmitBtn').className = 'btn btn-warning text-white fw-semibold px-4';

            const modal = new bootstrap.Modal(document.getElementById('vendorModal'));
            modal.show();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Vendors Directory')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Vendors Directory', 'Manage shops, suppliers, online retailers, and service providers', 'bi bi-shop', 'theme-work', '/spend-management', 'Spend Dashboard')}"></header>

    <main class="container mb-5">
        <div class="row g-4">
            <!-- Add Vendor Card -->
            <div class="col-md-5">
                <section class="card slm-form-card">
                    <h2 class="text-warning"><i class="bi bi-plus-circle me-2"></i>Add Vendor</h2>
                    <form th:action="@{/vendors}" th:object="${vendor}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Vendor Name <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Amazon, Apple Store, Digitec" required />
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-warning text-white px-4 fw-semibold">
                                <i class="bi bi-save me-1"></i> Add Vendor
                            </button>
                        </div>
                    </form>
                </section>
            </div>

            <!-- Existing Vendors Table Card -->
            <div class="col-md-7">
                <section class="card slm-table-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h4 fw-bold mb-0 text-dark">
                            <i class="bi bi-shop me-2 text-warning"></i>Configured Vendors
                            <span class="badge bg-warning-subtle text-warning ms-2 fs-6" th:text="${vendors != null ? vendors.size() : 0}">0</span>
                        </h2>
                    </div>

                    <div class="table-responsive">
                        <table class="table slm-table align-middle">
                            <thead>
                                <tr>
                                    <th style="width: 80px;">ID</th>
                                    <th>Vendor Name</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${vendors == null or vendors.empty}">
                                    <td colspan="2" class="text-center py-4 text-muted">
                                        No vendors defined yet.
                                    </td>
                                </tr>
                                <tr th:each="e : ${vendors}">
                                    <td class="text-muted small" th:text="${e.id}">1</td>
                                    <td>
                                        <strong th:text="${e.name}">Vendor</strong>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

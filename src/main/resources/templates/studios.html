<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Game Studios')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Game Development Studios', 'Manage game developer studios and creators', 'bi bi-joystick', 'theme-gaming', '/games', 'Games Library')}"></header>

    <main class="container mb-5">
        <div class="row g-4">
            <!-- Add Studio Card -->
            <div class="col-md-5">
                <section class="card slm-form-card">
                    <h2 class="text-warning"><i class="bi bi-plus-circle me-2"></i>Add Studio</h2>
                    <form th:action="@{/studios}" th:object="${studio}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Studio Name <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. FromSoftware, Valve, CD Projekt Red" required />
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-warning text-white px-4 fw-semibold">
                                <i class="bi bi-save me-1"></i> Add Studio
                            </button>
                        </div>
                    </form>
                </section>
            </div>

            <!-- Existing Studios Table Card -->
            <div class="col-md-7">
                <section class="card slm-table-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h4 fw-bold mb-0 text-dark">
                            <i class="bi bi-joystick me-2 text-warning"></i>Configured Studios
                            <span class="badge bg-warning-subtle text-warning ms-2 fs-6" th:text="${studios != null ? studios.size() : 0}">0</span>
                        </h2>
                    </div>

                    <div class="table-responsive">
                        <table class="table slm-table align-middle">
                            <thead>
                                <tr>
                                    <th style="width: 80px;">ID</th>
                                    <th>Studio Name</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${studios == null or studios.empty}">
                                    <td colspan="2" class="text-center py-4 text-muted">
                                        No studios defined yet.
                                    </td>
                                </tr>
                                <tr th:each="e : ${studios}">
                                    <td class="text-muted small" th:text="${e.id}">1</td>
                                    <td>
                                        <strong th:text="${e.name}">Studio</strong>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

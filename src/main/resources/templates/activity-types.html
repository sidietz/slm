<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Activity Types')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Activity Types', 'Configure categories and classifications for general activities', 'bi bi-tags', 'theme-activity', '/activities', 'Activities')}"></header>

    <main class="container mb-5">
        <div class="row g-4">
            <!-- Add Category Card -->
            <div class="col-md-5">
                <section class="card slm-form-card">
                    <h2 class="text-danger"><i class="bi bi-plus-circle me-2"></i>Add Category</h2>
                    <form th:action="@{/activity-types}" th:object="${type}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Category Name <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Household, DIY, Project" required />
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-danger px-4 fw-semibold">
                                <i class="bi bi-save me-1"></i> Add Category
                            </button>
                        </div>
                    </form>
                </section>
            </div>

            <!-- Existing Categories Table Card -->
            <div class="col-md-7">
                <section class="card slm-table-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h4 fw-bold mb-0 text-dark">
                            <i class="bi bi-tags me-2 text-danger"></i>Existing Categories
                            <span class="badge bg-danger-subtle text-danger ms-2 fs-6" th:text="${activityTypes != null ? activityTypes.size() : 0}">0</span>
                        </h2>
                    </div>

                    <div class="table-responsive">
                        <table class="table slm-table align-middle">
                            <thead>
                                <tr>
                                    <th style="width: 100px;">ID</th>
                                    <th>Category Name</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${activityTypes == null or activityTypes.empty}">
                                    <td colspan="2" class="text-center py-4 text-muted">
                                        No activity types defined yet.
                                    </td>
                                </tr>
                                <tr th:each="cat : ${activityTypes}">
                                    <td class="text-muted small" th:text="${cat.id}">1</td>
                                    <td>
                                        <strong th:text="${cat.name}">Category</strong>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

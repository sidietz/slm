<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Activity Types')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Activity Types', 'Configure categories and classifications for general activities', 'bi bi-tags', 'theme-activity', '/activities', 'Activities')}"></header>

    <main class="container mb-5">
        <!-- Existing Categories Table Card -->
        <section class="card slm-table-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 fw-bold mb-0 text-dark">
                    <i class="bi bi-tags me-2 text-danger"></i>Existing Categories
                    <span class="badge bg-danger-subtle text-danger ms-2 fs-6" th:text="${activityTypes != null ? activityTypes.size() : 0}">0</span>
                </h2>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-danger btn-sm fw-semibold" data-bs-toggle="modal" data-bs-target="#activityTypeModal">
                        <i class="bi bi-plus-circle me-1"></i> Add Category
                    </button>
                    <a th:href="@{/activities}" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-card-checklist me-1"></i> Activities
                    </a>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table slm-table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 100px;">ID</th>
                            <th>Category Name</th>
                            <th class="text-end" style="width: 100px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${activityTypes == null or activityTypes.empty}">
                            <td colspan="3" class="text-center py-4 text-muted">
                                No activity types defined yet.
                            </td>
                        </tr>
                        <tr th:each="cat : ${activityTypes}">
                            <td class="text-muted small" th:text="${cat.id}">1</td>
                            <td>
                                <strong th:text="${cat.name}">Category</strong>
                            </td>
                            <td class="text-end">
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                        data-bs-toggle="modal"
                                        data-bs-target="#activityTypeModal"
                                        th:data-id="${cat.id}"
                                        th:data-name="${cat.name}">
                                    <i class="bi bi-pencil me-1"></i>Edit
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Activity Type Modal (Add / Edit) -->
        <div class="modal fade" id="activityTypeModal" tabindex="-1" aria-labelledby="activityTypeModalTitle" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form th:action="@{/activity-types}" th:object="${type}" method="post" id="activityTypeForm">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold" id="activityTypeModalTitle">
                                <i class="bi bi-plus-circle me-2 text-danger"></i>Add Category
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" th:field="*{id}" id="activityTypeId" />
                            <div class="mb-3">
                                <label class="form-label">Category Name <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{name}" id="activityTypeName" class="form-control" placeholder="e.g. Household, DIY, Project" required />
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-danger px-4 fw-semibold" id="activityTypeSubmitBtn">
                                <i class="bi bi-save me-1"></i> Add Category
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const activityTypeModal = document.getElementById('activityTypeModal');
            if (activityTypeModal) {
                activityTypeModal.addEventListener('show.bs.modal', function (event) {
                    const button = event.relatedTarget;
                    const id = button ? button.getAttribute('data-id') : null;
                    const modalTitle = document.getElementById('activityTypeModalTitle');
                    const submitBtn = document.getElementById('activityTypeSubmitBtn');

                    if (id) {
                        modalTitle.innerHTML = '<i class="bi bi-pencil me-2 text-danger"></i>Edit Category';
                        submitBtn.innerHTML = '<i class="bi bi-save me-1"></i> Update Category';
                        document.getElementById('activityTypeId').value = id;
                        document.getElementById('activityTypeName').value = button.getAttribute('data-name') || '';
                    } else {
                        modalTitle.innerHTML = '<i class="bi bi-plus-circle me-2 text-danger"></i>Add Category';
                        submitBtn.innerHTML = '<i class="bi bi-save me-1"></i> Add Category';
                        document.getElementById('activityTypeForm').reset();
                        document.getElementById('activityTypeId').value = '';
                    }
                });

                activityTypeModal.addEventListener('hidden.bs.modal', function () {
                    document.getElementById('activityTypeForm').reset();
                    document.getElementById('activityTypeId').value = '';
                });
            }
        });
    </script>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

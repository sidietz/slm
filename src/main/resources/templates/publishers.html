<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: standard-head('Publishers Directory')}"></head>

<body>
    <!-- Header Hero Banner -->
    <header th:replace="~{fragments/layout :: header('Publishers Directory', 'Manage book and game publishers and distributors', 'bi bi-buildings', 'theme-books', '/book-management', 'Dashboard')}"></header>

    <main class="container mb-5">
        <!-- Existing Publishers Table Card -->
        <section class="card slm-table-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 fw-bold mb-0 text-dark">
                    <i class="bi bi-buildings me-2 text-info"></i>Configured Publishers
                    <span class="badge bg-info-subtle text-info ms-2 fs-6" th:text="${publishers != null ? publishers.size() : 0}">0</span>
                </h2>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-info text-white btn-sm fw-semibold" data-bs-toggle="modal" data-bs-target="#publisherModal">
                        <i class="bi bi-plus-circle me-1"></i> Add Publisher
                    </button>
                    <a th:href="@{/games}" class="btn btn-outline-info btn-sm">
                        <i class="bi bi-controller me-1"></i> Games Library
                    </a>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table slm-table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Publisher Name</th>
                            <th>Headquarters</th>
                            <th>Founding Date</th>
                            <th class="text-end" style="width: 100px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${publishers == null or publishers.empty}">
                            <td colspan="5" class="text-center py-4 text-muted">
                                No publishers defined yet.
                            </td>
                        </tr>
                        <tr th:each="e : ${publishers}">
                            <td class="text-muted small" th:text="${e.id}">1</td>
                            <td>
                                <strong th:text="${e.name}">Publisher</strong>
                            </td>
                            <td th:text="${e.hq != null and !e.hq.empty ? e.hq : '-'}">Headquarters</td>
                            <td class="small text-muted" th:text="${e.foundingDate != null ? #temporals.format(e.foundingDate, 'dd.MM.yyyy') : '-'}">01.01.1990</td>
                            <td class="text-end">
                                <button type="button" class="btn btn-sm btn-outline-info"
                                        data-bs-toggle="modal"
                                        data-bs-target="#publisherModal"
                                        th:data-id="${e.id}"
                                        th:data-name="${e.name}"
                                        th:data-hq="${e.hq}"
                                        th:data-founding-date="${e.foundingDate}">
                                    <i class="bi bi-pencil me-1"></i>Edit
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Publisher Modal (Add / Edit) -->
        <div class="modal fade" id="publisherModal" tabindex="-1" aria-labelledby="publisherModalTitle" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form th:action="@{/publishers}" th:object="${publisher}" method="post" id="publisherForm">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold" id="publisherModalTitle">
                                <i class="bi bi-plus-circle me-2 text-info"></i>Add Publisher
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" th:field="*{id}" id="publisherId" />
                            <div class="mb-3">
                                <label class="form-label">Publisher Name <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{name}" id="publisherName" class="form-control" placeholder="e.g. O'Reilly, MIT Press, Electronic Arts" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Headquarters</label>
                                <input type="text" th:field="*{hq}" id="publisherHq" class="form-control" placeholder="e.g. Redwood City, CA, USA" />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Founding Date</label>
                                <input type="date" th:field="*{foundingDate}" id="publisherFoundingDate" class="form-control" />
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-info text-white fw-semibold" id="publisherSubmitBtn">
                                <i class="bi bi-save me-1"></i> Add Publisher
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const publisherModal = document.getElementById('publisherModal');
            if (publisherModal) {
                publisherModal.addEventListener('show.bs.modal', function (event) {
                    const button = event.relatedTarget;
                    const id = button ? button.getAttribute('data-id') : null;
                    const modalTitle = document.getElementById('publisherModalTitle');
                    const submitBtn = document.getElementById('publisherSubmitBtn');

                    if (id) {
                        modalTitle.innerHTML = '<i class="bi bi-pencil me-2 text-info"></i>Edit Publisher';
                        submitBtn.innerHTML = '<i class="bi bi-save me-1"></i> Update Publisher';
                        document.getElementById('publisherId').value = id;
                        document.getElementById('publisherName').value = button.getAttribute('data-name') || '';
                        document.getElementById('publisherHq').value = button.getAttribute('data-hq') || '';
                        document.getElementById('publisherFoundingDate').value = button.getAttribute('data-founding-date') || '';
                    } else {
                        modalTitle.innerHTML = '<i class="bi bi-plus-circle me-2 text-info"></i>Add Publisher';
                        submitBtn.innerHTML = '<i class="bi bi-save me-1"></i> Add Publisher';
                        document.getElementById('publisherForm').reset();
                        document.getElementById('publisherId').value = '';
                    }
                });

                publisherModal.addEventListener('hidden.bs.modal', function () {
                    document.getElementById('publisherForm').reset();
                    document.getElementById('publisherId').value = '';
                });
            }
        });
    </script>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${note.id != null ? 'Edit Lecture Note' : 'New Lecture Note'} + ' | SLM'">Lecture Note | SLM</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/slm.css}" rel="stylesheet" />
    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --slm-academic-gradient: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
        }
        body {
            background-color: #f1f5f9;
            color: #1e293b;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .header-note {
            background: var(--slm-academic-gradient);
            color: white;
            padding: 1.5rem 0;
            margin-bottom: 1.5rem;
            border-radius: 0 0 1rem 1rem;
        }
        .editor-container {
            min-height: 550px;
        }
        .markdown-editor {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: vertical;
            min-height: 480px;
        }
        .markdown-preview {
            min-height: 480px;
            max-height: 750px;
            overflow-y: auto;
            background: white;
            padding: 1.5rem;
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
        }
        .markdown-preview h1, .markdown-preview h2, .markdown-preview h3 {
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.3rem;
            margin-top: 1rem;
        }
        .markdown-preview code {
            background-color: #f1f5f9;
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            color: #0369a1;
        }
        .markdown-preview pre {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
        }
        .markdown-preview blockquote {
            border-left: 4px solid #0284c7;
            padding-left: 1rem;
            color: #64748b;
        }
        .markdown-preview table {
            width: 100%;
            margin-bottom: 1rem;
            border-collapse: collapse;
        }
        .markdown-preview table th, .markdown-preview table td {
            border: 1px solid #cbd5e1;
            padding: 0.5rem;
        }
        .markdown-preview table th {
            background-color: #f8fafc;
        }
    </style>
</head>
<body>
    <header class="header-note">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h1 class="h4 fw-bold mb-0">
                        <i class="bi bi-file-earmark-richtext-fill me-2"></i>
                        <span th:text="${note.id != null ? 'Edit Lecture Note' : 'New Lecture Note'}">Lecture Note</span>
                    </h1>
                    <span class="text-white-50 small" th:text="${course.title}">Course Name</span>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{'/courses/' + ${course.id}}" class="btn btn-sm btn-outline-light">
                        <i class="bi bi-arrow-left me-1"></i> Back to Course
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="container-fluid px-4 mb-5">
        <form th:action="@{/notes}" th:object="${note}" method="post">
            <input type="hidden" th:field="*{id}" th:if="${note.id != null}">
            <input type="hidden" name="course.id" th:value="${course.id}">

            <!-- Metadata Top Bar -->
            <div class="card border-0 shadow-sm p-3 bg-white mb-3">
                <div class="row g-3">
                    <div class="col-md-5">
                        <label class="form-label fw-semibold small text-uppercase text-muted">Lecture Topic / Title</label>
                        <input type="text" th:field="*{title}" class="form-control fw-bold" placeholder="e.g. Lecture 04: B+ Trees &amp; Query Optimization" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-semibold small text-uppercase text-muted">Lecture #</label>
                        <input type="number" th:field="*{lectureNumber}" class="form-control" min="1">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-semibold small text-uppercase text-muted">Lecture Date</label>
                        <input type="date" th:field="*{lectureDate}" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold small text-uppercase text-muted">Linked Lecture Session</label>
                        <select name="sessionId" class="form-select">
                            <option value="">-- No Session Link --</option>
                            <option th:each="s : ${sessions}" th:value="${s.id}" th:text="${'Lecture #' + s.lectureNumber + ': ' + (s.topic != null ? s.topic : 'General') + ' (' + #temporals.format(s.start, 'dd.MM') + ')'}" th:selected="${note.lectureSession != null and note.lectureSession.id == s.id}"></option>
                        </select>
                    </div>

                    <!-- Key Concepts & Summary -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small text-uppercase text-muted">Key Concepts (tags/keywords)</label>
                        <input type="text" th:field="*{keyConcepts}" class="form-control" placeholder="e.g. Indexing, B-Trees, Cost Model, Range Queries">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold small text-uppercase text-muted">Executive Summary / Takeaway</label>
                        <input type="text" th:field="*{summary}" class="form-control" placeholder="2-3 sentence core takeaway of this lecture">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-semibold small text-uppercase text-muted">Exam Relevance</label>
                        <select th:field="*{examRelevanceRating}" class="form-select">
                            <option value="5">★★★★★ (5 - Critical)</option>
                            <option value="4">★★★★☆ (4 - Important)</option>
                            <option value="3" selected>★★★☆☆ (3 - Standard)</option>
                            <option value="2">★★☆☆☆ (2 - Minor)</option>
                            <option value="1">★☆☆☆☆ (1 - Background)</option>
                        </select>
                    </div>

                    <!-- Homework & Action Items -->
                    <div class="col-md-12">
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" th:field="*{hasHomework}" id="hasHomeworkCheck">
                            <label class="form-check-label fw-semibold" for="hasHomeworkCheck">
                                <i class="bi bi-list-check me-1"></i> Contains Homework or Action Items
                            </label>
                        </div>
                        <input type="text" th:field="*{homeworkTodo}" class="form-control form-control-sm" placeholder="Action items, exercises to complete, problem set numbers...">
                    </div>
                </div>
            </div>

            <!-- Two-Pane Markdown Editor -->
            <div class="row g-3 editor-container">
                <!-- Left Pane: Raw Markdown Input -->
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm h-100 bg-white">
                        <div class="card-header bg-white border-bottom py-2 d-flex justify-content-between align-items-center">
                            <span class="fw-semibold small text-muted text-uppercase"><i class="bi bi-pencil-square me-1"></i> Markdown Editor</span>
                            <div class="btn-group btn-group-sm">
                                <button type="button" class="btn btn-outline-secondary" onclick="insertSnippet('# ')" title="Heading 1">H1</button>
                                <button type="button" class="btn btn-outline-secondary" onclick="insertSnippet('## ')" title="Heading 2">H2</button>
                                <button type="button" class="btn btn-outline-secondary" onclick="insertSnippet('**bold**')" title="Bold"><strong>B</strong></button>
                                <button type="button" class="btn btn-outline-secondary" onclick="insertSnippet('*italic*')" title="Italic"><em>I</em></button>
                                <button type="button" class="btn btn-outline-secondary" onclick="insertSnippet('- ')" title="List">• List</button>
                                <button type="button" class="btn btn-outline-secondary" onclick="insertSnippet('```\ncode\n```')" title="Code">Code</button>
                                <button type="button" class="btn btn-outline-secondary" onclick="insertSnippet('> ')" title="Quote">Quote</button>
                            </div>
                        </div>
                        <div class="card-body p-2 d-flex flex-column">
                            <textarea id="markdownInput" th:field="*{contentMarkdown}" class="form-control markdown-editor flex-grow-1" placeholder="# Lecture Notes&#10;&#10;## 1. Introduction&#10;- Core definitions...&#10;- Formulas..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Right Pane: Real-time Rendered Preview -->
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm h-100 bg-white">
                        <div class="card-header bg-white border-bottom py-2 d-flex justify-content-between align-items-center">
                            <span class="fw-semibold small text-muted text-uppercase"><i class="bi bi-eye-fill me-1"></i> Instant Live Preview</span>
                            <span class="badge bg-light text-muted">HTML Rendered</span>
                        </div>
                        <div class="card-body p-2">
                            <div id="markdownPreview" class="markdown-preview"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Action Bar -->
            <div class="d-flex justify-content-between align-items-center mt-3 bg-white p-3 rounded shadow-sm">
                <div>
                    <a th:href="@{'/courses/' + ${course.id}}" class="btn btn-outline-secondary">Cancel</a>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary fw-bold px-4">
                        <i class="bi bi-check2-circle me-1"></i> Save Lecture Note
                    </button>
                </div>
            </div>
        </form>
    </main>

    <script>
        const inputEl = document.getElementById('markdownInput');
        const previewEl = document.getElementById('markdownPreview');

        function updatePreview() {
            if (typeof marked !== 'undefined') {
                previewEl.innerHTML = marked.parse(inputEl.value || '*No content yet. Start typing your lecture notes on the left...*');
            } else {
                previewEl.innerText = inputEl.value;
            }
        }

        function insertSnippet(snippet) {
            const startPos = inputEl.selectionStart;
            const endPos = inputEl.selectionEnd;
            inputEl.value = inputEl.value.substring(0, startPos) + snippet + inputEl.value.substring(endPos);
            inputEl.focus();
            inputEl.selectionStart = startPos + snippet.length;
            inputEl.selectionEnd = startPos + snippet.length;
            updatePreview();
        }

        inputEl.addEventListener('input', updatePreview);
        // Initial render
        updatePreview();
    </script>
</body>
</html>

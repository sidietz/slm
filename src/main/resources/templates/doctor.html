<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Doctors Overview')}">
    <title>Doctors Overview</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Doctors Overview', 'Registered physician and clinic directory', 'bi bi-person-badge', 'theme-medical', '/doctors', 'Doctor Management')}"></header>

    <main class="container my-5">
        <div class="card slm-table-card shadow-sm">
            <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-hospital me-2 text-primary"></i>All Doctors</h5>
                <a href="/doctors" class="btn btn-sm btn-primary"><i class="bi bi-plus-circle me-1"></i> Manage Doctors</a>
            </div>
            <div class="table-responsive">
                <table class="table slm-table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="ps-3" style="width: 60px;">ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Speciality</th>
                            <th>Place</th>
                            <th>PLZ</th>
                            <th>City</th>
                            <th class="pe-3">Air Distance</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${doctors}">
                            <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                            <td th:text="${e.firstname}"></td>
                            <td class="fw-semibold text-dark" th:text="${e.lastname}"></td>
                            <td>
                                <span class="badge bg-light text-dark border px-2 py-1" th:text="${e.speciality != null ? e.speciality.title : '—'}"></span>
                            </td>
                            <td class="text-muted small" th:text="${e.place}"></td>
                            <td class="font-monospace small" th:text="${e.plz}"></td>
                            <td th:text="${e.city}"></td>
                            <td class="pe-3 fw-semibold text-primary" th:text="${e.airDistance != null ? e.airDistance + ' km' : '—'}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(doctors)}">
                            <td colspan="8" class="text-center py-4 text-muted">No doctors found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

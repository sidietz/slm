<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: standard-head('Contracts')}">
    <title>Contracts</title>
</head>
<body class="bg-light">

    <header th:replace="~{fragments/layout :: header('Contracts', 'Track service contracts, subscriptions, and contractor agreements', 'bi bi-file-earmark-text', 'theme-finance', '/spend-management', 'Spend Dashboard')}"></header>

    <main class="container my-5">
        <div class="row g-4 mb-5">
            <div class="col-lg-8">
                <div class="card slm-table-card shadow-sm h-100">
                    <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-file-earmark-ruled me-2 text-primary"></i>Active & Past Contracts</h5>
                            <span class="text-muted small" th:if="${totalFee != null}" th:text="'Total active monthly commitments: €' + ${#numbers.formatDecimal(totalFee, 1, 2)}"></span>
                        </div>
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(contracts)} + ' contracts'">0 contracts</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table slm-table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 60px;">ID</th>
                                    <th>Title</th>
                                    <th>Contractor</th>
                                    <th>Fee</th>
                                    <th>Start Date</th>
                                    <th>Initial End Date</th>
                                    <th>Remaining</th>
                                    <th class="pe-3">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${contracts}">
                                    <td class="ps-3 text-secondary font-monospace small" th:text="${e.id}"></td>
                                    <td class="fw-semibold text-dark" th:text="${e.title}"></td>
                                    <td>
                                        <span class="badge bg-light text-dark border px-2 py-1" th:text="${e.contractor != null ? e.contractor.name : '—'}"></span>
                                    </td>
                                    <td class="fw-semibold text-success" th:text="${#numbers.formatDecimal(e.fee, 1, 2)} + ' €'"></td>
                                    <td class="text-muted small" th:text="${#temporals.format(e.startDate, 'dd.MM.yyyy')}"></td>
                                    <td class="text-muted small" th:text="${e.initialEndDate != null ? #temporals.format(e.initialEndDate, 'dd.MM.yyyy') : '—'}"></td>
                                    <td>
                                        <!-- Auto-extended active contracts: no negative days! -->
                                        <span th:if="${e.calculatedStatus.name() == 'ACTIVE_AUTO_EXTENDED'}"
                                              class="badge bg-primary-subtle text-primary rounded-pill px-2 py-1">
                                            <i class="bi bi-arrow-repeat me-1"></i>Auto-Extended
                                        </span>
                                        <!-- Active in initial term -->
                                        <span th:if="${e.calculatedStatus.name() == 'ACTIVE_INITIAL_TERM'}"
                                              class="badge rounded-pill px-2 py-1"
                                              th:classappend="${e.daysRemaining != null and e.daysRemaining <= 30 ? 'bg-warning-subtle text-warning' : 'bg-secondary-subtle text-secondary'}"
                                              th:text="${e.daysRemaining != null ? e.daysRemaining + ' d' : '—'}">
                                        </span>
                                        <!-- Canceled, pending termination -->
                                        <span th:if="${e.calculatedStatus.name() == 'CANCELED_PENDING'}"
                                              class="badge bg-danger-subtle text-danger rounded-pill px-2 py-1"
                                              th:text="${e.daysRemaining != null ? e.daysRemaining + ' d left' : '—'}">
                                        </span>
                                        <!-- Terminated / Inactive -->
                                        <span th:if="${e.calculatedStatus.name() == 'TERMINATED'}"
                                              class="badge bg-secondary-subtle text-secondary rounded-pill px-2 py-1">—</span>
                                    </td>
                                    <td class="pe-3">
                                        <span th:if="${e.calculatedStatus.name() == 'ACTIVE_INITIAL_TERM'}"
                                              class="badge bg-success-subtle text-success rounded-pill px-2 py-1">
                                            <i class="bi bi-check-circle me-1"></i> Active
                                        </span>
                                        <span th:if="${e.calculatedStatus.name() == 'ACTIVE_AUTO_EXTENDED'}"
                                              class="badge bg-info-subtle text-info rounded-pill px-2 py-1">
                                            <i class="bi bi-arrow-repeat me-1"></i> Rolling
                                        </span>
                                        <span th:if="${e.calculatedStatus.name() == 'CANCELED_PENDING'}"
                                              class="badge bg-warning-subtle text-warning rounded-pill px-2 py-1"
                                              th:title="${e.terminationDate != null ? 'Terminates: ' + #temporals.format(e.terminationDate, 'dd.MM.yyyy') : 'Cancellation pending'}">
                                            <i class="bi bi-exclamation-triangle me-1"></i> Canceled
                                        </span>
                                        <span th:if="${e.calculatedStatus.name() == 'TERMINATED'}"
                                              class="badge bg-secondary-subtle text-secondary rounded-pill px-2 py-1">
                                            <i class="bi bi-dash-circle me-1"></i> Ended
                                        </span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(contracts)}">
                                    <td colspan="8" class="text-center py-4 text-muted">No contracts logged yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card slm-form-card shadow-sm">
                    <div class="card-header py-3 border-0">
                        <h5 class="mb-0 fw-semibold text-dark"><i class="bi bi-plus-circle me-2 text-primary"></i>Add Contract</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/contracts}" th:object="${contract}" method="post">
                            <div class="mb-3">
                                <label for="contractorSelect" class="form-label">Contractor</label>
                                <select id="contractorSelect" class="form-select" th:field="*{contractor}">
                                    <option th:each="s : ${contractors}" th:value="${s.id}" th:text="${s.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="contractTitle" class="form-label">Title <span class="text-danger">*</span></label>
                                <input type="text" id="contractTitle" th:field="*{title}" class="form-control" placeholder="e.g. Fiber Internet 1Gbps" required>
                            </div>
                            <div class="mb-3">
                                <label for="fee" class="form-label">Fee (€/period) <span class="text-danger">*</span></label>
                                <input type="number" id="fee" step="0.01" th:field="*{fee}" class="form-control" placeholder="0.00" required>
                            </div>
                            <div class="mb-3">
                                <label for="startDate" class="form-label">Start Date <span class="text-danger">*</span></label>
                                <input type="date" id="startDate" th:field="*{startDate}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="initialEndDate" class="form-label">Initial End Date (Mindestlaufzeit) <span class="text-danger">*</span></label>
                                <input type="date" id="initialEndDate" th:field="*{initialEndDate}" class="form-control" required>
                                <div class="form-text">End of the minimum commitment term. Auto-extends if not canceled.</div>
                            </div>
                            <div class="mb-3 form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="autoExtension" th:field="*{autoExtension}">
                                <label class="form-check-label" for="autoExtension">Auto-Extends after Initial End Date</label>
                            </div>
                            <div class="mb-3">
                                <label for="autoExtensionMonths" class="form-label">Extension Period (Months)</label>
                                <input type="number" id="autoExtensionMonths" th:field="*{autoExtensionMonths}" class="form-control" min="1" value="1">
                            </div>
                            <div class="mb-3 form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="isActive" th:field="*{isActive}">
                                <label class="form-check-label" for="isActive">Currently Active</label>
                            </div>
                            <div class="border-top pt-3 mt-3">
                                <div class="mb-3 form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="isCanceled" th:field="*{isCanceled}">
                                    <label class="form-check-label text-warning-emphasis fw-semibold" for="isCanceled">Mark as Canceled</label>
                                </div>
                                <div class="mb-3">
                                    <label for="terminationDate" class="form-label">Effective Termination Date</label>
                                    <input type="date" id="terminationDate" th:field="*{terminationDate}" class="form-control">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                                <i class="bi bi-plus-circle me-1"></i> Add Contract
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

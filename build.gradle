plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0-M2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '1.1.14'
	id 'jacoco'
}

group = 'de.oberamsystems'
version = '0.0.2c'
description = "simon's life manager"

springBoot {
	buildInfo()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(27)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'jakarta.mail:jakarta.mail-api'
	implementation 'org.webjars:bootstrap:5.3.8'
	implementation 'io.hypersistence:hypersistence-utils-hibernate-73:3.16.0'
	implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.26' // fixes a CVE
	implementation 'tools.jackson.core:jackson-databind:3.2.3' // fixes a CVE
        implementation 'tools.jackson.core:jackson-core:3.2.3' // fixes a CVE
	implementation 'org.apache.commons:commons-lang3:3.21.0' // fixes a CVE
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = true
        html.required = true
    }
}

task getDeps(type: Copy) {
  from sourceSets.main.runtimeClasspath
  into 'runtime/'
}

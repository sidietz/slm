plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0-RC1'
	id 'io.spring.dependency-management' version '1.1.7'
	//id 'org.graalvm.buildtools.native' version '1.1.14'
	id 'jacoco'
}

group = 'de.oberamsystems'
version = '0.0.3-rc16'
description = "simon's life manager"

springBoot {
	buildInfo()
}

dependencyManagement {
	imports {
		mavenBom 'org.junit:junit-bom:6.1.3'
		mavenBom 'org.springframework.ai:spring-ai-bom:2.0.1'
	}
	dependencies {
		dependency 'tools.jackson.core:jackson-databind:3.2.3'
		dependency 'tools.jackson.core:jackson-core:3.2.3'
		dependency 'com.fasterxml.jackson.core:jackson-annotations:2.22'
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(27)
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://repo.spring.io/milestone' }
	maven { url = 'https://repo.spring.io/snapshot' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'jakarta.mail:jakarta.mail-api'
	implementation 'org.webjars:bootstrap:5.3.8'
	implementation 'io.hypersistence:hypersistence-utils-hibernate-73:3.16.0'
	implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.26' // fixes a CVE
	implementation enforcedPlatform('tools.jackson:jackson-bom:3.2.3')
	implementation 'tools.jackson.core:jackson-databind'
	implementation 'tools.jackson.core:jackson-core'
	implementation 'com.fasterxml.jackson.core:jackson-annotations'
	implementation 'org.apache.commons:commons-lang3:3.21.0' // fixes a CVE
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation enforcedPlatform('org.junit:junit-bom:6.1.3')
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
	testImplementation 'org.testcontainers:postgresql:1.21.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	include '**/*Test.class', '**/*IT.class'
	finalizedBy jacocoTestReport
}


jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = true
        html.required = true
    }
}

task getDeps(type: Copy) {
  from sourceSets.main.runtimeClasspath
  into 'runtime/'
}
